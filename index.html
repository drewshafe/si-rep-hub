<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShipInsure Rep Hub 🛠️</title>
    <link rel="icon" type="image/png" href="Rephubfavi.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --header-grad: linear-gradient(135deg, #4a5fc1 0%, #6b7fd7 100%);
            --accent: #4a5fc1;
            --sidebar-width: 330px;
        }

        html, body { height: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Sidebar dock ── */
        .layout {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--header-grad);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            box-shadow: 4px 0 20px rgba(0,0,0,0.25);
            z-index: 10;
            transition: margin-left 0.25s ease;
        }

        .sidebar.collapsed { margin-left: calc(-1 * var(--sidebar-width)); }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 16px 16px 14px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .logo-img { height: 40px; }

        /* Active merchant chip (Merchant Folders) */
        .am-chip { display:flex; align-items:center; gap:10px; margin:10px 12px 2px; padding:8px 10px; border-radius:10px; border:1px solid rgba(255,255,255,0.28); background:rgba(255,255,255,0.10); color:#fff; font:inherit; text-align:left; cursor:pointer; }
        .am-chip:hover { background:rgba(255,255,255,0.18); }
        .am-chip.is-none { border-style:dashed; }
        .am-logo { width:30px; height:30px; flex:0 0 auto; border-radius:8px; background:rgba(255,255,255,0.9); color:#4a5fc1; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; overflow:hidden; }
        .am-logo img { width:100%; height:100%; object-fit:contain; }
        .am-text { flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.2; }
        .am-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; opacity:.7; }
        .am-name { font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .am-caret { opacity:.6; font-size:16px; }
        .sidebar.collapsed .am-chip { display:none; }
        body.pm .am-chip { border-color:rgba(212,175,55,.35); background:linear-gradient(150deg,#191a22 0%,#0b0c12 100%); color:#ece6d6; }
        body.pm .am-logo { background:#1a1a20; color:#e9c46a; }

        .app-title {
            font-size: 1.05em;
            font-weight: 700;
            color: white;
            line-height: 1.2;
        }

        .app-subtitle {
            font-size: 0.72em;
            font-weight: 500;
            color: rgba(255,255,255,0.75);
        }

        .nav {
            flex: 1;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 12px;
            border-radius: 8px;
            color: rgba(255,255,255,0.9);
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background: transparent;
            text-align: left;
            width: 100%;
            transition: background 0.15s;
            position: relative;
        }

        .nav-item:hover { background: rgba(255,255,255,0.12); }

        .nav-item.active {
            background: white;
            color: var(--accent);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .nav-item .emoji { font-size: 1.15em; flex-shrink: 0; }

        .nav-item .key-hint {
            margin-left: auto;
            font-size: 0.75em;
            font-weight: 700;
            opacity: 0.45;
            border: 1px solid currentColor;
            border-radius: 4px;
            padding: 1px 5px;
        }

        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid rgba(255,255,255,0.2);
            font-size: 0.72em;
            color: rgba(255,255,255,0.6);
        }

        /* ── ⚙ Customize tabs ── */
        .sidebar-footer { flex-wrap:wrap; }
        .nav-item .nav-ext { font-size:0.85em; opacity:0.6; margin-left:4px; }
        .tc-row .tc-edit-btn { width:auto; padding:0 9px; }
        .tc-edit { margin:-2px 0 4px; border:1px solid #c9cdf8; border-radius:10px; background:#f7f8ff; padding:12px; display:grid; grid-template-columns:70px 1fr; gap:8px; align-items:center; }
        .tc-edit.is-kid { margin-left:26px; }
        .tc-edit label { font-size:12px; font-weight:700; color:#4a4f6e; }
        .tc-edit input, .tc-edit select { font:inherit; font-size:13px; border:1px solid #d8dbe8; border-radius:8px; padding:7px 9px; min-width:0; background:#fff; }
        .tc-logo-box { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
        .tc-logo-prev { height:34px; max-width:170px; object-fit:contain; background:linear-gradient(135deg,#4a5fc1,#6b7fd7); border-radius:6px; padding:4px 8px; }
        .tc-edit .tc-mini { font:inherit; font-size:12px; font-weight:700; border:1px solid #d8dbe8; background:#fff; color:#4a4f6e; border-radius:6px; padding:5px 9px; cursor:pointer; }
        .tc-edit .tc-edit-actions { grid-column:1/-1; display:flex; gap:8px; justify-content:flex-end; }
        .tc-edit .tc-edit-actions .tc-save { background:#4a5fc1; border-color:#4a5fc1; color:#fff; }
        .tc-edit .tc-edit-actions .tc-reset1 { margin-right:auto; color:#c0392b; border-color:#f1c6c0; }
        .tc-row select { font:inherit; font-size:12px; border:1px solid #d8dbe8; border-radius:6px; padding:4px 6px; background:#fff; color:#4a4f6e; }
        .tabs-cust-btn { display:block; flex:0 0 100%; width:100%; margin:0 0 8px; padding:7px 10px; border-radius:8px; border:1px dashed rgba(255,255,255,0.45); background:transparent; color:#fff; font:inherit; font-size:1.08em; font-weight:700; cursor:pointer; text-align:left; }
        .tabs-cust-btn:hover { background:rgba(255,255,255,0.12); border-style:solid; }
        .tc-back { position:fixed; inset:0; z-index:500; background:rgba(14,16,40,0.45); display:flex; align-items:center; justify-content:center; padding:20px; }
        .tc-modal { width:min(560px, 100%); max-height:calc(100vh - 40px); overflow:auto; background:#fff; color:#1d2240; border-radius:16px; box-shadow:0 24px 70px rgba(0,0,0,0.35); padding:22px 22px 18px; font-size:14px; }
        .tc-modal h3 { font-size:18px; margin:0 0 4px; }
        .tc-modal .tc-sub { color:#6b7090; font-size:12.5px; margin:0 0 14px; line-height:1.45; }
        .tc-list { display:flex; flex-direction:column; gap:6px; }
        .tc-row { display:flex; align-items:center; gap:8px; border:1px solid #e3e5f2; border-radius:10px; padding:7px 10px; background:#fafbff; }
        .tc-row.is-off { opacity:0.55; }
        .tc-row.is-kid { margin-left:26px; background:#fff; }
        .tc-row .tc-name { flex:1; min-width:0; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .tc-row .tc-tag { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:#4a5fc1; background:#eef0ff; border-radius:20px; padding:2px 7px; }
        .tc-row button { font:inherit; border:1px solid #d8dbe8; background:#fff; border-radius:6px; width:28px; height:28px; cursor:pointer; color:#4a4f6e; }
        .tc-row button:disabled { opacity:.3; cursor:default; }
        .tc-row .tc-del { color:#c0392b; border-color:#f1c6c0; }
        .tc-sw { display:flex; align-items:center; gap:5px; font-size:12.5px; color:#4a4f6e; cursor:pointer; white-space:nowrap; }
        .tc-add { margin-top:16px; border-top:1px solid #eceef6; padding-top:14px; display:grid; grid-template-columns:62px 1fr; gap:8px; }
        .tc-add .tc-h { grid-column:1/-1; font-weight:700; font-size:13px; }
        .tc-add input, .tc-add select { font:inherit; font-size:13px; border:1px solid #d8dbe8; border-radius:8px; padding:8px 10px; min-width:0; }
        .tc-add .tc-full { grid-column:1/-1; }
        .tc-add .tc-note { grid-column:1/-1; font-size:11.5px; color:#6b7090; }
        .tc-err { grid-column:1/-1; color:#c0392b; font-size:12px; }
        .tc-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
        .tc-actions button { font:inherit; font-weight:700; border-radius:8px; padding:9px 16px; cursor:pointer; border:1px solid #d8dbe8; background:#fff; color:#4a4f6e; }
        .tc-actions .tc-primary { background:#4a5fc1; border-color:#4a5fc1; color:#fff; }
        .tc-actions .tc-reset { margin-right:auto; color:#c0392b; border-color:#f1c6c0; }

        /* ── Main content ── */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: #f4f5fb;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            background: white;
            border-bottom: 2px solid #e0e3f5;
            flex-shrink: 0;
        }

        .toolbar-title {
            font-size: 0.92em;
            font-weight: 700;
            color: #333;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            font-size: 0.8em;
            font-weight: 600;
            border-radius: 6px;
            border: 1px solid #d5d9f0;
            background: #f4f5fb;
            color: var(--accent);
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
            transition: background 0.15s;
        }

        .btn:hover { background: #e6e9f8; }

        .frame-wrap {
            flex: 1;
            position: relative;
            min-height: 0;
        }

        .frame-wrap iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: white;
            display: none;
        }

        .frame-wrap iframe.visible { display: block; }

        /* Custom Build stacked beneath the ROI calc (hub-only). Cross-origin iframes
           can't auto-size to their content, and carving the fixed viewport into two
           panes left each too short to use — so instead the whole area scrolls as one,
           with the calc on top and the editor below at natural working heights. */
        .frame-wrap.cb-stacked { overflow-y: auto; }
        .frame-wrap.cb-stacked iframe.cb-top { position: relative; inset: auto; display: block !important; width: 100%; height: 820px; }
        .frame-wrap.cb-stacked iframe.cb-bottom { position: relative; inset: auto; display: block !important; width: 100%; height: 1150px; border-top: 3px solid #4656c7; box-shadow: 0 -5px 18px rgba(0,0,0,0.12); }

        .copied-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #333;
            color: white;
            font-size: 0.85em;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 8px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.3);
            transition: transform 0.25s ease;
            z-index: 100;
        }

        .copied-toast.show { transform: translateX(-50%) translateY(0); }

        /* ── ROI Master Calculator logo label ── */
        .nav-item .nav-logo { max-width: 190px; max-height: 40px; width: auto; height: auto; display: block; }
        .nav-item.has-logo { padding: 10px 12px; }

        /* ── Grouped sub-tabs (Other Calculator) ── */
        .nav-item.nav-group .group-caret {
            margin-left: auto; font-size: 0.85em; opacity: 0.7;
            transition: transform 0.25s ease;
        }
        .nav-item.nav-group .group-caret + .key-hint { margin-left: 8px; }
        .nav-item.nav-group.expanded { background: rgba(255,255,255,0.14); }
        .nav-item.nav-group.expanded .group-caret { transform: rotate(180deg); }
        .nav-sub {
            display: flex; flex-direction: column; gap: 6px;
            max-height: 0; overflow: hidden; opacity: 0;
            margin-left: 12px; padding-left: 8px;
            border-left: 2px solid rgba(255,255,255,0.16);
            transition: max-height 0.3s ease, opacity 0.25s ease, margin 0.25s ease;
        }
        .nav-sub.open { max-height: 320px; opacity: 1; margin-top: 3px; margin-bottom: 3px; }
        .nav-sub-item.has-logo { padding: 8px 12px; }
        .nav-sub-item .nav-logo { max-width: 155px; max-height: 32px; }

        /* ── REP Inputs sub-panel (compact; drives the ROI calc iframe via postMessage) ── */
        .rep-inputs {
            display: none;
            flex-direction: column;
            gap: 6px;
            margin: 1px 2px 7px;
            padding: 9px 9px 10px;
            background: rgba(255,255,255,0.10);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 9px;
        }
        .rep-inputs.show { display: flex; }
        /* Sub-tab nav (Coverage / Saved Calcs / Display) */
        .ri-subnav { display: flex; gap: 4px; margin: 2px 0 3px; }
        .ri-subtab { flex: 1; font-size: 0.58em; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em;
            padding: 6px 3px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.08);
            color: #dfe3fb; cursor: pointer; font-family: inherit; transition: all 0.12s; }
        .ri-subtab:hover { background: rgba(255,255,255,0.16); }
        .ri-subtab.active { background: #fff; color: var(--accent); border-color: #fff; }
        .ri-pane { display: none; flex-direction: column; gap: 6px; }
        .ri-pane.active { display: flex; }
        .ri-saved-list.ri-saved-pane { display: block; max-height: 340px; }
        .ri-cov.ri-cov-noprotect.active { background: #b0392b; border-color: #b0392b; }
        body.pm .ri-subtab { background: linear-gradient(150deg,#191a22,#0b0c12); color: #d9d9e6; border-color: rgba(212,175,55,.3); }
        body.pm .ri-subtab.active { background: linear-gradient(150deg,#2a2b36,#141520); color: #f5d67b; border-color: rgba(233,196,106,.6); }
        .ri-h {
            font-size: 0.6em;
            font-weight: 800;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            color: #c7cffb;
        }
        /* Collapsible sidebar sections (Save/Load, Plan Options, Pricing, Upfront) */
        .ri-sec { margin: 3px 0 5px; }
        .ri-sec-h { display: flex; align-items: center; gap: 6px; width: 100%; background: none; border: none;
            cursor: pointer; padding: 4px 0; font-size: 0.6em; font-weight: 800; letter-spacing: 0.09em;
            text-transform: uppercase; color: #c7cffb; text-align: left; font-family: inherit; }
        .ri-sec-caret { font-size: 0.95em; line-height: 1; opacity: 0.85; }
        .ri-sec.collapsed .ri-sec-body { display: none; }
        .ri-sec-body { display: flex; flex-direction: column; gap: 5px; }
        body.pm .ri-sec-h { color: #e9c46a; }
        .ri-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .ri-col { display: flex; flex-direction: column; gap: 5px; }
        .ri-toggle {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 7px;
            font-size: 0.66em;
            font-weight: 700;
            line-height: 1.15;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.35);
            background: rgba(255,255,255,0.92);
            color: #3a3a5a;
            cursor: pointer;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.15s;
        }
        .ri-toggle .dot {
            width: 8px; height: 8px; border-radius: 50%;
            border: 1.5px solid #b9bfe0; flex-shrink: 0; background: transparent;
        }
        .ri-toggle.active { background: #fff; color: var(--accent); border-color: var(--accent); box-shadow: 0 1px 5px rgba(0,0,0,0.16); }
        .ri-toggle.active .dot { background: var(--accent); border-color: var(--accent); }
        .ri-toggle.disabled { opacity: 0.4; cursor: not-allowed; }
        .ri-field, .ri-sel {
            width: 100%;
            padding: 5px 7px;
            font-size: 0.68em;
            font-weight: 600;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.35);
            background: rgba(255,255,255,0.92);
            color: #3a3a5a;
        }
        .ri-field:focus, .ri-sel:focus { outline: none; border-color: #fff; background: #fff; }
        .ri-btn-row { display: flex; gap: 5px; position: relative; }
        .ri-btn {
            flex: 1;
            display: inline-flex; align-items: center; justify-content: center; gap: 4px;
            padding: 5px 6px;
            font-size: 0.66em; font-weight: 700;
            border-radius: 6px; border: 1px solid rgba(255,255,255,0.35);
            background: rgba(255,255,255,0.92); color: #3a3a5a;
            cursor: pointer; white-space: nowrap;
        }
        .ri-btn:hover { background: #fff; }
        .ri-sel-row { display: flex; gap: 5px; align-items: flex-end; }
        .ri-sel-row > div { flex: 1; min-width: 0; }
        .ri-lbl { font-size: 0.56em; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: #c7cffb; margin-bottom: 2px; display: block; }

        /* Coverage Mode row (shown only when Returns / Returns Offset is on) */
        .ri-coverage { display: none; }
        .ri-coverage.show { display: block; }
        .ri-cov-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
        .ri-provider { font-size: 0.62em; padding: 3px 6px; border: 1px solid #cfd4e8; border-radius: 6px; background: #fff; color: #333; font-family: inherit; cursor: pointer; }
        body.pm .ri-provider { background:#14141c; color:#e8e8ee; border-color:rgba(233,196,106,.4); }
        .ri-cov-btns { display: flex; flex-wrap: wrap; gap: 4px; }
        .ri-cov {
            padding: 4px 7px; font-size: 0.62em; font-weight: 700;
            border-radius: 5px; border: 1px solid rgba(255,255,255,0.35);
            background: rgba(255,255,255,0.88); color: #3a3a5a; cursor: pointer; white-space: nowrap;
        }
        .ri-cov.active { background: #2e7d32; color: #fff; border-color: #2e7d32; }

        /* Saved-configs dropdown (scrollable, non-clipping) */
        .ri-saved-list {
            display: none;
            margin-top: 4px;
            max-height: 210px;
            overflow-y: auto;
            background: #fff;
            border: 1px solid #d5d9f0;
            border-radius: 7px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.22);
        }
        .ri-saved-list.show { display: block; }
        .ri-saved-item {
            display: flex; align-items: center; justify-content: space-between; gap: 6px;
            padding: 6px 8px; font-size: 0.66em; color: #333; cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
        }
        .ri-saved-item:last-child { border-bottom: none; }
        .ri-saved-item:hover { background: #eef0fb; }
        .ri-saved-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ri-saved-date { color: #adb5bd; flex-shrink: 0; font-size: 0.9em; }
        .ri-saved-empty { padding: 10px 8px; font-size: 0.64em; color: #adb5bd; text-align: center; }
        /* Multi-select delete bar */
        .ri-saved-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px;
            padding: 6px 8px; border-bottom: 1px solid #e6e8f5; background: #f7f8ff; position: sticky; top: 0; z-index: 1; }
        .ri-saved-selall { display: flex; align-items: center; gap: 5px; font-size: 0.62em; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.3px; color: #6c757d; cursor: pointer; }
        .ri-saved-del { font-size: 0.62em; font-weight: 800; color: #fff; background: #dc3545; border: none;
            border-radius: 6px; padding: 4px 10px; cursor: pointer; }
        .ri-saved-del:disabled { background: #d6bcc0; cursor: default; opacity: 0.7; }
        .ri-saved-cb { flex-shrink: 0; cursor: pointer; margin: 0; }

        /* Cloud Folders — pick & order scenarios into a merchant options link */
        .ri-opt-cb { flex-shrink: 0; cursor: pointer; margin: 0; }
        .ri-opt-ord { flex-shrink: 0; width: 15px; height: 15px; border-radius: 50%; font-size: 0.82em;
            font-weight: 800; color: #fff; background: #6675FF; display: none; align-items: center;
            justify-content: center; line-height: 1; }
        .ri-opt-ord.on { display: inline-flex; }
        .ri-opt-bar { display: none; gap: 6px; padding: 5px 8px 9px; }
        .ri-opt-bar .ri-btn { font-size: 0.64em; }
        body.pm .ri-opt-ord { background: #d4af37; color: #1a1205; }

        /* Paste-a-link loader */
        .ri-loadlink { display: flex; gap: 5px; margin-bottom: 2px; }
        .ri-loadlink .ri-field { flex: 1; min-width: 0; }
        .ri-loadlink .ri-btn { flex: 0 0 auto; }

        /* Upfront Rev Share — rep picks a tier, no auto-suggestion */
        .ri-upfront-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
        .ri-upfront-elig {
            font-size: 0.56em; font-weight: 800; padding: 2px 6px; border-radius: 4px;
            white-space: nowrap; text-transform: uppercase; letter-spacing: 0.03em;
        }
        .ri-upfront-elig.ok   { background: rgba(255,255,255,0.15); color: #b7f5c9; }
        .ri-upfront-elig.warn { background: #c0392b; color: #fff; }
        .ri-upfront-mo { font-weight: 500; opacity: 0.75; font-size: 0.9em; }

    <div class="copied-toast" id="toast">Link copied!</div>

    <script>
        const TOOLS = [
            // Merchant Folders — the Hub's home base: one cloud folder per merchant holding every tool's saves.
            { id: 'folders',      emoji: '📁', name: 'Merchant Folders', url: 'https://drewshafe.github.io/si-rep-hub/folders.html' },
            { id: 'roi',          emoji: '📦', logo: 'roibuilder_logo.png', logoLight: 'roibuilder_logo.png', name: 'ROI Builder', url: 'https://drewshafe.github.io/si-roi-calculator/' },
            { id: 'proposal',     emoji: '📄', logo: 'proposal_logo.png',   logoLight: 'proposal_logo_light.png', name: 'Proposal & MSA Generator',          url: 'https://drewshafe.github.io/si-proposal/' },
            // Merchant Vault — in-house deal rooms (one link per merchant: deck, designs, team, action plan).
            { id: 'vault',        emoji: '🔐', logo: 'merchantvault_logo.png', logoLight: 'merchantvault_logo_light.png', name: 'Merchant Vault', url: 'https://drewshafe.github.io/si-merchant-vault/' },
            // Custom Build is reached from the ROI tab's "Custom" sub-tab, not the nav.
            { id: 'custom-build', emoji: '🛠️', name: 'Custom Build', url: 'https://drewshafe.github.io/si-roi-calculator/custom-build.html', hidden: true },
            // "Preview Designer" is a group header — clicking it reveals its sub-tabs below.
            { id: 'preview',      emoji: '🎨', logo: 'previewdesigner_logo.png', logoLight: 'previewdesigner_logo_light.png', name: 'Preview Designer', group: true, children: ['widget-designer', 'email-automation', 'claim-wizard'] },
            { id: 'widget-designer',   emoji: '🛒', logo: 'checkoutexp_logo.png',   logoLight: 'checkoutexp_logo.png',   name: 'Checkout Experience', url: 'https://drewshafe.github.io/si-widget-designer/',   parent: 'preview' },
            { id: 'email-automation',  emoji: '✉️', logo: 'emailbranding_logo.png',  logoLight: 'emailbranding_logo.png',  name: 'Email Automation',    url: 'https://drewshafe.github.io/si-email-automation/', parent: 'preview' },
            { id: 'claim-wizard',      emoji: '🪄', logo: 'claimwiz_logo.png',       logoLight: 'claimwiz_logo.png',       name: 'Claim Wizard',        url: 'https://drewshafe.github.io/si-claim-wizard/',     parent: 'preview' },
            // Gorgias Calculator: off by default (the "Other Calculators" group is retired);
            // reps can switch it back on in ⚙ Customize tabs. Self-Insured + Competitor
            // Comparison were merged into the ROI Builder's "Competitor" calc type.
            { id: 'gorgias',      emoji: '🤝', logo: 'gorgias_logo.png',    logoLight: 'gorgias_logo_light.png',   name: 'Gorgias Calculator',          url: 'https://drewshafe.github.io/si-gorgias-roi-calculator/' },
        ];

        // ── Tab layout (per rep, this browser): order, shown/hidden, custom tabs ──
        // Proposal & MSA Generator is off by default but still loads behind the ROI Builder's
        // "Proposal" sub-tab (stacked view), so it stays in TOOLS.
        const LAYOUT_KEY = 'si_hub_layout';
        const DEFAULT_LAYOUT = () => ({ order: ['folders', 'roi', 'vault', 'preview', 'proposal', 'gorgias'], foldersSeeded: true, off: ['proposal', 'gorgias'], custom: [], look: {},
                                        kids: { preview: ['widget-designer', 'email-automation', 'claim-wizard'] } });
        let layout = (() => { try { return Object.assign(DEFAULT_LAYOUT(), JSON.parse(localStorage.getItem(LAYOUT_KEY) || 'null') || {}); } catch (e) { return DEFAULT_LAYOUT(); } })();
        if (!layout.look) layout.look = {};
        // Reps who customized their tabs before Merchant Folders existed get it at the top once.
        if (!layout.foldersSeeded) {
            layout.order = ['folders'].concat((layout.order || []).filter(id => id !== 'folders'));
            layout.foldersSeeded = true;
            try { localStorage.setItem('si_hub_layout', JSON.stringify(layout)); } catch (e) {}
        }
        const saveLayout = () => { try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(layout)); } catch (e) {} };
        // ext: open in its own browser tab instead of inside the hub (sites that block framing,
        // or need Google / SSO sign-in, which refuses to run inside a frame).
        // Open an outside tab the way a clicked link would (target=_blank), so Chrome can hand it to an
        // installed app that claims the link ("Open supported links" → the app's own window).
        const openExternal = url => { const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); };
        const customTool = c => ({ id: c.id, emoji: c.emoji || '🔗', name: c.name, url: c.url, parent: c.parent || undefined, custom: true, ext: !!c.ext });
        (layout.custom || []).forEach(c => TOOLS.push(customTool(c)));
        // Per-tab look (name, emoji, logo or text) — layout.look[id] = {name, emoji, mode:'logo'|'text', logo:dataURL}
        const ORIG = {};
        const snapOrig = t => { if (!ORIG[t.id]) ORIG[t.id] = { name: t.name, emoji: t.emoji, logo: t.logo || null, logoLight: t.logoLight || null }; };
        function applyLook(t) {
            snapOrig(t);
            const o = ORIG[t.id], L = (layout.look || {})[t.id] || {};
            t.name = L.name || o.name; t.emoji = L.emoji || o.emoji;
            if (L.mode === 'text') { t.logo = null; t.logoLight = null; }
            else if (L.logo) { t.logo = L.logo; t.logoLight = L.logo; }
            else { t.logo = o.logo; t.logoLight = o.logoLight; }
            t.customLook = !!(L.logo || L.mode === 'text');
        }
        TOOLS.forEach(applyLook);
        const isOff = id => (layout.off || []).includes(id);
        // Top-level tabs in the rep's order (anything new/unknown appended), and a group's children likewise.
        const topTools = () => {
            const tops = TOOLS.filter(t => !t.hidden && !t.parent);
            const known = (layout.order || []).map(id => tops.find(t => t.id === id)).filter(Boolean);
            return known.concat(tops.filter(t => !known.includes(t)));
        };
        const kidTools = g => {
            const kids = TOOLS.filter(t => t.parent === g.id && !t.hidden);
            const known = ((layout.kids || {})[g.id] || []).map(id => kids.find(t => t.id === id)).filter(Boolean);
            return known.concat(kids.filter(t => !known.includes(t)));
        };

        const nav = document.getElementById('nav');
        const frameWrap = document.getElementById('frameWrap');
        const toolbarTitle = document.getElementById('toolbarTitle');
        const openBtn = document.getElementById('openBtn');
        const toast = document.getElementById('toast');
        const frames = {};
        let activeId = null;

        let RENDERED = [];
        let repInputsEl = null;
        function renderNav() {
            nav.innerHTML = '';
            RENDERED = [];
            const addBtn = (tool, into) => {
                const i = RENDERED.length; RENDERED.push(tool);
                const btn = document.createElement('button');
                btn.className = 'nav-item' + (tool.logo ? ' has-logo' : '') + (tool.group ? ' nav-group' : '') + (tool.parent ? ' nav-sub-item' : '') + (tool.customLook ? ' custom-look' : '');
                btn.id = 'nav-' + tool.id;
                const caret = tool.group ? '<span class="group-caret">▾</span>' : '';
                const hint = i < 9 ? `<span class="key-hint">${i + 1}</span>` : '';
                btn.innerHTML = tool.logo
                    ? `<img class="nav-logo">${caret}${hint}`
                    : `<span class="emoji"></span><span class="nav-name"></span>${caret}${hint}`;
                if (tool.logo) { const im = btn.querySelector('.nav-logo'); im.src = tool.logoLight || tool.logo; im.alt = tool.name; }
                else { btn.querySelector('.emoji').textContent = tool.emoji; btn.querySelector('.nav-name').textContent = tool.name; }
                if (tool.ext) {
                    btn.title = tool.name + ' — opens in a new browser tab';
                    btn.querySelector('.nav-name') && btn.querySelector('.nav-name').insertAdjacentHTML('afterend', '<span class="nav-ext">↗</span>');
                }
                btn.addEventListener('click', () => tool.ext ? openExternal(tool.url) : activate(tool.id));
                (into || nav).appendChild(btn);
            };
            topTools().filter(t => !isOff(t.id)).forEach(tool => {
                if (tool.group) {
                    // A group header gets an (initially collapsed) container holding its shown sub-tabs.
                    const kids = kidTools(tool).filter(k => !isOff(k.id));
                    if (!kids.length) return;
                    tool.children = kids.map(k => k.id);
                    addBtn(tool);
                    const sub = document.createElement('div');
                    sub.className = 'nav-sub';
                    sub.id = 'nav-sub-' + tool.id;
                    nav.appendChild(sub);
                    kids.forEach(k => addBtn(k, sub));
                } else {
                    addBtn(tool);
                    // The ROI Master Calculator tab has a "REP Inputs" sub-panel that drives
                    // the calculator iframe live via postMessage (built once, kept across re-renders).
                    if (tool.id === 'roi') { if (!repInputsEl) repInputsEl = buildRepInputs(); nav.appendChild(repInputsEl); }
                }
            });
            const kh = document.getElementById('keyHint');
            if (kh) kh.textContent = RENDERED.length ? 'Press 1–' + Math.min(9, RENDERED.length) + ' to switch tools' : '';

        // ── REP Inputs panel (mirrors the calc's ShipInsure Inputs, drives it live) ──
        // Turn the sidebar's section headers into collapsible dropdowns so reps can hide
        // the parts they aren't using. Save/Load + Upfront default collapsed; the primary
        // Plan Options + Pricing default open.
        function hubCollapsibles(p) {
            const caret = c => '<span class="ri-sec-caret">' + (c ? '▸' : '▾') + '</span>';
            const makeSec = (title, nodes, collapsed) => {
                if (!nodes.length) return;
                const parent = nodes[0].parentNode;
                const sec = document.createElement('div'); sec.className = 'ri-sec' + (collapsed ? ' collapsed' : '');
                const h = document.createElement('button'); h.type = 'button'; h.className = 'ri-sec-h'; h.innerHTML = caret(collapsed) + title;
                const body = document.createElement('div'); body.className = 'ri-sec-body';
                parent.insertBefore(sec, nodes[0]);
                sec.appendChild(h); sec.appendChild(body);
                nodes.forEach(n => body.appendChild(n));
                h.addEventListener('click', () => { const c = sec.classList.toggle('collapsed'); const cr = h.querySelector('.ri-sec-caret'); if (cr) cr.textContent = c ? '▸' : '▾'; });
            };
            // Save / Load Options — the top block (merchant name + save/saved + cloud folders)
            const saveCol = p.querySelector(':scope > .ri-col');
            if (saveCol) makeSec('Save / Load Options', [saveCol], true);
            const cov = p.querySelector('.ri-pane[data-pane="coverage"]');
            if (cov) {
                // Each .ri-h header + its following siblings (until the next header / upfront / SI-net) → a section.
                const kids = Array.from(cov.children);
                for (let i = 0; i < kids.length; i++) {
                    const node = kids[i];
                    if (!(node.classList && node.classList.contains('ri-h'))) continue;
                    const title = node.textContent.trim();
                    const group = []; let j = i + 1;
                    while (j < kids.length) { const k = kids[j]; if (k.classList && (k.classList.contains('ri-h') || k.classList.contains('ri-upfront') || k.classList.contains('ri-sinet'))) break; group.push(k); j++; }
                    const sec = document.createElement('div'); sec.className = 'ri-sec';
                    const h = document.createElement('button'); h.type = 'button'; h.className = 'ri-sec-h'; h.innerHTML = caret(false) + title;
                    const body = document.createElement('div'); body.className = 'ri-sec-body';
                    cov.insertBefore(sec, node); sec.appendChild(h); sec.appendChild(body);
                    group.forEach(n => body.appendChild(n));
                    node.remove();
                    h.addEventListener('click', () => { const c = sec.classList.toggle('collapsed'); const cr = h.querySelector('.ri-sec-caret'); if (cr) cr.textContent = c ? '▸' : '▾'; });
                }
                // Upfront Rev Share → its own collapsible (hide the now-redundant inner label).
                const up = cov.querySelector('.ri-upfront');
                if (up) { makeSec('Upfront Rev Share', [up], true); const lbl = up.querySelector('.ri-upfront-head .ri-lbl'); if (lbl) lbl.style.display = 'none'; }
            }
        }

            const loadFromLink = () => {

                // A ?id= link is a cloud config (branded, re-saveable) → prefer that path;
                // otherwise stash the raw link for the styler's ?base= importer (bld + cbimg).
                try {
                    const pid = new URLSearchParams(search).get('id');
                    _hubCloudId = pid || null;
                    _hubPastedLink = pid ? null : raw;
                } catch (e) { _hubCloudId = null; _hubPastedLink = raw; }
                activate('roi');
                // Preserve the #cbimg logo hash (not just the query) so a pasted custom link
                // shows its logo on the calc, not only its accent colors.
                if (frames['roi']) frames['roi'].src = 'https://drewshafe.github.io/si-roi-calculator/' + search + hash;
                // If the styler is already stacked, re-seed it live from the new link.
                if (_stackedTool === 'custom-build') { clearStack(); toggleStack('custom-build'); }
                inp.value = '';
            };
            p.querySelector('#ri-loadlink-btn').addEventListener('click', loadFromLink);
            p.querySelector('#ri-loadlink-input').addEventListener('keydown', e => { if (e.key === 'Enter') loadFromLink(); });
            // Display controls
            p.querySelectorAll('.ri-disp-btns button').forEach(btn => {
                btn.addEventListener('click', () => {
                    const t = btn.dataset.disp, v = btn.dataset.val;
                    if (t === 'zoom') {
                        repDisplay.zoom = Math.round((Math.min(1.5, Math.max(0.7, repDisplay.zoom + (v === 'inc' ? 0.1 : -0.1)))) * 100) / 100;
                    } else if (t === 'text') { repDisplay.textScale = parseFloat(v); }
                    else if (t === 'density') { repDisplay.density = v; }
                    else if (t === 'layout') { repDisplay.layout = v; }
                    saveDisplayPrefs(); syncDisplayUI(); sendDisplay();
                });
            });
            // Calc Type (Core / Competitor) — drives the calc; its own row above the sub-tabs.
            p.querySelectorAll('#ri-calctype-btns button').forEach(btn => {
                btn.addEventListener('click', () => {
                    p.querySelectorAll('#ri-calctype-btns button').forEach(b => b.classList.toggle('active', b === btn));
                    sendApply({ calcType: btn.dataset.calctype });
                });
            });
            setTimeout(syncDisplayUI, 0);
            return p;
        }

        function renderSavedList(configs) {
            const list = document.getElementById('ri-saved-list');
            if (!list) return;
            _savedSig = JSON.stringify((configs || []).map(c => c.name + '|' + (c.date || '')));
            if (!configs.length) {
                list.innerHTML = '<div class="ri-saved-empty">No saved configs yet — enter a merchant name and click 💾 Save.</div>';
                return;
            }
            const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            list.innerHTML =
                `<div class="ri-saved-actions">
                    <label class="ri-saved-selall"><input type="checkbox" id="ri-sel-all"> Select all</label>
                    <button class="ri-saved-del" id="ri-saved-del" disabled>Delete</button>
                </div>` +
                configs.map(c =>
                `<div class="ri-saved-item" data-name="${esc(c.name)}">
                    <input type="checkbox" class="ri-saved-cb" data-name="${esc(c.name)}" aria-label="Select ${esc(c.name)}">
                    <span class="ri-saved-name">${esc(c.name)}</span><span class="ri-saved-date">${esc(c.date || '')}</span>
                </div>`).join('');

            const delBtn = list.querySelector('#ri-saved-del');
            const selAll = list.querySelector('#ri-sel-all');
            const cbs = () => Array.from(list.querySelectorAll('.ri-saved-cb'));
            const refresh = () => {
                const checked = cbs().filter(cb => cb.checked);
                delBtn.disabled = checked.length === 0;
                delBtn.textContent = checked.length ? `Delete (${checked.length})` : 'Delete';
                if (selAll) selAll.checked = checked.length > 0 && checked.length === cbs().length;

        // ☁ Cloud Folders list — the rep's Supabase configs, grouped by merchant.

            list.querySelectorAll('.ri-opt-copy').forEach(btn => btn.addEventListener('click', (e) => {

                item.addEventListener('click', (e) => {

                    _hubPastedLink = null; // cloud config wins over any earlier pasted link

        let _hubCloudId = null; // the cloud config last loaded from ☁ Cloud Folders (so the Custom tab can open it branded)

        // Open Custom Build, loading a specific cloud config (branded) when one is set.
        function openCustomBuild(id) {

            const tool = TOOLS.find(t => t.id === toolId);

            if (!frames[toolId]) {

        let repState = {};

        function roiWin() { return frames['roi'] && frames['roi'].contentWindow; }

        // ── Rep display prefs (size/text/density/layout), persisted per rep ──
        function loadDisplayPrefs() {
            const def = { zoom: 1, textScale: 1, density: 'comfortable', layout: 'auto' };

        function sendDisplay() { const w = roiWin(); if (w) w.postMessage({ siHub: 'apply', display: repDisplay }, '*'); }
        function syncDisplayUI() {
            const zv = document.getElementById('ri-zoom-val');

            document.querySelectorAll('.ri-disp-btns button[data-disp="text"]').forEach(b => b.classList.toggle('active', parseFloat(b.dataset.val) === repDisplay.textScale));
            document.querySelectorAll('.ri-disp-btns button[data-disp="density"]').forEach(b => b.classList.toggle('active', b.dataset.val === repDisplay.density));
            document.querySelectorAll('.ri-disp-btns button[data-disp="layout"]').forEach(b => b.classList.toggle('active', b.dataset.val === repDisplay.layout));
        }
        function fillSelect(sel, options, value) {
            if (!sel || !options) return;
            if (sel.options.length !== options.length) {

            }
            if (value != null) sel.value = value;
        }
        function syncRepInputs(s) {
            const setT = (feat, on) => {
                const b = document.querySelector(`.ri-toggle[data-feat="${feat}"]`);
                if (b) b.classList.toggle('active', !!on);
            };
            setT('returns', s.returns); setT('cashback', s.cashback); setT('guarantee', s.guarantee);
            setT('returnsOffset', s.returnsOffset); setT('grossRevShare', s.grossRevShare);
            setT('hideCurrentCost', s.hideCurrentCost);
            // Returns Offset is exclusive: the calc forces returns on and cashback/
            // guarantee off, so disable those toggles while it's active.
            ['returns', 'cashback', 'guarantee'].forEach(f => {
                const b = document.querySelector(`.ri-toggle[data-feat="${f}"]`);
                if (b) b.classList.toggle('disabled', !!s.returnsOffset);
            });
            // Coverage Mode row: only relevant when returns or returns-offset is active.
            const cov = document.getElementById('ri-coverage');
            if (cov) {

                // Protection coverage highlights only when NOT in the No-Protection lens.
                cov.querySelectorAll('.ri-cov[data-cov]').forEach(b => b.classList.toggle('active', !s.returnsOffset && b.dataset.cov === s.coverage));
                const np = cov.querySelector('.ri-cov-noprotect');

                const prov = document.getElementById('ri-provider');

            fillSelect(document.getElementById('ri-pricing'), s.pricingOptions, s.pricing);
            fillSelect(document.getElementById('ri-claimres'), s.claimResOptions, s.claimResolution);
            // Min $ floor only shows for %-based pricing.
            const minpWrap = document.getElementById('ri-minp-wrap');

            if (minpWrap) minpWrap.style.display = (s.pricing === 'percentage') ? '' : 'none';
            if (minpInput && document.activeElement !== minpInput && typeof s.minPremium === 'string') minpInput.value = s.minPremium;

            const limitInput = document.getElementById('ri-limit');
            if (limitInput && document.activeElement !== limitInput && typeof s.limit === 'string') limitInput.value = s.limit;
            // Hybrid Coverage controls — mirror the calc's state; shown only for the Hybrid template.
            {
                const isHyb = (s.pricing === 'hybrid_coverage');
                const hMode = document.getElementById('ri-hybrid-mode');
                if (hMode && document.activeElement !== hMode && typeof s.hybridMode === 'string') hMode.value = s.hybridMode;
                const curMode = hMode ? hMode.value : 'optin_threshold';
                const hybRow = document.getElementById('ri-hybrid-row'), hybAbove = document.getElementById('ri-hybrid-above-row');
                if (hybRow) hybRow.style.display = isHyb ? '' : 'none';
                if (hybAbove) hybAbove.style.display = (isHyb && curMode !== 'no_threshold') ? '' : 'none';
                const _setIf = (id, val) => { const el = document.getElementById(id); if (el && document.activeElement !== el && typeof val === 'string') el.value = val; };
                _setIf('ri-hth', s.hybridThreshold); _setIf('ri-hao', s.hybridAboveOrders); _setIf('ri-hav', s.hybridAboveAov);
            }
            // Calc Type (Core / Competitor) — reflect the calc's current type.
            if (typeof s.calcType === 'string') {
                document.querySelectorAll('#ri-calctype-btns button').forEach(b => b.classList.toggle('active', b.dataset.calctype === (s.calcType === 'comp' ? 'comp' : 'core')));
            }
            const m = document.getElementById('ri-merchant');
            if (m && document.activeElement !== m && typeof s.merchantName === 'string') m.value = s.merchantName;
            const sc = document.getElementById('ri-saved-count');

            // Keep the saved list fresh if it's visible — but only re-render when the

        function fmtMoney(n) { return '$' + Math.round(n || 0).toLocaleString('en-US'); }

        // Upfront Rev Share — lets a rep front-load part of a year's Rev Share as

        // manually (no auto-suggestion); eligibility is a warning, not a block.
        //   Yearly Rev Share = Rev Share % × annual Net Revenue
        //   Upfront $         = Upfront Tier % × Yearly Rev Share

        function updateUpfrontDisplay() {

            });

            const isAnnual = s.viewMode === 'annual';
            const annualNetRevenue = isAnnual ? netRevPeriod : netRevPeriod * 12;
            const monthlyNetRevenue = isAnnual ? netRevPeriod / 12 : netRevPeriod;

            const eligEl = document.getElementById('ri-upfront-elig');
            if (eligEl) {
                const eligible = monthlyNetRevenue >= 2500;
                eligEl.textContent = eligible ? 'Eligible' : 'Below $2,500/mo min';
                eligEl.className = 'ri-upfront-elig ' + (eligible ? 'ok' : 'warn');
            }

            const resultsEl = document.getElementById('ri-upfront-results');
            if (!resultsEl) return;

            const yearlyRevShare = annualNetRevenue * revSharePct;

            document.getElementById('ri-upfront-yearly').textContent = fmtMoney(yearlyRevShare);

        // ── Merchant Folders: active-merchant chip + Load requests from the Folders tab ──
        const FOLDER_KIND_TOOL = { checkout: 'widget-designer', email: 'email-automation', claim: 'claim-wizard', proposal: 'proposal', msa: 'proposal', mnda: 'proposal' };
        function paintActiveMerchant() {

                const toolId = FOLDER_KIND_TOOL[d.kind], tool = TOOLS.find(t => t.id === toolId);
                activate(toolId);
                if (frames[toolId] && tool) frames[toolId].src = _withTheme(tool.url) + (_withTheme(tool.url).includes('?') ? '&' : '?') + 'asset=' + encodeURIComponent(d.id);
            }
        });

        function activate(id, updateHash = true) {
            const tool = TOOLS.find(t => t.id === id);
            if (!tool) return;
            // Group header: reveal its sub-tabs; keep the child already active, else open the first.
            if (tool.group) {
                const cur = TOOLS.find(t => t.id === activeId);
                if (cur && cur.parent === tool.id) { setGroupsForActive(activeId); return; }
                return activate((tool.children || [])[0], updateHash);
            }
            if (id === activeId) { setGroupsForActive(id); return; }
            activeId = id;
            if (id === 'folders' && frames.folders) { try { frames.folders.contentWindow.postMessage({ siHub: 'refresh' }, '*'); } catch (e) {} }
            // Leaving the ROI calc tears down the stacked Custom Build editor so it
            // doesn't bleed over other tools' iframes.
            if (id !== 'roi' && _stackedTool) clearStack();
            { const land = document.getElementById('rhLanding'); if (land) land.classList.remove('show'); }

            // Lazy-load iframe on first visit; keep it alive after (preserves entered data)
            if (!frames[id]) {
                const f = document.createElement('iframe');
                f.src = tool.custom ? tool.url : _withTheme(tool.url);
                f.title = tool.name;
                // Let the embedded calc copy the cloud share link to the clipboard
                // (☁ Cloud Save). Same-origin, but set it explicitly to be safe.
                f.setAttribute('allow', 'clipboard-write; clipboard-read');
                if (id === 'roi') f.addEventListener('load', () => { sendApply({ command: 'requestState' }); sendDisplay(); sendApply({ theme: _pmActive() ? 'midnight' : 'default' }); });
                frames[id] = f;
                frameWrap.appendChild(f);
            }
            Object.entries(frames).forEach(([k, f]) => f.classList.toggle('visible', k === id));

            paintNav(id);
            const rp = document.getElementById('repInputs');
            if (rp) rp.classList.toggle('show', id === 'roi');
            toolbarTitle.textContent = tool.emoji + ' ' + tool.name;
            openBtn.href = tool.url;
            document.title = tool.name + ' · ShipInsure Rep Hub';
            if (updateHash) history.replaceState(null, '', '#' + id);
        }

        document.getElementById('reloadBtn').addEventListener('click', () => {
            if (activeId && frames[activeId]) frames[activeId].src = TOOLS.find(t => t.id === activeId).url;
        });

        document.getElementById('copyBtn').addEventListener('click', () => {
            const tool = TOOLS.find(t => t.id === activeId);
            if (!tool) return;
            // For the ROI calc, copy the merchant-facing proposal link built from the
            // calc's own live state (which the REP Inputs sidebar drives via
            // postMessage) rather than the bare tool URL. Same-origin iframe (both
            // served from drewshafe.github.io), so we can call the calc's own
            // buildMerchantLink() directly instead of round-tripping postMessage.
            let url = tool.url;
            // Merchant Vault: copy the open vault's merchant link (same origin, like the ROI calc).
            if (tool.id === 'vault') {
                try {
                    const win = frames.vault && frames.vault.contentWindow;
                    const link = win && typeof win.mvMerchantLink === 'function' && win.mvMerchantLink();
                    if (link) url = link;
                } catch (err) { /* not loaded yet — fall back to tool.url */ }
            }
            // Claim Wizard: copy the branded claims-flow demo link.
            if (tool.id === 'claim-wizard') {
                try {
                    const win = frames['claim-wizard'] && frames['claim-wizard'].contentWindow;
                    const link = win && typeof win.cwPreviewLink === 'function' && win.cwPreviewLink();
                    if (link) url = link;
                } catch (err) { /* not loaded yet — fall back to tool.url */ }
            }
            // Email Automation: copy the customized email preview link.
            if (tool.id === 'email-automation') {
                try {
                    const win = frames['email-automation'] && frames['email-automation'].contentWindow;
                    const link = win && typeof win.eaPreviewLink === 'function' && win.eaPreviewLink();
                    if (link) url = link;
                } catch (err) { /* not loaded yet — fall back to tool.url */ }
            }
            if (tool.id === 'roi') {
                try {
                    const win = frames.roi && frames.roi.contentWindow;
                    if (win && typeof win.buildMerchantLink === 'function') url = win.buildMerchantLink();
                } catch (err) { /* cross-origin or not loaded yet — fall back to tool.url */ }
            }
            navigator.clipboard.writeText(url).then(() => {
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 1600);
            });
        });

        document.getElementById('toggleSidebar').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('collapsed');
        });

        document.addEventListener('keydown', e => {
            if (e.target.matches('input, textarea, select') || document.querySelector('.tc-back')) return;
            const n = parseInt(e.key, 10);
            if (n >= 1 && n <= RENDERED.length) { const t = RENDERED[n - 1]; if (t.ext) openExternal(t.url); else activate(t.id); }
        });

        // Default (no tab) view — nothing selected, landing shown.
        function goDefault(updateHash = true) {
            activeId = null;
            Object.values(frames).forEach(f => f.classList.remove('visible'));
            document.querySelectorAll('.nav-item').forEach(b => {
                b.classList.remove('active');
                const img = b.querySelector('.nav-logo');
                const t = TOOLS.find(t => 'nav-' + t.id === b.id);
                if (img && t) { const src = t.logoLight || t.logo; if (img.getAttribute('src') !== src) img.src = src; }
            });
            setGroupsForActive(null);
            const rp = document.getElementById('repInputs'); if (rp) rp.classList.remove('show');
            const land = document.getElementById('rhLanding'); if (land) land.classList.add('show');
            toolbarTitle.textContent = '🛠️ Rep Hub';
            openBtn.removeAttribute('href');
            document.title = 'ShipInsure Rep Hub';
            if (updateHash) history.replaceState(null, '', location.pathname + location.search);
        }

        // Deep-linking: a valid #tool opens it directly; otherwise the default view.
        // ── ⚙ Customize tabs: reorder, show/hide, add your own (saved per rep in this browser) ──
        function openTabCustomizer() {
            const back = document.createElement('div');
            back.className = 'tc-back';
            back.innerHTML = '<div class="tc-modal" role="dialog" aria-label="Customize tabs"><h3>Customize tabs</h3>' +
                '<p class="tc-sub">Reorder with ↑ ↓, switch tabs on or off, rename or re-logo any tab with ✎ Edit, or add your own. Saved for you in this browser.</p>' +
                '<div class="tc-list" id="tcList"></div>' +
                '<div class="tc-add"><div class="tc-h">Add a tab</div>' +
                '<input id="tcEmoji" maxlength="4" placeholder="🔗" aria-label="Icon"><input id="tcName" placeholder="Tab name (e.g. Pricing sheet)" aria-label="Tab name">' +
                '<input id="tcUrl" class="tc-full" placeholder="Link (https://…)" aria-label="Link">' +
                '<select id="tcWhere" class="tc-full" aria-label="Where"><option value="">In the sidebar</option><option value="preview">Inside Preview Designer</option></select>' +
                '<select id="tcExt" class="tc-full" aria-label="Opens"><option value="">Opens inside the hub</option><option value="1">Opens in a new browser tab — for sites with Google / SSO sign-in</option></select>' +
                '<div class="tc-note">Google and most single sign-on pages refuse to load inside the hub (you’ll see a 403). Pick “new browser tab” for those.</div>' +
                '<div class="tc-err" id="tcErr"></div>' +
                '<button type="button" class="tc-full" id="tcAddBtn" style="font:inherit;font-weight:700;border-radius:8px;padding:9px;border:1px dashed #4a5fc1;background:#f5f6ff;color:#4a5fc1;cursor:pointer">＋ Add tab</button></div>' +
                '<div class="tc-actions"><button type="button" class="tc-reset" id="tcReset">Reset to default</button><button type="button" class="tc-primary" id="tcDone">Done</button></div></div>';
            document.body.appendChild(back);
            const list = back.querySelector('#tcList');
            let editing = null, pendingLogo;   // pendingLogo: undefined = unchanged, null = back to original, dataURL = upload
            const esc = v => String(v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
            const rowHtml = (t, i, n, kid) => '<div class="tc-row' + (isOff(t.id) ? ' is-off' : '') + (kid ? ' is-kid' : '') + '" data-id="' + t.id + '"' + (kid ? ' data-group="' + t.parent + '"' : '') + '>' +
                '<button type="button" data-mv="-1" title="Move up"' + (i === 0 ? ' disabled' : '') + '>↑</button><button type="button" data-mv="1" title="Move down"' + (i === n - 1 ? ' disabled' : '') + '>↓</button>' +
                '<span class="tc-name">' + esc((t.emoji || '') + ' ' + t.name) + '</span>' + (t.custom ? '<span class="tc-tag">Custom</span>' +
                    '<select data-ext title="Where this tab opens"><option value="">In the hub</option><option value="1"' + (t.ext ? ' selected' : '') + '>New browser tab</option></select>' : '') +
                '<label class="tc-sw"><input type="checkbox" data-show' + (isOff(t.id) ? '' : ' checked') + '> Show</label>' +
                '<button type="button" class="tc-edit-btn" data-edit title="Change name, icon or logo">✎ Edit</button>' +
                (t.custom ? '<button type="button" class="tc-del" data-del title="Delete this tab">✕</button>' : '') + '</div>' +
                (editing === t.id ? editHtml(t, kid) : '');
            const editHtml = (t, kid) => {
                const o = ORIG[t.id] || {}, L = layout.look[t.id] || {};
                const logo = L.logo || o.logo;
                return '<div class="tc-edit' + (kid ? ' is-kid' : '') + '" data-for="' + t.id + '">' +
                    '<label>Name</label><input data-f="name" value="' + esc(t.name) + '">' +
                    '<label>Icon</label><input data-f="emoji" maxlength="4" value="' + esc(t.emoji || '') + '" placeholder="emoji">' +
                    (t.custom ? '<label>Link</label><input data-f="url" value="' + esc(t.url) + '">' : '') +
                    '<label>Show as</label><select data-f="mode"><option value="logo"' + (L.mode !== 'text' && logo ? ' selected' : '') + (logo ? '' : ' disabled') + '>Logo</option><option value="text"' + (L.mode === 'text' || !logo ? ' selected' : '') + '>Text (icon + name)</option></select>' +
                    '<label>Logo</label><div class="tc-logo-box">' + (logo ? '<img class="tc-logo-prev" data-prev src="' + esc(logo) + '" alt="">' : '<span style="font-size:12px;color:#6b7090" data-prev>No logo yet</span>') +
                    '<button type="button" class="tc-mini" data-up>Upload logo</button>' + (L.logo && o.logo ? '<button type="button" class="tc-mini" data-orig>Use original logo</button>' : '') +
                    '<input type="file" accept="image/*" data-file hidden></div>' +
                    '<div class="tc-edit-actions">' + (!t.custom ? '<button type="button" class="tc-mini tc-reset1" data-reset1>Reset this tab</button>' : '') +
                    '<button type="button" class="tc-mini" data-cancel>Cancel</button><button type="button" class="tc-mini tc-save" data-save>Save</button></div></div>';
            };
            const paint = () => {
                const tops = topTools();
                list.innerHTML = tops.map((t, i) => rowHtml(t, i, tops.length, false) + (t.group ? kidTools(t).map((k, j, a) => rowHtml(k, j, a.length, true)).join('') : '')).join('');
            };
            const commit = () => {
                layout.order = topTools().map(t => t.id);
                TOOLS.filter(t => t.group).forEach(g => { layout.kids[g.id] = kidTools(g).map(k => k.id); });
                saveLayout(); renderNav(); paint();
            };
            // Uploaded logos are shrunk to fit the sidebar (max 400×100) and kept as a small PNG.
            const shrinkLogo = file => new Promise((res, rej) => {
                const fr = new FileReader();
                fr.onerror = rej;
                fr.onload = () => { const im = new Image(); im.onerror = rej; im.onload = () => {
                    const k = Math.min(1, 400 / im.naturalWidth, 100 / im.naturalHeight), c = document.createElement('canvas');
                    c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
                    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/png'));
                }; im.src = fr.result; };
                fr.readAsDataURL(file);
            });
            list.addEventListener('click', async e => {
                const ed = e.target.closest('.tc-edit');
                if (ed) {
                    const id = ed.dataset.for, t = TOOLS.find(x => x.id === id), o = ORIG[id] || {};
                    if (e.target.closest('[data-up]')) { ed.querySelector('[data-file]').click(); return; }
                    if (e.target.closest('[data-orig]')) { pendingLogo = null; const pv = ed.querySelector('[data-prev]'); if (pv && o.logo) pv.src = o.logo; return; }
                    if (e.target.closest('[data-cancel]')) { editing = null; pendingLogo = undefined; return paint(); }
                    if (e.target.closest('[data-reset1]')) { delete layout.look[id]; applyLook(t); editing = null; pendingLogo = undefined; return commit(); }
                    if (e.target.closest('[data-save]')) {
                        const v = f => (ed.querySelector('[data-f="' + f + '"]') || {}).value;
                        const L = Object.assign({}, layout.look[id]);
                        const name = (v('name') || '').trim(), emoji = (v('emoji') || '').trim();
                        if (t.custom) {
                            const c = layout.custom.find(x => x.id === id);
                            let url = (v('url') || '').trim(); if (url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
                            if (c) { if (name) c.name = name; if (emoji) c.emoji = emoji; if (url) { c.url = url; t.url = url; if (frames[id]) { frames[id].remove(); delete frames[id]; } } }
                            ORIG[id] = { name: c ? c.name : t.name, emoji: c ? c.emoji : t.emoji, logo: null, logoLight: null };
                            delete L.name; delete L.emoji;
                        } else {
                            if (name && name !== o.name) L.name = name; else delete L.name;
                            if (emoji && emoji !== o.emoji) L.emoji = emoji; else delete L.emoji;
                        }
                        if (pendingLogo === null) delete L.logo; else if (pendingLogo) L.logo = pendingLogo;
                        L.mode = v('mode') === 'text' || !(L.logo || o.logo) ? 'text' : 'logo';
                        if (L.mode === 'logo' && !L.logo) delete L.mode;   // original logo = the default look
                        if (Object.keys(L).length) layout.look[id] = L; else delete layout.look[id];
                        applyLook(t);
                        if (activeId === id) toolbarTitle.textContent = t.emoji + ' ' + t.name;
                        editing = null; pendingLogo = undefined;
                        return commit();
                    }
                    return;
                }
                const row = e.target.closest('.tc-row'); if (!row) return;
                if (e.target.closest('[data-edit]')) { editing = editing === row.dataset.id ? null : row.dataset.id; pendingLogo = undefined; return paint(); }
                const id = row.dataset.id, grp = row.dataset.group;
                const mv = e.target.closest('[data-mv]');
                if (mv) {
                    const arr = grp ? kidTools(TOOLS.find(t => t.id === grp)).map(k => k.id) : topTools().map(t => t.id);
                    const i = arr.indexOf(id), j = i + Number(mv.dataset.mv);
                    if (j < 0 || j >= arr.length) return;
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                    if (grp) layout.kids[grp] = arr; else layout.order = arr;
                    commit();
                }
                if (e.target.closest('[data-del]')) {
                    const t = TOOLS.find(x => x.id === id);
                    if (!t || !confirm('Delete the “' + t.name + '” tab?')) return;
                    TOOLS.splice(TOOLS.indexOf(t), 1);
                    layout.custom = (layout.custom || []).filter(c => c.id !== id);
                    layout.off = (layout.off || []).filter(x => x !== id);
                    if (frames[id]) { frames[id].remove(); delete frames[id]; }
                    commit();
                }
            });
            list.addEventListener('change', async e => {
                if (e.target.matches('[data-file]')) {
                    const f = e.target.files[0]; if (!f) return;
                    try {
                        pendingLogo = await shrinkLogo(f);
                        const box = e.target.closest('.tc-logo-box'), pv = box.querySelector('[data-prev]');
                        if (pv && pv.tagName === 'IMG') pv.src = pendingLogo; else if (pv) pv.outerHTML = '<img class="tc-logo-prev" data-prev src="' + pendingLogo + '" alt="">';
                        const sel = e.target.closest('.tc-edit').querySelector('[data-f="mode"]');
                        sel.querySelector('option[value="logo"]').disabled = false; sel.value = 'logo';
                    } catch (x) { alert('Could not read that image.'); }
                    return;
                }
                if (e.target.matches('[data-ext]')) {
                    const id = e.target.closest('.tc-row').dataset.id, ext = e.target.value === '1';
                    const t = TOOLS.find(x => x.id === id), c = (layout.custom || []).find(x => x.id === id);
                    if (t) t.ext = ext; if (c) c.ext = ext;
                    if (ext && frames[id]) { frames[id].remove(); delete frames[id]; if (activeId === id) goDefault(); }
                    return commit();
                }
                if (!e.target.matches('[data-show]')) return;
                const id = e.target.closest('.tc-row').dataset.id;
                layout.off = (layout.off || []).filter(x => x !== id);
                if (!e.target.checked) layout.off.push(id);
                commit();
            });
            back.querySelector('#tcAddBtn').addEventListener('click', () => {
                const name = back.querySelector('#tcName').value.trim();
                let url = back.querySelector('#tcUrl').value.trim();
                const err = back.querySelector('#tcErr');
                if (!name) { err.textContent = 'Give the tab a name.'; return; }
                if (url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
                try { new URL(url); } catch (x) { err.textContent = 'Paste a full link, like https://…'; return; }
                err.textContent = '';
                const c = { id: 'c-' + Math.random().toString(36).slice(2, 8), name: name, url: url, emoji: back.querySelector('#tcEmoji').value.trim() || '🔗', parent: back.querySelector('#tcWhere').value || '', ext: back.querySelector('#tcExt').value === '1' };
                layout.custom = (layout.custom || []).concat(c);
                const nt = customTool(c); TOOLS.push(nt); applyLook(nt);
                ['#tcName', '#tcUrl', '#tcEmoji'].forEach(sel => back.querySelector(sel).value = '');
                commit();
            });
            back.querySelector('#tcReset').addEventListener('click', () => {
                if (!confirm('Reset the sidebar to the default tabs? Your custom tabs will be removed.')) return;
                TOOLS.filter(t => t.custom).forEach(t => { if (frames[t.id]) { frames[t.id].remove(); delete frames[t.id]; } TOOLS.splice(TOOLS.indexOf(t), 1); });
                layout = DEFAULT_LAYOUT();
                TOOLS.forEach(applyLook);
                commit();
            });
            const close = () => { back.remove(); document.removeEventListener('keydown', onKey); };
            const onKey = e => { if (e.key === 'Escape') close(); };
            document.addEventListener('keydown', onKey);
            back.addEventListener('mousedown', e => { if (e.target === back) close(); });
            back.querySelector('#tcDone').addEventListener('click', close);
            paint();
        }
        document.getElementById('custTabsBtn').addEventListener('click', openTabCustomizer);

        renderNav();
        const initial = location.hash.replace('#', '');
        if (TOOLS.some(t => t.id === initial && !t.group && !t.ext)) activate(initial, false);
        else goDefault(false);

        // ── Lock logo → home/reset + spin + Steamboat Willie whistle (audio only) ──
        const lockLogo = document.getElementById('lockLogo');
        if (lockLogo) {
            lockLogo.addEventListener('click', () => {
                goDefault();     // clicking the lock un-clicks every tab → default view
                lockLogo.classList.remove('spinning', 'egg-spin');
                void lockLogo.offsetWidth;   // restart the spin animation
                lockLogo.classList.add('egg-spin');
                puPlayWhistle();
            });
            lockLogo.addEventListener('animationend', () => lockLogo.classList.remove('spinning', 'egg-spin'));
        }

        // Steamboat whistle (mp3 from the Widget Designer repo; synth fallback if missing).
        const _PU_WHISTLE_URL = 'https://drewshafe.github.io/si-widget-designer/steamboat-whistle.mp3';
        let _puWhistleEl = null, _puWhistleFileOk = null, _puAudioCtx = null;
        function _puAC() {
            if (!_puAudioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; try { _puAudioCtx = new AC(); } catch (e) { return null; } }
            if (_puAudioCtx.state === 'suspended') { try { _puAudioCtx.resume(); } catch (e) {} }
            return _puAudioCtx;
        }
        function puPlayWhistle() {
            if (_puWhistleFileOk === false) { _puSynthWhistle(); return; }
            try {
                if (!_puWhistleEl) _puWhistleEl = new Audio(_PU_WHISTLE_URL);
                _puWhistleEl.currentTime = 0;
                const p = _puWhistleEl.play();
                if (p && p.then) p.then(() => { _puWhistleFileOk = true; }).catch(() => { _puWhistleFileOk = false; _puSynthWhistle(); });
            } catch (e) { _puWhistleFileOk = false; _puSynthWhistle(); }
        }
        function _puSynthWhistle() {
            const ctx = _puAC(); if (!ctx) return;
            const notes = [784, 784, 880, 988, 880, 784, 659, 784, 988, 1047];
            let t = 0;
            notes.forEach((f) => {
                const start = ctx.currentTime + t, dur = 0.2;
                const o = ctx.createOscillator(), g = ctx.createGain(), lfo = ctx.createOscillator(), lfoGain = ctx.createGain();
                o.type = 'sine'; o.frequency.setValueAtTime(f, start);
                lfo.type = 'sine'; lfo.frequency.setValueAtTime(6, start); lfoGain.gain.setValueAtTime(f * 0.012, start);
                lfo.connect(lfoGain); lfoGain.connect(o.frequency);
                g.gain.setValueAtTime(0.0001, start); g.gain.exponentialRampToValueAtTime(0.16, start + 0.04);
                g.gain.setValueAtTime(0.16, start + dur - 0.05); g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
                o.connect(g); g.connect(ctx.destination);
                o.start(start); o.stop(start + dur + 0.02); lfo.start(start); lfo.stop(start + dur + 0.02);
                t += dur * 0.92;
            });
        }

        // ── Project Midnight theme (persisted per rep) ──
        function toggleMidnight(on) {
            document.body.classList.toggle('pm', on);
            try { localStorage.setItem('si_project_midnight', on ? '1' : '0'); } catch (e) {}
            // Match every loaded tool iframe (roi themes live; others when they support it).
            Object.values(frames).forEach(f => { try { f.contentWindow.postMessage({ siHub: 'apply', theme: on ? 'midnight' : 'default' }, '*'); } catch (e) {} });
        }
        (function initMidnight() {
            let on = false;
            try { on = localStorage.getItem('si_project_midnight') === '1'; } catch (e) {}
            const cb = document.getElementById('pmToggle');
            if (cb) cb.checked = on;
            document.body.classList.toggle('pm', on);
        })();
    </script>

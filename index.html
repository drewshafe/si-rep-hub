<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShipInsure Rep Hub 🛠️</title>
    <link rel="icon" type="image/png" href="Rephubfavi.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --header-grad: linear-gradient(135deg, #4a5fc1 0%, #6b7fd7 100%);
            --accent: #4a5fc1;
            --sidebar-width: 330px;
        }

        html, body { height: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Sidebar dock ── */
        .layout {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--header-grad);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            box-shadow: 4px 0 20px rgba(0,0,0,0.25);
            z-index: 10;
            transition: margin-left 0.25s ease;
        }

        .sidebar.collapsed { margin-left: calc(-1 * var(--sidebar-width)); }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 16px 16px 14px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .logo-img { height: 40px; }

        .app-title {
            font-size: 1.05em;
            font-weight: 700;
            color: white;
            line-height: 1.2;
        }

        .app-subtitle {
            font-size: 0.72em;
            font-weight: 500;
            color: rgba(255,255,255,0.75);
        }

        .nav {
            flex: 1;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 12px;
            border-radius: 8px;
            color: rgba(255,255,255,0.9);
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background: transparent;
            text-align: left;
            width: 100%;
            transition: background 0.15s;
            position: relative;
        }

        .nav-item:hover { background: rgba(255,255,255,0.12); }

        .nav-item.active {
            background: white;
            color: var(--accent);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .nav-item .emoji { font-size: 1.15em; flex-shrink: 0; }

        .nav-item .key-hint {
            margin-left: auto;
            font-size: 0.75em;
            font-weight: 700;
            opacity: 0.45;
            border: 1px solid currentColor;
            border-radius: 4px;
            padding: 1px 5px;
        }

        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid rgba(255,255,255,0.2);
            font-size: 0.72em;
            color: rgba(255,255,255,0.6);
        }

        /* ── Main content ── */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: #f4f5fb;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            background: white;
            border-bottom: 2px solid #e0e3f5;
            flex-shrink: 0;
        }

        .toolbar-title {
            font-size: 0.92em;
            font-weight: 700;
            color: #333;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            font-size: 0.8em;
            font-weight: 600;
            border-radius: 6px;
            border: 1px solid #d5d9f0;
            background: #f4f5fb;
            color: var(--accent);
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
            transition: background 0.15s;
        }

        .btn:hover { background: #e6e9f8; }

        .frame-wrap {
            flex: 1;
            position: relative;
            min-height: 0;
        }

        .frame-wrap iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: white;
            display: none;
        }

        .frame-wrap iframe.visible { display: block; }

        .copied-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #333;
            color: white;
            font-size: 0.85em;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 8px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.3);
            transition: transform 0.25s ease;
            z-index: 100;
        }

        .copied-toast.show { transform: translateX(-50%) translateY(0); }

        /* ── ROI Master Calculator logo label ── */
        .nav-item .nav-logo { max-width: 190px; max-height: 40px; width: auto; height: auto; display: block; }
        .nav-item.has-logo { padding: 10px 12px; }

        /* ── Grouped sub-tabs (Other Calculator) ── */
        .nav-item.nav-group .group-caret {
            margin-left: auto; font-size: 0.85em; opacity: 0.7;
            transition: transform 0.25s ease;
        }
        .nav-item.nav-group .group-caret + .key-hint { margin-left: 8px; }
        .nav-item.nav-group.expanded { background: rgba(255,255,255,0.14); }
        .nav-item.nav-group.expanded .group-caret { transform: rotate(180deg); }
        .nav-sub {
            display: flex; flex-direction: column; gap: 6px;
            max-height: 0; overflow: hidden; opacity: 0;
            margin-left: 12px; padding-left: 8px;
            border-left: 2px solid rgba(255,255,255,0.16);
            transition: max-height 0.3s ease, opacity 0.25s ease, margin 0.25s ease;
        }
        .nav-sub.open { max-height: 320px; opacity: 1; margin-top: 3px; margin-bottom: 3px; }
        .nav-sub-item.has-logo { padding: 8px 12px; }
        .nav-sub-item .nav-logo { max-width: 155px; max-height: 32px; }

        /* ── REP Inputs sub-panel (compact; drives the ROI calc iframe via postMessage) ── */
        .rep-inputs {
            display: none;
            flex-direction: column;
            gap: 6px;
            margin: 1px 2px 7px;
            padding: 9px 9px 10px;
            background: rgba(255,255,255,0.10);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 9px;
        }
        .rep-inputs.show { display: flex; }
        .ri-h {
            font-size: 0.6em;
            font-weight: 800;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            color: #c7cffb;
        }
        .ri-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .ri-col { display: flex; flex-direction: column; gap: 5px; }
        .ri-toggle {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 7px;
            font-size: 0.66em;
            font-weight: 700;
            line-height: 1.15;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.35);
            background: rgba(255,255,255,0.92);
            color: #3a3a5a;
            cursor: pointer;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.15s;
        }
        .ri-toggle .dot {
            width: 8px; height: 8px; border-radius: 50%;
            border: 1.5px solid #b9bfe0; flex-shrink: 0; background: transparent;
        }
        .ri-toggle.active { background: #fff; color: var(--accent); border-color: var(--accent); box-shadow: 0 1px 5px rgba(0,0,0,0.16); }
        .ri-toggle.active .dot { background: var(--accent); border-color: var(--accent); }
        .ri-toggle.disabled { opacity: 0.4; cursor: not-allowed; }
        .ri-field, .ri-sel {
            width: 100%;
            padding: 5px 7px;
            font-size: 0.68em;
            font-weight: 600;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.35);
            background: rgba(255,255,255,0.92);
            color: #3a3a5a;
        }
        .ri-field:focus, .ri-sel:focus { outline: none; border-color: #fff; background: #fff; }
        .ri-btn-row { display: flex; gap: 5px; position: relative; }
        .ri-btn {
            flex: 1;
            display: inline-flex; align-items: center; justify-content: center; gap: 4px;
            padding: 5px 6px;
            font-size: 0.66em; font-weight: 700;
            border-radius: 6px; border: 1px solid rgba(255,255,255,0.35);
            background: rgba(255,255,255,0.92); color: #3a3a5a;
            cursor: pointer; white-space: nowrap;
        }
        .ri-btn:hover { background: #fff; }
        .ri-sel-row { display: flex; gap: 5px; align-items: flex-end; }
        .ri-sel-row > div { flex: 1; min-width: 0; }
        .ri-lbl { font-size: 0.56em; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: #c7cffb; margin-bottom: 2px; display: block; }

        /* Coverage Mode row (shown only when Returns / Returns Offset is on) */
        .ri-coverage { display: none; }
        .ri-coverage.show { display: block; }
        .ri-cov-btns { display: flex; flex-wrap: wrap; gap: 4px; }
        .ri-cov {
            padding: 4px 7px; font-size: 0.62em; font-weight: 700;
            border-radius: 5px; border: 1px solid rgba(255,255,255,0.35);
            background: rgba(255,255,255,0.88); color: #3a3a5a; cursor: pointer; white-space: nowrap;
        }
        .ri-cov.active { background: #2e7d32; color: #fff; border-color: #2e7d32; }

        /* Saved-configs dropdown (scrollable, non-clipping) */
        .ri-saved-list {
            display: none;
            margin-top: 4px;
            max-height: 210px;
            overflow-y: auto;
            background: #fff;
            border: 1px solid #d5d9f0;
            border-radius: 7px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.22);
        }
        .ri-saved-list.show { display: block; }
        .ri-saved-item {
            display: flex; align-items: center; justify-content: space-between; gap: 6px;
            padding: 6px 8px; font-size: 0.66em; color: #333; cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
        }
        .ri-saved-item:last-child { border-bottom: none; }
        .ri-saved-item:hover { background: #eef0fb; }
        .ri-saved-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ri-saved-date { color: #adb5bd; flex-shrink: 0; font-size: 0.9em; }
        .ri-saved-empty { padding: 10px 8px; font-size: 0.64em; color: #adb5bd; text-align: center; }

        /* Paste-a-link loader */
        .ri-loadlink { display: flex; gap: 5px; margin-bottom: 2px; }
        .ri-loadlink .ri-field { flex: 1; min-width: 0; }
        .ri-loadlink .ri-btn { flex: 0 0 auto; }

        /* Upfront Rev Share — rep picks a tier, no auto-suggestion */
        .ri-upfront-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
        .ri-upfront-elig {
            font-size: 0.56em; font-weight: 800; padding: 2px 6px; border-radius: 4px;
            white-space: nowrap; text-transform: uppercase; letter-spacing: 0.03em;
        }
        .ri-upfront-elig.ok   { background: rgba(255,255,255,0.15); color: #b7f5c9; }
        .ri-upfront-elig.warn { background: #c0392b; color: #fff; }
        .ri-upfront-mo { font-weight: 500; opacity: 0.75; font-size: 0.9em; }
        .ri-upfront-results { margin-top: 6px; display: flex; flex-direction: column; gap: 3px; }
        .ri-upfront-row { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
        .ri-upfront-row .rl { font-size: 0.58em; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: #c7cffb; }
        .ri-upfront-row .rv { font-size: 0.72em; font-weight: 800; color: #fff; }

        /* SI Net MRR/ARR — ShipInsure's retained cut */
        .ri-sinet {
            display: flex; align-items: baseline; gap: 7px;
            margin-top: 1px; padding: 7px 9px;
            background: rgba(255,255,255,0.16);
            border: 1px solid rgba(255,255,255,0.28);
            border-radius: 7px;
        }
        .ri-sinet-label { font-size: 0.58em; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: #c7cffb; }
        .ri-sinet-val { font-size: 1em; font-weight: 800; color: #fff; margin-left: auto; }
        .ri-sinet-margin { font-size: 0.58em; font-weight: 700; color: #b7f5c9; white-space: nowrap; }

        /* Rep display controls */
        .ri-disp { display: flex; flex-direction: column; gap: 4px; }
        .ri-disp-row { display: flex; align-items: center; gap: 6px; }
        .ri-disp-row .ri-lbl { margin-bottom: 0; flex: 0 0 52px; }
        .ri-disp-btns { display: flex; align-items: center; gap: 4px; flex: 1; }
        .ri-disp-btns button {
            flex: 1; padding: 4px 6px; font-size: 0.62em; font-weight: 700;
            border-radius: 5px; border: 1px solid rgba(255,255,255,0.35);
            background: rgba(255,255,255,0.88); color: #3a3a5a; cursor: pointer; white-space: nowrap;
        }
        .ri-disp-btns button.active { background: #fff; color: var(--accent); border-color: var(--accent); }
        .ri-disp-val { flex: 0 0 auto; font-size: 0.66em; font-weight: 800; color: #fff; min-width: 34px; text-align: center; }

        @media (max-width: 760px) {
            :root { --sidebar-width: 240px; }
            .nav-item .key-hint { display: none; }
            .ri-grid { grid-template-columns: 1fr; }
        }
        /* ═══════════════ PROJECT MIDNIGHT ═══════════════
           Vantablack grounds · holographic black-platinum modules ·
           cinematic kintsugi-lightning input fields */
        @keyframes pmHolo { 0%{background-position:0% 50%;} 100%{background-position:200% 50%;} }
        @keyframes pmSheen { 0%{transform:translateX(-120%);} 100%{transform:translateX(120%);} }
        @keyframes pmKintsugi { 0%,100%{opacity:.35;} 50%{opacity:.85;} }

        body.pm { background:#040406; }
        body.pm .main { background:radial-gradient(120% 120% at 50% 0%, #0b0b12 0%, #050508 55%, #010102 100%); }

        /* Sidebar — vantablack with a slow holographic platinum wash */
        body.pm .sidebar { background:#040407; box-shadow:6px 0 34px rgba(0,0,0,.7); border-right:1px solid rgba(212,175,55,.22); position:relative; overflow:hidden; }
        body.pm .sidebar::before { content:''; position:absolute; inset:0; pointer-events:none; z-index:0; opacity:.10; mix-blend-mode:screen;
            background:linear-gradient(115deg,#ff00d4,#00e6ff,#8bff9b,#ffd54a,#b06bff,#00e6ff); background-size:200% 100%; animation:pmHolo 14s linear infinite; }
        body.pm .logo-area, body.pm .nav, body.pm .sidebar-footer { position:relative; z-index:1; }
        body.pm .logo-area { border-bottom:1px solid rgba(212,175,55,.22); }
        body.pm .logo-area .logo-img { filter:brightness(0) invert(1) drop-shadow(0 0 6px rgba(233,196,106,.4)); }
        body.pm .app-title { color:#f2eede; letter-spacing:.02em; }
        body.pm .app-subtitle { color:#8a8a9c; }

        /* Nav items — black-platinum modules with a holographic hairline */
        body.pm .nav-item { color:#d9d9e6; background:linear-gradient(150deg,#191a22 0%,#0b0c12 100%);
            border:1px solid rgba(212,175,55,.16); box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 2px 10px rgba(0,0,0,.5); overflow:hidden; }
        body.pm .nav-item:hover { border-color:rgba(212,175,55,.5); box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 4px 16px rgba(0,0,0,.6); background:linear-gradient(150deg,#20222c 0%,#0d0e15 100%); }
        body.pm .nav-item.active { background:linear-gradient(150deg,#2a2b36 0%,#141520 100%); color:#f5d67b;
            border-color:#e9c46a; box-shadow:0 0 0 1px rgba(233,196,106,.7), 0 0 22px rgba(233,196,106,.28), inset 0 1px 0 rgba(255,255,255,.08); }
        /* platinum-monochrome logos; gold sheen on the active module */
        body.pm .nav-logo { filter:brightness(0) invert(1) opacity(.92); }
        body.pm .nav-item.active .nav-logo { filter:brightness(0) invert(1) sepia(1) saturate(3) hue-rotate(3deg) opacity(.95); }
        body.pm .nav-item .key-hint { color:#e9c46a; opacity:.6; border-color:rgba(233,196,106,.4); }
        body.pm .nav-item.active .key-hint { color:#f5d67b; opacity:.9; }
        body.pm .nav-group.expanded { background:linear-gradient(150deg,#20212b,#0e0f16); border-color:rgba(233,196,106,.35); }
        body.pm .nav-sub { border-left:2px solid rgba(233,196,106,.35); }
        body.pm .sidebar-footer { border-top:1px solid rgba(212,175,55,.22); color:#8a8a9c; }

        /* REP Inputs panel — deep platinum with a holographic sweep */
        body.pm .rep-inputs { background:linear-gradient(155deg,#121319,#07070c); border:1px solid rgba(212,175,55,.22); position:relative; overflow:hidden; }
        body.pm .rep-inputs::after { content:''; position:absolute; top:0; bottom:0; width:40%; pointer-events:none; z-index:0;
            background:linear-gradient(100deg,transparent,rgba(233,196,106,.10),transparent); animation:pmSheen 6s ease-in-out infinite; }
        body.pm .rep-inputs > * { position:relative; z-index:1; }
        body.pm .ri-h, body.pm .ri-lbl { color:#c9a24a; }

        /* Kintsugi-lightning input fields — vantablack fill, molten-gold seam border */
        body.pm .ri-field, body.pm .ri-sel, body.pm .ri-toggle, body.pm .ri-btn, body.pm .ri-cov, body.pm .ri-disp-btns button {
            color:#efe7cf;
            background:linear-gradient(#08080e,#08080e) padding-box,
                      linear-gradient(120deg,#3a2f10,#e9c46a 45%,#fff3c4 50%,#e9c46a 55%,#3a2f10) border-box;
            border:1px solid transparent;
            box-shadow:0 0 8px rgba(233,196,106,.10), inset 0 0 12px rgba(0,0,0,.6);
        }
        body.pm .ri-field::placeholder { color:#7c7660; }
        body.pm .ri-field:focus, body.pm .ri-sel:focus {
            outline:none;
            background:linear-gradient(#0c0c14,#0c0c14) padding-box,
                      linear-gradient(120deg,#e9c46a,#fff3c4,#e9c46a) border-box;
            box-shadow:0 0 0 1px rgba(233,196,106,.5), 0 0 18px rgba(233,196,106,.4);
        }
        body.pm .ri-toggle.active, body.pm .ri-disp-btns button.active { color:#0a0a0a;
            background:linear-gradient(120deg,#e9c46a,#fff3c4) padding-box, linear-gradient(120deg,#e9c46a,#fff3c4) border-box; }
        body.pm .ri-toggle .dot { border-color:#8a7a3a; }
        body.pm .ri-toggle.active .dot { background:#0a0a0a; border-color:#0a0a0a; }
        body.pm .ri-cov.active { background:linear-gradient(120deg,#b8860b,#e9c46a) padding-box, linear-gradient(120deg,#e9c46a,#fff3c4) border-box; color:#0a0a0a; }
        body.pm .ri-sinet { background:linear-gradient(150deg,#161018,#0a0a10); border:1px solid rgba(233,196,106,.3); }
        body.pm .ri-sinet-val { color:#f5d67b; }
        body.pm .ri-sinet-margin { color:#b7f5c9; }
        body.pm .ri-saved-list { background:#0c0c14; border:1px solid rgba(233,196,106,.3); }
        body.pm .ri-saved-item { color:#e7e2d2; border-bottom:1px solid rgba(233,196,106,.12); }
        body.pm .ri-saved-item:hover { background:#161018; }

        /* Toolbar / chrome */
        body.pm .toolbar { background:#07070d; border-bottom:1px solid rgba(212,175,55,.25); }
        body.pm .toolbar-title { color:#efe7cf; }
        body.pm .btn { background:linear-gradient(150deg,#191a22,#0b0c12); color:#e9c46a; border:1px solid rgba(233,196,106,.35); }
        body.pm .btn:hover { background:linear-gradient(150deg,#22232d,#0d0e15); box-shadow:0 0 14px rgba(233,196,106,.25); }

        /* Project Midnight toggle switch */
        .sidebar-footer { display:flex; align-items:center; justify-content:space-between; gap:10px; }
        .pm-switch { display:inline-flex; align-items:center; gap:7px; cursor:pointer; font-size:1em; font-weight:700; color:rgba(255,255,255,.75); white-space:nowrap; }
        .pm-switch input { display:none; }
        .pm-track { width:34px; height:18px; border-radius:10px; background:rgba(255,255,255,.28); position:relative; flex-shrink:0; transition:background .25s; }
        .pm-track::after { content:''; position:absolute; left:2px; top:2px; width:14px; height:14px; border-radius:50%; background:#fff; transition:transform .22s, box-shadow .25s; }
        .pm-switch input:checked + .pm-track { background:linear-gradient(120deg,#b8860b,#e9c46a,#fff3c4); }
        .pm-switch input:checked + .pm-track::after { transform:translateX(16px); background:#0a0a0a; box-shadow:0 0 10px rgba(233,196,106,.8); }
        body.pm .pm-switch { color:#e9c46a; }

        /* ── Lock logo: clickable "home" + spin ── */
        .logo-img { cursor: pointer; }
        @keyframes lockSpin { to { transform: rotate(360deg); } }
        .logo-img.spinning { animation: lockSpin 0.7s ease-in-out; }
        .logo-img.egg-spin { animation: lockSpin 0.8s linear 4; }

        /* ── Default (no tab) landing ── */
        .rh-landing { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 40px; text-align: center; background: #f5f6fb; z-index: 1; }
        .rh-landing.show { display: flex; }
        .rh-landing img { width: 64px; height: 64px; opacity: 0.45; }
        .rh-landing .rh-l-title { font-size: 1.3em; font-weight: 800; color: #5b6577; }
        .rh-landing .rh-l-sub { font-size: 0.95em; color: #8a90a6; }
        body.pm .rh-landing { background: #0a0a12; }
        body.pm .rh-landing .rh-l-title { color: #e9c46a; }
        body.pm .rh-landing .rh-l-sub { color: #b9c2e6; }

        /* Reduced motion: no lock spin */
        @media (prefers-reduced-motion: reduce) { .logo-img.spinning, .logo-img.egg-spin { animation: none; } }

        /* "Preview Designer" group header renders as text: light on the dark sidebar,
           switching to the dark (active) treatment only once its section is open —
           matching the other tabs' light→dark-on-click behavior. */
        #nav-preview.expanded { background: white; color: var(--accent); }
    </style>
</head>
<body>
    <div class="layout">
        <nav class="sidebar" id="sidebar">
            <div class="logo-area">
                <img class="logo-img" id="lockLogo" src="https://raw.githubusercontent.com/drewshafe/si-roi-calculator/main/si_lock.png" alt="ShipInsure" title="Reset to home">
                <div>
                    <div class="app-title">Rep Hub</div>
                    <div class="app-subtitle">ShipInsure Sales Tools</div>
                </div>
            </div>
            <div class="nav" id="nav"></div>
            <div class="sidebar-footer">
                <span>Press 1–7 to switch tools</span>
                <label class="pm-switch" title="Project Midnight">
                    <input type="checkbox" id="pmToggle" onchange="toggleMidnight(this.checked)">
                    <span class="pm-track"></span> Project Midnight
                </label>
            </div>
        </nav>
        <div class="main">
            <div class="toolbar">
                <button class="btn" id="toggleSidebar" title="Toggle sidebar">☰</button>
                <div class="toolbar-title" id="toolbarTitle"></div>
                <button class="btn" id="reloadBtn" title="Reload tool">⟳ Reload</button>
                <button class="btn" id="copyBtn" title="Copy tool link">🔗 Copy Link</button>
                <a class="btn" id="openBtn" href="#" target="_blank" rel="noopener" title="Open in new tab">↗ Open in New Tab</a>
            </div>
            <div class="frame-wrap" id="frameWrap">
                <div class="rh-landing" id="rhLanding">
                    <img src="https://raw.githubusercontent.com/drewshafe/si-roi-calculator/main/si_lock.png" alt="">
                    <div class="rh-l-title">ShipInsure Rep Hub</div>
                    <div class="rh-l-sub">Pick a tool from the sidebar to get started.</div>
                </div>
            </div>
        </div>
    </div>
    <div class="copied-toast" id="toast">Link copied!</div>

    <script>
        const TOOLS = [
            { id: 'roi',          emoji: '📦', logo: 'mastercalclogo.png', logoLight: 'mastercalclogo_light.png', name: 'ROI Master Calculator', url: 'https://drewshafe.github.io/si-roi-calculator/' },
            { id: 'proposal',     emoji: '📄', logo: 'proposal_logo.png',   logoLight: 'proposal_logo_light.png', name: 'Proposal & MSA Generator',          url: 'https://drewshafe.github.io/si-proposal/' },
            // "Preview Designer" is a group header — clicking it reveals its sub-tabs below.
            { id: 'preview',      emoji: '🎨', logo: 'previewdesigner_logo.png', logoLight: 'previewdesigner_logo_light.png', name: 'Preview Designer', group: true, children: ['widget-designer', 'email-automation', 'claim-wizard'] },
            { id: 'widget-designer',   emoji: '🛒', logo: 'checkoutexp_logo.png',   logoLight: 'checkoutexp_logo.png',   name: 'Checkout Experience', url: 'https://drewshafe.github.io/si-widget-designer/',   parent: 'preview' },
            { id: 'email-automation',  emoji: '✉️', logo: 'emailbranding_logo.png',  logoLight: 'emailbranding_logo.png',  name: 'Email Automation',    url: 'https://drewshafe.github.io/si-email-automation/', parent: 'preview' },
            { id: 'claim-wizard',      emoji: '🪄', logo: 'claimwiz_logo.png',       logoLight: 'claimwiz_logo.png',       name: 'Claim Wizard',        url: 'https://drewshafe.github.io/si-claim-wizard/',     parent: 'preview' },
            // "Other Calculator" is a group header — clicking it reveals the sub-tabs below.
            { id: 'other',        emoji: '🧮', logo: 'othercalcs_logo.png', logoLight: 'othercalcs_logo_light.png', name: 'Other Calculator', group: true, children: ['self-insured', 'comparison', 'gorgias'] },
            { id: 'self-insured', emoji: '🛡️', logo: 'diy_logo.png',        logoLight: 'diy_logo_light.png',       name: 'Self-Insured Calc',           url: 'https://drewshafe.github.io/si-self-insured-calculator/', parent: 'other' },
            { id: 'comparison',   emoji: '⚖️', logo: 'competitor_logo.png', logoLight: 'competitor_logo_light.png', name: 'Competitor Comparison Calc',  url: 'https://drewshafe.github.io/si-comparison/', parent: 'other' },
            { id: 'gorgias',      emoji: '🤝', logo: 'gorgias_logo.png',    logoLight: 'gorgias_logo_light.png',   name: 'Gorgias Calculator',          url: 'https://drewshafe.github.io/si-gorgias-roi-calculator/', parent: 'other' },
        ];

        const nav = document.getElementById('nav');
        const frameWrap = document.getElementById('frameWrap');
        const toolbarTitle = document.getElementById('toolbarTitle');
        const openBtn = document.getElementById('openBtn');
        const toast = document.getElementById('toast');
        const frames = {};
        let activeId = null;

        TOOLS.forEach((tool, i) => {
            const btn = document.createElement('button');
            btn.className = 'nav-item' + (tool.logo ? ' has-logo' : '') + (tool.group ? ' nav-group' : '') + (tool.parent ? ' nav-sub-item' : '');
            btn.id = 'nav-' + tool.id;
            const caret = tool.group ? '<span class="group-caret">▾</span>' : '';
            btn.innerHTML = tool.logo
                ? `<img class="nav-logo" src="${tool.logoLight || tool.logo}" alt="${tool.name}">${caret}<span class="key-hint">${i + 1}</span>`
                : `<span class="emoji">${tool.emoji}</span><span>${tool.name}</span>${caret}<span class="key-hint">${i + 1}</span>`;
            btn.addEventListener('click', () => activate(tool.id));
            if (tool.parent) {
                // Sub-tab: nest inside its group's collapsible container.
                const sub = document.getElementById('nav-sub-' + tool.parent);
                if (sub) sub.appendChild(btn);
            } else {
                nav.appendChild(btn);
            }
            // The ROI Master Calculator tab has a "REP Inputs" sub-panel that drives
            // the calculator iframe live via postMessage.
            if (tool.id === 'roi') nav.appendChild(buildRepInputs());
            // A group header gets an (initially collapsed) container to hold its sub-tabs.
            if (tool.group) {
                const sub = document.createElement('div');
                sub.className = 'nav-sub';
                sub.id = 'nav-sub-' + tool.id;
                nav.appendChild(sub);
            }
        });

        // ── REP Inputs panel (mirrors the calc's ShipInsure Inputs, drives it live) ──
        function buildRepInputs() {
            const p = document.createElement('div');
            p.className = 'rep-inputs';
            p.id = 'repInputs';
            p.innerHTML = `
                <div class="ri-loadlink">
                    <input class="ri-field" id="ri-loadlink-input" placeholder="Paste a calculator link…">
                    <button class="ri-btn" id="ri-loadlink-btn">Load</button>
                </div>
                <div class="ri-col" style="margin-bottom:2px;">
                    <input class="ri-field" id="ri-merchant" placeholder="Merchant Name...">
                    <div class="ri-btn-row">
                        <button class="ri-btn" id="ri-save">💾 Save</button>
                        <button class="ri-btn" id="ri-saved">📂 Saved <span id="ri-saved-count">0</span></button>
                    </div>
                </div>
                <div class="ri-h">Rep Inputs</div>
                <div class="ri-grid">
                    <div class="ri-col">
                        <button class="ri-toggle" data-feat="hideCurrentCost"><span class="dot"></span>Hide Current Cost</button>
                        <button class="ri-toggle" data-feat="returns"><span class="dot"></span>Protection + Returns</button>
                        <button class="ri-toggle" data-feat="cashback"><span class="dot"></span>Customer Cashback</button>
                    </div>
                    <div class="ri-col">
                        <button class="ri-toggle" data-feat="grossRevShare"><span class="dot"></span>Gross Rev Share</button>
                        <button class="ri-toggle" data-feat="guarantee"><span class="dot"></span>Sat/Qual Guarantee</button>
                        <button class="ri-toggle" data-feat="returnsOffset"><span class="dot"></span>Returns Offset</button>
                    </div>
                </div>
                <div class="ri-saved-list" id="ri-saved-list"></div>
                <div class="ri-coverage" id="ri-coverage">
                    <span class="ri-lbl">Coverage Mode</span>
                    <div class="ri-cov-btns">
                        <button class="ri-cov" data-cov="default">Protected + Platform</button>
                        <button class="ri-cov" data-cov="platform_only">Platform Only</button>
                        <button class="ri-cov" data-cov="labels_protected">Protected Labels</button>
                        <button class="ri-cov" data-cov="all_labels_platform">All + Platform</button>
                        <button class="ri-cov" data-cov="all_labels">All Labels</button>
                    </div>
                </div>
                <div class="ri-sel-row">
                    <div id="ri-pricing-wrap"><span class="ri-lbl">Pricing</span><select class="ri-sel" id="ri-pricing"></select></div>
                    <div id="ri-minp-wrap" style="flex:0 0 auto;display:none;"><span class="ri-lbl">Min $</span><input class="ri-sel" id="ri-minp" placeholder="0.00" style="width:54px;"></div>
                    <div style="flex:2;"><span class="ri-lbl">Claim Resolution</span><select class="ri-sel" id="ri-claimres"></select></div>
                </div>
                <div class="ri-sel-row" style="margin-bottom:2px;">
                    <div style="flex:1;"><span class="ri-lbl">Currency</span>
                        <select class="ri-sel" id="ri-currency">
                            <option value="USD">USD ($)</option>
                            <option value="EUR">EUR (€)</option>
                            <option value="GBP">GBP (£)</option>
                            <option value="CAD">CAD (CA$)</option>
                            <option value="AUD">AUD (A$)</option>
                            <option value="NZD">NZD (NZ$)</option>
                            <option value="JPY">JPY (¥)</option>
                        </select>
                    </div>
                </div>
                <div class="ri-upfront" id="ri-upfront">
                    <div class="ri-upfront-head">
                        <span class="ri-lbl">Upfront Rev Share</span>
                        <span class="ri-upfront-elig" id="ri-upfront-elig"></span>
                    </div>
                    <div class="ri-cov-btns">
                        <button class="ri-cov" data-upfront="0.208333">20.8% <span class="ri-upfront-mo">(2.5mo)</span></button>
                        <button class="ri-cov" data-upfront="0.25">25% <span class="ri-upfront-mo">(3.0mo)</span></button>
                        <button class="ri-cov" data-upfront="0.33">33% <span class="ri-upfront-mo">(4.0mo)</span></button>
                    </div>
                    <div class="ri-upfront-results" id="ri-upfront-results" style="display:none;">
                        <div class="ri-upfront-row"><span class="rl">Yearly Rev Share</span><span class="rv" id="ri-upfront-yearly">$0</span></div>
                        <div class="ri-upfront-row"><span class="rl">Upfront Payment</span><span class="rv" id="ri-upfront-amount">$0</span></div>
                        <div class="ri-upfront-row"><span class="rl">ShipInsure Margin</span><span class="rv" id="ri-upfront-margin">$0</span></div>
                    </div>
                </div>
                <div class="ri-sinet">
                    <span class="ri-sinet-label" id="ri-sinet-label">SI Net MRR</span>
                    <span class="ri-sinet-val" id="ri-sinet-val">$0</span>
                    <span class="ri-sinet-margin" id="ri-sinet-margin">0% of premiums</span>
                </div>
                <div class="ri-h" style="margin-top:3px;">Display</div>
                <div class="ri-disp">
                    <div class="ri-disp-row"><span class="ri-lbl">Size</span><div class="ri-disp-btns"><button data-disp="zoom" data-val="dec">−</button><span id="ri-zoom-val" class="ri-disp-val">100%</span><button data-disp="zoom" data-val="inc">+</button></div></div>
                    <div class="ri-disp-row"><span class="ri-lbl">Text</span><div class="ri-disp-btns"><button data-disp="text" data-val="0.9">S</button><button data-disp="text" data-val="1">M</button><button data-disp="text" data-val="1.15">L</button></div></div>
                    <div class="ri-disp-row"><span class="ri-lbl">Density</span><div class="ri-disp-btns"><button data-disp="density" data-val="comfortable">Comfort</button><button data-disp="density" data-val="compact">Compact</button></div></div>
                    <div class="ri-disp-row"><span class="ri-lbl">Layout</span><div class="ri-disp-btns"><button data-disp="layout" data-val="auto">Auto</button><button data-disp="layout" data-val="split">Split</button><button data-disp="layout" data-val="stacked">Stacked</button></div></div>
                </div>`;
            // Feature toggles → post the desired boolean; the calc echoes back the
            // resulting state, which syncRepInputs() reflects (handles RO exclusivity).
            p.querySelectorAll('.ri-toggle[data-feat]').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (btn.classList.contains('disabled')) return;
                    const f = btn.dataset.feat;
                    sendApply({ [f]: !repState[f] });
                });
            });
            // Coverage Mode buttons (rep-only; hidden from merchants) drive the calc.
            p.querySelectorAll('.ri-cov[data-cov]').forEach(btn => {
                btn.addEventListener('click', () => sendApply({ coverage: btn.dataset.cov }));
            });
            // Upfront Rev Share: purely a hub-side calculator (rep picks a tier
            // manually, no auto-suggestion) — nothing to send to the calc.
            p.querySelectorAll('.ri-cov[data-upfront]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const tier = parseFloat(btn.dataset.upfront);
                    _upfrontTier = (_upfrontTier === tier) ? null : tier;
                    updateUpfrontDisplay();
                    // Mirror the selection into the calc so it shows the "Upfront Rev
                    // Share Payment" bubble and carries ?upf= into shared links.
                    sendApply({ upfrontTier: _upfrontTier });
                });
            });
            p.querySelector('#ri-currency').addEventListener('change', e => sendApply({ currency: e.target.value }));
            p.querySelector('#ri-merchant').addEventListener('input', e => sendApply({ merchantName: e.target.value }));
            p.querySelector('#ri-save').addEventListener('click', () => sendApply({ command: 'save' }));
            // Saved: rep-only. Toggle an in-sidebar, scrollable list of saved merchant
            // configs; clicking one loads it into the calc.
            p.querySelector('#ri-saved').addEventListener('click', () => {
                const list = document.getElementById('ri-saved-list');
                renderSavedList(repState.savedConfigs || []);
                list.classList.toggle('show');
            });
            p.querySelector('#ri-pricing').addEventListener('change', e => sendApply({ pricing: e.target.value }));
            p.querySelector('#ri-minp').addEventListener('input', e => sendApply({ minPremium: e.target.value }));
            p.querySelector('#ri-claimres').addEventListener('change', e => sendApply({ claimResolution: e.target.value }));
            // Load a pasted calculator link as the ROI tab's starting point.
            // Always load into the rep-facing index.html (Master Calculator view),
            // even when the pasted link is a merchant-facing proposal.html link —
            // only the query params (the actual data) carry over, not the page.
            const loadFromLink = () => {
                const inp = p.querySelector('#ri-loadlink-input');
                const raw = (inp.value || '').trim();
                if (!raw) return;
                if (!/^https?:\/\/[^ ]*si-roi-calculator/i.test(raw)) {
                    inp.style.borderColor = '#ff6b6b';
                    setTimeout(() => { inp.style.borderColor = ''; }, 1500);
                    return;
                }
                let search = '';
                try { search = new URL(raw).search; } catch (e) { /* fall through with no query */ }
                // Reflect an Upfront Rev Share tier carried in the link into the sidebar.
                try {
                    const upf = new URLSearchParams(search).get('upf');
                    _upfrontTier = upf ? parseFloat(upf) : null;
                } catch (e) { _upfrontTier = null; }
                activate('roi');
                if (frames['roi']) frames['roi'].src = 'https://drewshafe.github.io/si-roi-calculator/' + search;
                inp.value = '';
            };
            p.querySelector('#ri-loadlink-btn').addEventListener('click', loadFromLink);
            p.querySelector('#ri-loadlink-input').addEventListener('keydown', e => { if (e.key === 'Enter') loadFromLink(); });
            // Display controls
            p.querySelectorAll('.ri-disp-btns button').forEach(btn => {
                btn.addEventListener('click', () => {
                    const t = btn.dataset.disp, v = btn.dataset.val;
                    if (t === 'zoom') {
                        repDisplay.zoom = Math.round((Math.min(1.5, Math.max(0.7, repDisplay.zoom + (v === 'inc' ? 0.1 : -0.1)))) * 100) / 100;
                    } else if (t === 'text') { repDisplay.textScale = parseFloat(v); }
                    else if (t === 'density') { repDisplay.density = v; }
                    else if (t === 'layout') { repDisplay.layout = v; }
                    saveDisplayPrefs(); syncDisplayUI(); sendDisplay();
                });
            });
            setTimeout(syncDisplayUI, 0);
            return p;
        }

        function renderSavedList(configs) {
            const list = document.getElementById('ri-saved-list');
            if (!list) return;
            if (!configs.length) {
                list.innerHTML = '<div class="ri-saved-empty">No saved configs yet — enter a merchant name and click 💾 Save.</div>';
                return;
            }
            list.innerHTML = configs.map(c =>
                `<div class="ri-saved-item" data-name="${c.name.replace(/"/g, '&quot;')}">
                    <span class="ri-saved-name">${c.name}</span><span class="ri-saved-date">${c.date || ''}</span>
                </div>`).join('');
            list.querySelectorAll('.ri-saved-item').forEach(item => {
                item.addEventListener('click', () => {
                    sendApply({ command: 'loadConfig', name: item.dataset.name });
                    list.classList.remove('show');
                });
            });
        }

        let repState = {};
        let _upfrontTier = null; // 0.20 | 0.25 | 0.33 | null — rep-picked, no auto-suggestion
        function roiWin() { return frames['roi'] && frames['roi'].contentWindow; }
        function sendApply(patch) {
            const w = roiWin();
            if (w) w.postMessage(Object.assign({ siHub: 'apply' }, patch), '*');
        }

        // ── Rep display prefs (size/text/density/layout), persisted per rep ──
        function loadDisplayPrefs() {
            const def = { zoom: 1, textScale: 1, density: 'comfortable', layout: 'auto' };
            try { return Object.assign(def, JSON.parse(localStorage.getItem('si_rep_display') || '{}')); }
            catch (e) { return def; }
        }
        let repDisplay = loadDisplayPrefs();
        function saveDisplayPrefs() { try { localStorage.setItem('si_rep_display', JSON.stringify(repDisplay)); } catch (e) {} }
        function sendDisplay() { const w = roiWin(); if (w) w.postMessage({ siHub: 'apply', display: repDisplay }, '*'); }
        function syncDisplayUI() {
            const zv = document.getElementById('ri-zoom-val');
            if (zv) zv.textContent = Math.round(repDisplay.zoom * 100) + '%';
            document.querySelectorAll('.ri-disp-btns button[data-disp="text"]').forEach(b => b.classList.toggle('active', parseFloat(b.dataset.val) === repDisplay.textScale));
            document.querySelectorAll('.ri-disp-btns button[data-disp="density"]').forEach(b => b.classList.toggle('active', b.dataset.val === repDisplay.density));
            document.querySelectorAll('.ri-disp-btns button[data-disp="layout"]').forEach(b => b.classList.toggle('active', b.dataset.val === repDisplay.layout));
        }
        function fillSelect(sel, options, value) {
            if (!sel || !options) return;
            if (sel.options.length !== options.length) {
                sel.innerHTML = options.map(o => `<option value="${o.v}">${o.t}</option>`).join('');
            }
            if (value != null) sel.value = value;
        }
        function syncRepInputs(s) {
            const setT = (feat, on) => {
                const b = document.querySelector(`.ri-toggle[data-feat="${feat}"]`);
                if (b) b.classList.toggle('active', !!on);
            };
            setT('returns', s.returns); setT('cashback', s.cashback); setT('guarantee', s.guarantee);
            setT('returnsOffset', s.returnsOffset); setT('grossRevShare', s.grossRevShare);
            setT('hideCurrentCost', s.hideCurrentCost);
            // Returns Offset is exclusive: the calc forces returns on and cashback/
            // guarantee off, so disable those toggles while it's active.
            ['returns', 'cashback', 'guarantee'].forEach(f => {
                const b = document.querySelector(`.ri-toggle[data-feat="${f}"]`);
                if (b) b.classList.toggle('disabled', !!s.returnsOffset);
            });
            // Coverage Mode row: only relevant when returns or returns-offset is active.
            const cov = document.getElementById('ri-coverage');
            if (cov) {
                cov.classList.toggle('show', !!(s.returns || s.returnsOffset));
                cov.querySelectorAll('.ri-cov').forEach(b => b.classList.toggle('active', b.dataset.cov === s.coverage));
            }
            const _curSel = document.getElementById('ri-currency');
            if (_curSel && document.activeElement !== _curSel && s.currency) _curSel.value = s.currency;
            fillSelect(document.getElementById('ri-pricing'), s.pricingOptions, s.pricing);
            fillSelect(document.getElementById('ri-claimres'), s.claimResOptions, s.claimResolution);
            // Min $ floor only shows for %-based pricing.
            const minpWrap = document.getElementById('ri-minp-wrap');
            const minpInput = document.getElementById('ri-minp');
            if (minpWrap) minpWrap.style.display = (s.pricing === 'percentage') ? '' : 'none';
            if (minpInput && document.activeElement !== minpInput && typeof s.minPremium === 'string') minpInput.value = s.minPremium;
            const m = document.getElementById('ri-merchant');
            if (m && document.activeElement !== m && typeof s.merchantName === 'string') m.value = s.merchantName;
            const sc = document.getElementById('ri-saved-count');
            if (sc && s.savedCount != null) sc.textContent = s.savedCount;
            // Keep the saved list fresh if it's currently open.
            const list = document.getElementById('ri-saved-list');
            if (list && list.classList.contains('show')) renderSavedList(s.savedConfigs || []);
            // SI Net MRR/ARR — ShipInsure's retained cut of the post-claim balance.
            const netLabel = document.getElementById('ri-sinet-label');
            const netVal = document.getElementById('ri-sinet-val');
            const netMargin = document.getElementById('ri-sinet-margin');
            if (netLabel) netLabel.textContent = (s.viewMode === 'annual') ? 'SI Net ARR' : 'SI Net MRR';
            if (netVal) netVal.textContent = fmtMoney(s.siNet);
            if (netMargin) netMargin.textContent = (typeof s.siNetMargin === 'number' ? s.siNetMargin.toFixed(1) : '0') + '% of premiums';
            updateUpfrontDisplay();
        }
        function fmtMoney(n) { return '$' + Math.round(n || 0).toLocaleString('en-US'); }

        // Upfront Rev Share — lets a rep front-load part of a year's Rev Share as
        // a lump sum in exchange for a reduced ongoing share. Tier is picked
        // manually (no auto-suggestion); eligibility is a warning, not a block.
        //   Yearly Rev Share = Rev Share % × annual Net Revenue
        //   Upfront $         = Upfront Tier % × Yearly Rev Share
        //   ShipInsure Margin = annual Net Revenue − Yearly Rev Share
        function updateUpfrontDisplay() {
            const s = repState || {};
            document.querySelectorAll('.ri-cov[data-upfront]').forEach(b => {
                b.classList.toggle('active', _upfrontTier !== null && parseFloat(b.dataset.upfront) === _upfrontTier);
            });

            const netRevPeriod = s.netRevenue || 0;
            const isAnnual = s.viewMode === 'annual';
            const annualNetRevenue = isAnnual ? netRevPeriod : netRevPeriod * 12;
            const monthlyNetRevenue = isAnnual ? netRevPeriod / 12 : netRevPeriod;

            const eligEl = document.getElementById('ri-upfront-elig');
            if (eligEl) {
                const eligible = monthlyNetRevenue >= 2500;
                eligEl.textContent = eligible ? 'Eligible' : 'Below $2,500/mo min';
                eligEl.className = 'ri-upfront-elig ' + (eligible ? 'ok' : 'warn');
            }

            const resultsEl = document.getElementById('ri-upfront-results');
            if (!resultsEl) return;
            if (_upfrontTier === null) { resultsEl.style.display = 'none'; return; }
            resultsEl.style.display = 'flex';

            const revSharePct = s.revSharePct || 0; // decimal fraction
            const yearlyRevShare = annualNetRevenue * revSharePct;
            const upfrontAmount = _upfrontTier * yearlyRevShare;
            const margin = annualNetRevenue - yearlyRevShare;

            document.getElementById('ri-upfront-yearly').textContent = fmtMoney(yearlyRevShare);
            document.getElementById('ri-upfront-amount').textContent = fmtMoney(upfrontAmount);
            document.getElementById('ri-upfront-margin').textContent = fmtMoney(margin);
        }
        window.addEventListener('message', e => {
            if (e.data && e.data.siHub === 'state') { repState = e.data; syncRepInputs(e.data); }
        });

        // A group is expanded iff the active tool is that group or one of its children.
        function setGroupsForActive(id) {
            TOOLS.filter(t => t.group).forEach(g => {
                const inSection = (id === g.id) || (g.children || []).includes(id);
                const sub  = document.getElementById('nav-sub-' + g.id);
                const head = document.getElementById('nav-' + g.id);
                if (sub)  sub.classList.toggle('open', inSection);
                if (head) head.classList.toggle('expanded', inSection);
            });
        }

        function _pmActive() { return document.body.classList.contains('pm'); }
        function _withTheme(url) { return _pmActive() ? url + (url.includes('?') ? '&' : '?') + 'theme=midnight' : url; }
        function activate(id, updateHash = true) {
            const tool = TOOLS.find(t => t.id === id);
            if (!tool) return;
            // Group header: reveal its sub-tabs; keep the child already active, else open the first.
            if (tool.group) {
                const cur = TOOLS.find(t => t.id === activeId);
                if (cur && cur.parent === tool.id) { setGroupsForActive(activeId); return; }
                return activate((tool.children || [])[0], updateHash);
            }
            if (id === activeId) { setGroupsForActive(id); return; }
            activeId = id;
            { const land = document.getElementById('rhLanding'); if (land) land.classList.remove('show'); }

            // Lazy-load iframe on first visit; keep it alive after (preserves entered data)
            if (!frames[id]) {
                const f = document.createElement('iframe');
                f.src = _withTheme(tool.url);
                f.title = tool.name;
                if (id === 'roi') f.addEventListener('load', () => { sendApply({ command: 'requestState' }); sendDisplay(); sendApply({ theme: _pmActive() ? 'midnight' : 'default' }); });
                frames[id] = f;
                frameWrap.appendChild(f);
            }
            Object.entries(frames).forEach(([k, f]) => f.classList.toggle('visible', k === id));

            document.querySelectorAll('.nav-item').forEach(b => {
                const isActive = b.id === 'nav-' + id;
                b.classList.toggle('active', isActive);
                const img = b.querySelector('.nav-logo');
                if (img) {
                    const t = TOOLS.find(t => 'nav-' + t.id === b.id);
                    // Preview Designer is a group header (never "active"); show its dark
                    // logo whenever its section is open, matching the other tabs' light→dark.
                    const previewOpen = t && t.id === 'preview' && ((t.children || []).includes(id) || id === 'preview');
                    const wantSrc = (isActive || previewOpen) ? t.logo : (t.logoLight || t.logo);
                    if (img.getAttribute('src') !== wantSrc) img.src = wantSrc;
                }
            });
            setGroupsForActive(id);
            const rp = document.getElementById('repInputs');
            if (rp) rp.classList.toggle('show', id === 'roi');
            toolbarTitle.textContent = tool.emoji + ' ' + tool.name;
            openBtn.href = tool.url;
            document.title = tool.name + ' · ShipInsure Rep Hub';
            if (updateHash) history.replaceState(null, '', '#' + id);
        }

        document.getElementById('reloadBtn').addEventListener('click', () => {
            if (activeId && frames[activeId]) frames[activeId].src = TOOLS.find(t => t.id === activeId).url;
        });

        document.getElementById('copyBtn').addEventListener('click', () => {
            const tool = TOOLS.find(t => t.id === activeId);
            if (!tool) return;
            // For the ROI calc, copy the merchant-facing proposal link built from the
            // calc's own live state (which the REP Inputs sidebar drives via
            // postMessage) rather than the bare tool URL. Same-origin iframe (both
            // served from drewshafe.github.io), so we can call the calc's own
            // buildMerchantLink() directly instead of round-tripping postMessage.
            let url = tool.url;
            if (tool.id === 'roi') {
                try {
                    const win = frames.roi && frames.roi.contentWindow;
                    if (win && typeof win.buildMerchantLink === 'function') url = win.buildMerchantLink();
                } catch (err) { /* cross-origin or not loaded yet — fall back to tool.url */ }
            }
            navigator.clipboard.writeText(url).then(() => {
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 1600);
            });
        });

        document.getElementById('toggleSidebar').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('collapsed');
        });

        document.addEventListener('keydown', e => {
            if (e.target.matches('input, textarea, select')) return;
            const n = parseInt(e.key, 10);
            if (n >= 1 && n <= TOOLS.length) activate(TOOLS[n - 1].id);
        });

        // Default (no tab) view — nothing selected, landing shown.
        function goDefault(updateHash = true) {
            activeId = null;
            Object.values(frames).forEach(f => f.classList.remove('visible'));
            document.querySelectorAll('.nav-item').forEach(b => {
                b.classList.remove('active');
                const img = b.querySelector('.nav-logo');
                const t = TOOLS.find(t => 'nav-' + t.id === b.id);
                if (img && t) { const src = t.logoLight || t.logo; if (img.getAttribute('src') !== src) img.src = src; }
            });
            setGroupsForActive(null);
            const rp = document.getElementById('repInputs'); if (rp) rp.classList.remove('show');
            const land = document.getElementById('rhLanding'); if (land) land.classList.add('show');
            toolbarTitle.textContent = '🛠️ Rep Hub';
            openBtn.removeAttribute('href');
            document.title = 'ShipInsure Rep Hub';
            if (updateHash) history.replaceState(null, '', location.pathname + location.search);
        }

        // Deep-linking: a valid #tool opens it directly; otherwise the default view.
        const initial = location.hash.replace('#', '');
        if (TOOLS.some(t => t.id === initial)) activate(initial, false);
        else goDefault(false);

        // ── Lock logo → home/reset + spin + Steamboat Willie whistle (audio only) ──
        const lockLogo = document.getElementById('lockLogo');
        if (lockLogo) {
            lockLogo.addEventListener('click', () => {
                goDefault();     // clicking the lock un-clicks every tab → default view
                lockLogo.classList.remove('spinning', 'egg-spin');
                void lockLogo.offsetWidth;   // restart the spin animation
                lockLogo.classList.add('egg-spin');
                puPlayWhistle();
            });
            lockLogo.addEventListener('animationend', () => lockLogo.classList.remove('spinning', 'egg-spin'));
        }

        // Steamboat whistle (mp3 from the Widget Designer repo; synth fallback if missing).
        const _PU_WHISTLE_URL = 'https://drewshafe.github.io/si-widget-designer/steamboat-whistle.mp3';
        let _puWhistleEl = null, _puWhistleFileOk = null, _puAudioCtx = null;
        function _puAC() {
            if (!_puAudioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; try { _puAudioCtx = new AC(); } catch (e) { return null; } }
            if (_puAudioCtx.state === 'suspended') { try { _puAudioCtx.resume(); } catch (e) {} }
            return _puAudioCtx;
        }
        function puPlayWhistle() {
            if (_puWhistleFileOk === false) { _puSynthWhistle(); return; }
            try {
                if (!_puWhistleEl) _puWhistleEl = new Audio(_PU_WHISTLE_URL);
                _puWhistleEl.currentTime = 0;
                const p = _puWhistleEl.play();
                if (p && p.then) p.then(() => { _puWhistleFileOk = true; }).catch(() => { _puWhistleFileOk = false; _puSynthWhistle(); });
            } catch (e) { _puWhistleFileOk = false; _puSynthWhistle(); }
        }
        function _puSynthWhistle() {
            const ctx = _puAC(); if (!ctx) return;
            const notes = [784, 784, 880, 988, 880, 784, 659, 784, 988, 1047];
            let t = 0;
            notes.forEach((f) => {
                const start = ctx.currentTime + t, dur = 0.2;
                const o = ctx.createOscillator(), g = ctx.createGain(), lfo = ctx.createOscillator(), lfoGain = ctx.createGain();
                o.type = 'sine'; o.frequency.setValueAtTime(f, start);
                lfo.type = 'sine'; lfo.frequency.setValueAtTime(6, start); lfoGain.gain.setValueAtTime(f * 0.012, start);
                lfo.connect(lfoGain); lfoGain.connect(o.frequency);
                g.gain.setValueAtTime(0.0001, start); g.gain.exponentialRampToValueAtTime(0.16, start + 0.04);
                g.gain.setValueAtTime(0.16, start + dur - 0.05); g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
                o.connect(g); g.connect(ctx.destination);
                o.start(start); o.stop(start + dur + 0.02); lfo.start(start); lfo.stop(start + dur + 0.02);
                t += dur * 0.92;
            });
        }

        // ── Project Midnight theme (persisted per rep) ──
        function toggleMidnight(on) {
            document.body.classList.toggle('pm', on);
            try { localStorage.setItem('si_project_midnight', on ? '1' : '0'); } catch (e) {}
            // Match every loaded tool iframe (roi themes live; others when they support it).
            Object.values(frames).forEach(f => { try { f.contentWindow.postMessage({ siHub: 'apply', theme: on ? 'midnight' : 'default' }, '*'); } catch (e) {} });
        }
        (function initMidnight() {
            let on = false;
            try { on = localStorage.getItem('si_project_midnight') === '1'; } catch (e) {}
            const cb = document.getElementById('pmToggle');
            if (cb) cb.checked = on;
            document.body.classList.toggle('pm', on);
        })();
    </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merchant Folders · ShipInsure Rep Hub</title>
<link rel="icon" type="image/png" href="Rephubfavi.png">
<script src="https://drewshafe.github.io/si-roi-calculator/sb.js"></script>
<script src="brand-kit.js"></script>
<script src="https://drewshafe.github.io/si-widget-designer/lock-builder.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  :root { --page:#f4f5fb; --card:#fff; --ink:#1d2240; --muted:#6b7090; --line:#e3e5f2; --accent:#4a5fc1; --accent-soft:#eef0ff; --ok:#1f7a45; --ok-soft:#e5f7ec; --danger:#c0392b; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--page); color:var(--ink); min-height:100vh; font-size:14px; }
  .wrap { max-width:1180px; margin:0 auto; padding:22px 24px 60px; }
  button, input, select { font:inherit; }
  .btn { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:8px 13px; font-weight:600; font-size:13px; cursor:pointer; white-space:nowrap; }
  .btn:hover { border-color:#c9cdf0; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover { filter:brightness(1.07); }
  .btn.ghost { background:transparent; }
  .btn.small { padding:5px 10px; font-size:12px; }
  .btn.danger { color:var(--danger); border-color:#f1c6c0; }
  .btn:disabled { opacity:.5; cursor:default; }

  /* top bar */
  .top { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  .top h1 { font-size:22px; font-weight:800; letter-spacing:-.01em; margin-right:auto; }
  .search { flex:0 1 300px; min-width:180px; border:1px solid var(--line); border-radius:8px; padding:8px 12px; background:var(--card); color:var(--ink); }
  .search:focus, .field input:focus { outline:none; border-color:var(--accent); }
  .acct { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:8px; }
  .chk { display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); cursor:pointer; }

  /* folder grid */
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:14px; }
  .fcard { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; cursor:pointer; display:flex; flex-direction:column; gap:10px; transition:border-color .15s, box-shadow .15s; position:relative; }
  .fcard:hover { border-color:#c9cdf0; box-shadow:0 6px 20px rgba(30,40,90,0.07); }
  .fcard.is-active { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); }
  .fcard.is-archived { opacity:.6; }
  .fhead { display:flex; align-items:center; gap:11px; min-width:0; }
  .logo { width:42px; height:42px; border-radius:10px; flex:0 0 auto; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; overflow:hidden; border:1px solid var(--line); }
  .logo img { width:100%; height:100%; object-fit:contain; background:#fff; }
  .fname { font-weight:700; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fsub { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .counts { display:flex; flex-wrap:wrap; gap:5px; }
  .cnt { font-size:11px; font-weight:700; color:var(--accent); background:var(--accent-soft); border-radius:20px; padding:2px 8px; }
  .cnt.none { color:var(--muted); background:#f1f2f7; }
  .badge { position:absolute; top:12px; right:12px; font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--ok); background:var(--ok-soft); border-radius:20px; padding:2px 8px; }
  .empty { text-align:center; color:var(--muted); padding:50px 20px; background:var(--card); border:1px dashed var(--line); border-radius:14px; }
  .empty b { display:block; color:var(--ink); font-size:16px; margin-bottom:6px; }

  /* folder detail */
  .back { font-size:13px; font-weight:600; color:var(--accent); background:none; border:none; cursor:pointer; margin-bottom:14px; }
  .dhead { display:flex; align-items:center; gap:14px; flex-wrap:wrap; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; }
  /* Brand kit: the merchant's reusable images (main / secondary / hero logo, favicon, banner, custom SI lock) */
  .bkit { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:4px 18px; margin-bottom:16px; }
  .bkit summary { cursor:pointer; list-style:none; display:flex; align-items:center; gap:8px; padding:12px 0; font-weight:800; font-size:14px; }
  .bkit summary::-webkit-details-marker { display:none; }
  .bkit summary::after { content:'▾'; margin-left:auto; color:var(--muted); transition:transform .15s; }
  .bkit:not([open]) summary::after { transform:rotate(-90deg); }
  .bkit summary .n { font-size:11.5px; font-weight:700; color:var(--muted); }
  .bkit .bk-note { font-size:12px; color:var(--muted); margin:-4px 0 12px; }
  .bkit .bk-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px; padding-bottom:16px; }
  .bk-t { border:1px solid var(--line); border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:7px; min-width:0; }
  .bk-pv { height:84px; border-radius:8px; background:repeating-conic-gradient(#eceef4 0% 25%, #f8f9fc 0% 50%) 0 0/12px 12px; display:flex; align-items:center; justify-content:center; overflow:hidden; color:var(--muted); font-size:22px; }
  .bk-pv img { max-width:100%; max-height:100%; object-fit:contain; display:block; }
  .bk-pv.wide img { width:100%; height:100%; object-fit:cover; }
  .bk-l { font-size:12.5px; font-weight:700; }
  .bk-h { font-size:11px; color:var(--muted); margin-top:-5px; }
  .bk-a { display:flex; gap:5px; flex-wrap:wrap; }
  .bk-sw { gap:0; padding:0; } .bk-sw i { flex:1; height:100%; }
  .bk-cl { display:flex; align-items:center; gap:8px; cursor:pointer; }
  .bk-cl input { width:28px; height:24px; border:1px solid var(--line); border-radius:6px; padding:0; background:none; cursor:pointer; flex:0 0 auto; }
  .bk-cl span { display:flex; flex-direction:column; line-height:1.2; } .bk-cl b { font-size:12px; } .bk-cl small { font-size:11px; color:var(--muted); font-family:ui-monospace,monospace; }
  .bk-a .btn { padding:4px 8px; font-size:11.5px; }
  /* From website: images found on the merchant's store, pick one for the brand kit */
  .wpk { position:fixed; inset:0; z-index:70; background:rgba(17,20,33,.55); display:flex; align-items:center; justify-content:center; padding:20px; }
  .wpk-b { background:var(--card, #fff); color:var(--ink, #1d2240); border-radius:14px; width:min(860px, 100%); max-height:88vh; display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,.3); }
  .wpk-h { padding:14px 18px; border-bottom:1px solid var(--line, #e3e5f2); display:flex; align-items:center; gap:10px; }
  .wpk-h b { font-size:15px; } .wpk-h span { font-size:12px; color:var(--muted, #6b7090); flex:1; }
  .wpk-g { padding:14px 18px; overflow:auto; display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; }
  .wpk-g button { border:2px solid var(--line, #e3e5f2); border-radius:10px; padding:4px; background:var(--card, #fff); cursor:pointer; display:flex; flex-direction:column; gap:4px; text-align:left; font-size:10.5px; color:var(--muted, #6b7090); }
  .wpk-g button:hover { border-color:var(--accent, #6675ff); }
  .wpk-g img { width:100%; height:110px; object-fit:cover; border-radius:6px; background:#f0f1f6; display:block; }
  .wpk-g.prod img { object-fit:contain; background:#fff; }
  .wpk-m { padding:30px; text-align:center; color:var(--muted, #6b7090); font-size:13px; grid-column:1 / -1; }
  body.pm .bk-pv { background:repeating-conic-gradient(#1b1b22 0% 25%, #24242c 0% 50%) 0 0/12px 12px; }
  .dhead .logo { width:56px; height:56px; font-size:20px; border-radius:12px; }
  .dhead .dtitle { margin-right:auto; min-width:0; }
  .dhead h2 { font-size:20px; font-weight:800; }
  .dhead a { color:var(--accent); text-decoration:none; font-size:13px; }
  .sections { display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:14px; }
  .sec { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
  .sec h3 { font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:10px; display:flex; align-items:center; gap:8px; }
  .sec h3 .n { color:var(--accent); background:var(--accent-soft); border-radius:20px; padding:1px 7px; font-size:11px; letter-spacing:0; }
  .row { display:flex; align-items:center; gap:8px; padding:9px 0; border-top:1px solid #f0f1f7; }
  .row:first-of-type { border-top:0; }
  .row .rt { flex:1; min-width:0; }
  .row .rn { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .rm { font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .none { font-size:12.5px; color:var(--muted); padding:4px 0 2px; }
  .sec h3 .docacts { margin-left:auto; display:flex; gap:6px; text-transform:none; letter-spacing:0; }
  /* ▾ collapsible blocks */
  #detailView:not(.editing) .blk > h3 { cursor:pointer; user-select:none; }
  .sec h3 .bcol { margin-left:auto; flex:0 0 auto; width:24px; height:24px; border:0; background:none; color:var(--muted); font-size:14px; line-height:1; border-radius:6px; cursor:pointer; transition:transform .15s; }
  .sec h3 .docacts + .bcol { margin-left:2px; }
  .sec h3 .docacts { flex-wrap:wrap; justify-content:flex-end; min-width:0; }
  .sec h3 .bcol:hover { background:var(--accent-soft); color:var(--accent); }
  .blk.collapsed > h3 { margin-bottom:0; }
  .blk.collapsed > h3 .bcol { transform:rotate(-90deg); }
  .blk.collapsed > :not(h3) { display:none; }
  /* 📋 Brief */
  .brief .br-grid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px 14px; padding-bottom:12px; }
  .brief .br-f { display:flex; flex-direction:column; gap:4px; min-width:0; }
  .brief .br-f.wide { grid-column:1 / -1; }
  .brief .br-f span { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .brief textarea, .brief .br-hs input { width:100%; font-family:inherit; font-size:13px; line-height:1.45; color:var(--ink); box-sizing:border-box; background:var(--page); border:1px solid var(--line); border-radius:8px; padding:7px 9px; resize:vertical; min-height:38px; }
  .brief textarea:focus, .brief .br-hs input:focus { outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent; }
  .brief .br-hs { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding-bottom:6px; }
  .brief .br-hs input { flex:1 1 260px; min-height:0; width:auto; }
  .brief .br-st { display:flex; gap:10px; flex-wrap:wrap; font-size:11.5px; color:var(--muted); padding-bottom:14px; min-height:14px; }
  .brief .br-st a { color:var(--accent); text-decoration:none; }
  @media (max-width:640px) { .brief .br-grid { grid-template-columns:1fr; } }
  /* 📱 / 🖥: which view the save's link opens in (Demo, Lightbox, FAQ) */
  .row .devseg { flex:0 0 auto; display:inline-flex; background:#f1f2f8; border-radius:20px; padding:2px; }
  .row .devseg button { border:0; background:none; border-radius:20px; padding:3px 7px; font-size:12px; line-height:1; cursor:pointer; opacity:.45; }
  .row .devseg button.on { background:#fff; opacity:1; box-shadow:0 1px 3px rgba(20,26,60,.15); }
  body.pm .row .devseg { background:#1b1b22; } body.pm .row .devseg button.on { background:#2a2a33; }
  .row .pick { flex:0 0 auto; width:16px; height:16px; cursor:pointer; accent-color:var(--accent); }
  .row .ord { flex:0 0 auto; width:18px; height:18px; border-radius:50%; background:var(--accent); color:#fff; font-size:11px; font-weight:800; display:none; align-items:center; justify-content:center; }
  .row .ord.on { display:inline-flex; }
  .row .rn-edit { width:100%; font-weight:600; border:1px solid var(--accent); border-radius:6px; padding:3px 7px; outline:none; }
  .optbar { display:none; gap:6px; margin-top:8px; padding-top:10px; border-top:1px dashed var(--line); align-items:center; }
  .optbar.on { display:flex; }
  .optbar .hint { font-size:11.5px; color:var(--muted); margin-right:auto; }
  .roiadd { display:flex; gap:6px; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); }
  .roiadd input { flex:1; min-width:0; border:1px solid var(--line); border-radius:8px; padding:6px 10px; background:var(--page); color:var(--ink); font-size:12.5px; }
  .roiadd input:focus { outline:none; border-color:var(--accent); }
  .unfiled { margin-top:22px; }
  .unfiled h3 { font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:8px; }
  .unfiled .sec { max-width:760px; }

  /* modal */
  .back-dim { position:fixed; inset:0; background:rgba(14,16,40,.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; }
  .modal { width:min(440px, 100%); background:var(--card); color:var(--ink); border-radius:16px; padding:22px; box-shadow:0 24px 70px rgba(0,0,0,.3); }
  .modal h3 { font-size:18px; margin-bottom:4px; }
  .modal p { font-size:12.5px; color:var(--muted); margin-bottom:14px; line-height:1.45; }
  .field { display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
  .field label { font-size:12px; font-weight:700; color:var(--muted); }
  .field input { border:1px solid var(--line); border-radius:8px; padding:9px 11px; background:var(--page); color:var(--ink); }
  .mactions { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
  .err { color:var(--danger); font-size:12.5px; min-height:16px; }
  .logo-pick { display:flex; align-items:center; gap:10px; }

  /* One-Pager editor, opened over the folder */
  .op-ov { position:fixed; inset:0; z-index:55; background:rgba(14,16,40,.5); display:flex; padding:12px; }
  .op-box { flex:1; min-width:0; display:flex; flex-direction:column; background:var(--card); color:var(--ink); border-radius:14px; overflow:hidden; box-shadow:0 24px 70px rgba(0,0,0,.35); }
  .op-hd { display:flex; align-items:center; gap:10px; padding:9px 12px 9px 16px; border-bottom:1px solid var(--line); font-size:14px; font-weight:800; }
  .op-hd .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .op-hd .t span { font-weight:600; color:var(--muted); }
  .op-box iframe { flex:1; width:100%; border:0; background:var(--page); }

  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(90px); background:#222; color:#fff; font-weight:600; font-size:13px; padding:10px 16px; border-radius:8px; transition:transform .25s; z-index:60; }
  .toast.show { transform:translateX(-50%) translateY(0); }

  /* Project Midnight */
  body.pm { --page:#07070a; --card:#111116; --ink:#ece6d6; --muted:#9a927f; --line:#26262f; --accent:#d4af37; --accent-soft:#1f1b10; --ok:#7fd39c; --ok-soft:#14261a; }
  body.pm .btn.primary { color:#0a0a0a; background:linear-gradient(135deg,#b8902d,#e3c56a); border-color:transparent; }
  body.pm .cnt.none { background:#191920; }
  body.pm .logo img { background:#1a1a20; }

  @media (max-width:640px) { .wrap { padding:16px 14px 50px; } .sections { grid-template-columns:1fr; } }

  /* ── 🎨 Customize: an Aligned-style layout per folder ──
     The sections are blocks on a 6-column grid: ⅓ = 2, ½ = 3, ⅔ = 4, Full = 6 columns. */
  .sections { grid-template-columns:repeat(6, minmax(0, 1fr)); }
  .blk { grid-column:span 2; position:relative; min-width:0; }
  .blk.w3 { grid-column:span 3; } .blk.w4 { grid-column:span 4; } .blk.w6 { grid-column:span 6; }
  .blk h3 { color:var(--blk-ink, var(--muted)); }
  .dhead.inked a, .dhead.inked .fsub { color:inherit; opacity:.85; }
  @media (max-width:980px) { .blk, .blk.w3, .blk.w4 { grid-column:span 3; } }
  @media (max-width:640px) { .sections { grid-template-columns:repeat(6, minmax(0, 1fr)); } .blk, .blk.w3, .blk.w4, .blk.w6 { grid-column:span 6; } }
  .editing .blk { outline:1.5px dashed #c3c8ef; outline-offset:3px; }
  .editing .blk.is-hidden { opacity:.45; }
  .blk.dragging { opacity:.45; outline-style:solid; outline-color:var(--accent); }
  .btools { display:none; position:absolute; top:-14px; right:12px; z-index:3; align-items:center; gap:2px; padding:2px 5px; background:var(--card); border:1px solid var(--line); border-radius:999px; box-shadow:0 4px 14px rgba(30,40,90,.13); }
  .editing .btools { display:flex; }
  .btools button { border:0; background:none; color:var(--ink); min-width:24px; height:24px; padding:0 5px; border-radius:999px; font-size:12px; font-weight:700; cursor:pointer; }
  .btools button:hover { background:var(--accent-soft); }
  .btools button.on { background:var(--accent); color:#fff; }
  .btools .bdrag { cursor:grab; font-size:14px; touch-action:none; }
  .btools .sep { width:1px; height:14px; background:var(--line); margin:0 3px; }
  .bresize { display:none; position:absolute; top:14px; bottom:14px; right:-8px; width:12px; cursor:ew-resize; touch-action:none; z-index:2; }
  .editing .bresize { display:block; }
  .bresize::after { content:''; position:absolute; left:4px; top:50%; height:36px; margin-top:-18px; width:4px; border-radius:2px; background:#b9bfe8; }
  .bresize:hover::after { background:var(--accent); }
  .editbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:var(--card); border:1px solid var(--accent); border-radius:14px; padding:10px 12px; margin:-4px 0 22px; position:sticky; top:8px; z-index:5; box-shadow:0 8px 24px rgba(30,40,90,.10); }
  .editbar .etitle { font-weight:800; }
  .editbar .ehint { font-size:11.5px; color:var(--muted); flex:1 1 220px; }
  .editbar .ehead { display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--muted); font-weight:600; }
  .editbar input[type=color], .bstyle input[type=color] { width:30px; height:26px; padding:1px; border:1px solid var(--line); border-radius:6px; background:var(--card); cursor:pointer; }
  .editbar .lstatus { font-size:11.5px; color:var(--ok); font-weight:600; flex-basis:100%; }
  .editbar .lstatus.warn { color:var(--danger); }
  .bstyle { display:grid; grid-template-columns:auto 1fr; gap:7px 10px; align-items:center; margin-top:12px; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--page); font-size:12px; }
  .bstyle label { font-weight:700; color:var(--muted); }
  .bstyle .brow { display:flex; align-items:center; gap:6px; }
  .sec h3 .bico { width:18px; height:18px; object-fit:contain; border-radius:4px; flex:0 0 auto; }
  .bstyle .icobox { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .bstyle .icobox input[data-bf=emoji] { width:90px; flex:0 0 auto; }
  .bstyle .icobox .or { color:var(--muted); font-weight:600; }
  .bstyle .icobox .ico-prev { width:26px; height:26px; object-fit:contain; border:1px solid var(--line); border-radius:6px; background:#fff; padding:1px; }
  .bstyle input[type=text], .bstyle select { border:1px solid var(--line); border-radius:7px; padding:5px 8px; background:var(--card); color:var(--ink); min-width:0; width:100%; }
  .lnks { display:flex; flex-wrap:wrap; gap:8px; }
  .lnk { display:inline-flex; align-items:center; gap:6px; padding:8px 12px; border-radius:10px; border:1px solid var(--line); background:var(--page); color:var(--ink); font-weight:600; font-size:13px; text-decoration:none; max-width:100%; }
  .lnk span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lnk:hover { border-color:var(--accent); color:var(--accent); }
  .lnk-ed { display:grid; grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr) auto; gap:6px; margin-bottom:6px; }
  .lnk-ed input, .bfield { border:1px solid var(--line); border-radius:7px; padding:6px 9px; background:var(--page); color:var(--ink); font-size:12.5px; min-width:0; width:100%; }
  .btext { white-space:pre-wrap; line-height:1.55; font-size:13.5px; }
  .btext a { color:var(--accent); }
  textarea.bfield { min-height:110px; resize:vertical; font:inherit; font-size:13px; line-height:1.5; }
  .bembed { width:100%; border:0; border-radius:10px; background:var(--page); display:block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>📁 Merchant Folders</h1>
    <input class="search" id="search" placeholder="🔎 Search merchants…" autocomplete="off">
    <label class="chk"><input type="checkbox" id="showArchived"> Show archived</label>
    <button class="btn primary" id="newBtn" type="button">＋ New folder</button>
    <div class="acct" id="acct"></div>
  </div>

  <div id="signin" class="empty" hidden>
    <b>Sign in to see your team’s merchant folders</b>
    Same login as the calculators’ ☁ Cloud Save and Merchant Vault.<br><br>
    <button class="btn primary" id="signinBtn" type="button">Sign in with a magic link</button>
  </div>

  <div id="listView" hidden>
    <div class="grid" id="grid"></div>
  </div>

  <div id="unfiled" class="unfiled" hidden></div>

  <div id="detailView" hidden>
    <button class="back" id="backBtn" type="button">← All folders</button>
    <div class="dhead" id="dhead"></div>
    <details class="bkit" id="bkit"></details>
    <details class="bkit brief" id="brief"></details>
    <div id="editbar"></div>
    <div class="sections" id="sections"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  // Merchant Folders — the Rep Hub's home base. One folder per merchant holding every tool's
  // saves (ROI scenarios + merchant_assets). Loading a save asks the Hub to open the right tab.
  const SECTIONS = [
    { kind: 'roi',      label: 'ROI Scenarios',        tool: 'ROI Builder' },
    { kind: 'proposal', label: 'Proposals',            tool: 'Proposal & MSA Generator' },
    { kind: 'msa',      label: 'MSA + SOW',            tool: 'Proposal & MSA Generator' },
    { kind: 'mnda',     label: 'MNDA',                 tool: 'Proposal & MSA Generator' },
    { kind: 'deck',     label: 'Custom Decks',         tool: 'Custom Deck' },
    { kind: 'checkout', label: 'Checkout Experience',  tool: 'Checkout Experience' },
    { kind: 'email',    label: 'Email Automation',     tool: 'Email Automation' },
    { kind: 'claim',    label: 'Claim Wizard',         tool: 'Claim Wizard' },
    { kind: 'onepager', label: 'One-Pagers',           tool: 'One-Pager' },
    { kind: 'faq',      label: 'FAQs',                 tool: 'FAQ' },
    { kind: 'lightbox', label: 'Info Lightboxes',      tool: 'Checkout Experience' },
    { kind: 'demo',     label: 'Interactive Demos',    tool: 'SI Interactive Demo' },
  ];
  // Sections where a rep can also file an existing document (upload or link) instead of generating one.
  const DOC_KINDS = { proposal: 1, msa: 1, mnda: 1, checkout: 1, email: 1, claim: 1, onepager: 1 };
  // Of those, the tool sections file existing mockups (Figma exports, screenshots) — images allowed too.
  const MOCKUP_KINDS = { checkout: 1, email: 1, claim: 1 };
  const SHORT = { roi: 'ROI', proposal: 'Proposal', msa: 'MSA', mnda: 'MNDA', checkout: 'Checkout', email: 'Email', claim: 'Claims', onepager: 'One-Pager', faq: 'FAQ', lightbox: 'Lightbox', demo: 'Demo', deck: 'Deck' };
  const CALC = 'https://drewshafe.github.io/si-roi-calculator/';
  // One-Pagers are filed as kind 'onepager'; until the hosted sb.js lists it, add it (same array saveAsset checks).
  if (window.SIsb && Array.isArray(SIsb.ASSET_KINDS)) ['onepager', 'faq', 'lightbox', 'demo', 'deck'].forEach(k => { if (SIsb.ASSET_KINDS.indexOf(k) < 0) SIsb.ASSET_KINDS.push(k); });

  const $ = id => document.getElementById(id);
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const initials = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
  const logoHtml = f => f.logo_path ? '<div class="logo"><img src="' + esc(f.logo_path) + '" alt=""></div>' : '<div class="logo">' + esc(initials(f.name)) + '</div>';
  function ago(t) {
    if (!t) return '';
    const s = (Date.now() - Date.parse(t)) / 1000;
    if (s < 60) return 'just now';
    if (s < 3600) return Math.round(s / 60) + 'm ago';
    if (s < 86400) return Math.round(s / 3600) + 'h ago';
    if (s < 86400 * 30) return Math.round(s / 86400) + 'd ago';
    return new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }
  const who = e => (e || '').split('@')[0];
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200); }
  const hub = msg => { try { parent.postMessage(Object.assign({ siHub: 'folders' }, msg), '*'); } catch (e) {} };

  let user = null, folders = [], assets = [], scenarios = [], unfiled = [], openId = null;
  let picks = [];   // ROI scenario ids ticked for the options link, in pick order (= tab order)
  let roiDraft = ''; // pasted ROI calc link not yet saved (survives re-renders)

  // ── data ──
  async function loadAll() {
    const [f, a, c] = await Promise.all([
      SIsb.listFolders({ includeArchived: true }),
      SIsb.listAssets(),
      SIsb.listConfigs()
    ]);
    folders = f; assets = a; scenarios = c.filter(x => x.merchant_ref); unfiled = c.filter(x => !x.merchant_ref);
  }
  const itemsFor = id => ({
    roi: scenarios.filter(x => x.merchant_ref === id),
    ...Object.fromEntries(SECTIONS.filter(s => s.kind !== 'roi').map(s => [s.kind, assets.filter(a => a.merchant_ref === id && a.kind === s.kind)]))
  });
  // Most recently worked-on first: latest of the folder, its saves and its scenarios.
  function lastTouched(f) {
    let t = Date.parse(f.updated_at) || 0;
    assets.forEach(a => { if (a.merchant_ref === f.id) t = Math.max(t, Date.parse(a.updated_at) || 0); });
    scenarios.forEach(c => { if (c.merchant_ref === f.id) t = Math.max(t, Date.parse(c.updated_at) || 0); });
    return t;
  }

  // ── list view ──
  function renderList() {
    const q = $('search').value.trim().toLowerCase(), showArch = $('showArchived').checked;
    const active = SIsb.getActiveFolder();
    const list = folders.filter(f => (showArch || !f.archived) && (!q || f.name.toLowerCase().includes(q) || (f.domain || '').toLowerCase().includes(q)))
      .sort((a, b) => lastTouched(b) - lastTouched(a));
    $('grid').innerHTML = list.length ? list.map(f => {
      const it = itemsFor(f.id);
      const chips = SECTIONS.map(s => it[s.kind].length ? '<span class="cnt">' + it[s.kind].length + ' ' + SHORT[s.kind] + '</span>' : '').join('');
      return '<div class="fcard' + (active && active.id === f.id ? ' is-active' : '') + (f.archived ? ' is-archived' : '') + '" data-id="' + esc(f.id) + '">' +
        (active && active.id === f.id ? '<span class="badge">Active</span>' : f.archived ? '<span class="badge" style="color:var(--muted);background:#f1f2f7">Archived</span>' : '') +
        '<div class="fhead">' + logoHtml(f) + '<div style="min-width:0"><div class="fname">' + esc(f.name) + '</div><div class="fsub">' + esc(f.domain || 'Updated ' + ago(new Date(lastTouched(f)).toISOString())) + '</div></div></div>' +
        '<div class="counts">' + (chips || '<span class="cnt none">No saves yet</span>') + '</div></div>';
    }).join('') : '<div class="empty" style="grid-column:1/-1"><b>' + (q ? 'No folders match “' + esc(q) + '”' : 'No merchant folders yet') + '</b>' + (q ? '' : 'Click ＋ New folder to create the first one.') + '</div>';
    // ROI scenarios saved before folders existed (no merchant_ref) — file them in one click.
    const uf = unfiled.filter(c => !q || (c.merchant || '').toLowerCase().includes(q) || (c.title || '').toLowerCase().includes(q));
    $('unfiled').hidden = !uf.length;
    $('unfiled').innerHTML = uf.length ? '<h3>Unfiled ROI scenarios (' + uf.length + ')</h3><div class="sec">' + uf.map(c =>
      '<div class="row" data-kind="roi" data-id="' + esc(c.id) + '"><div class="rt"><div class="rn">' + esc(c.merchant || 'No merchant name') + ' — ' + esc(c.title || 'Scenario') + '</div><div class="rm">' + esc(ago(c.updated_at)) + '</div></div>' +
      '<button class="btn small primary" type="button" data-act="file">Create folder &amp; file</button><button class="btn small" type="button" data-act="view" title="Open the branded proposal">↗</button></div>').join('') + '</div>' : '';
  }

  // ── detail view ──
  function renderDetail() {
    const f = folders.find(x => x.id === openId);
    if (!f) { showList(); return; }
    const active = SIsb.getActiveFolder(), isActive = active && active.id === f.id;
    const site = f.domain ? (/^https?:/i.test(f.domain) ? f.domain : 'https://' + f.domain) : '';
    $('dhead').innerHTML = logoHtml(f) +
      '<div class="dtitle"><h2>' + esc(f.name) + '</h2>' + (site ? '<a href="' + esc(site) + '" target="_blank" rel="noopener">' + esc(f.domain) + ' ↗</a>' : '<span class="fsub">No store URL</span>') + '</div>' +
      (isActive ? '<button class="btn" type="button" disabled>✓ Active merchant</button>' : '<button class="btn primary" type="button" data-act="activate">Set as active merchant</button>') +
      '<button class="btn" type="button" data-act="edit">✎ Edit details</button>' +
      '<button class="btn' + (editing ? ' primary' : '') + '" type="button" data-act="customize">' + (editing ? '✓ Done customizing' : '🎨 Customize') + '</button>' +
      '<button class="btn ' + (f.archived ? '' : 'danger') + '" type="button" data-act="archive">' + (f.archived ? 'Restore' : 'Archive') + '</button>';
    renderKit(f);
    renderBrief(f);
    const it = itemsFor(f.id);
    if (!editing || curFor !== f.id || !cur) { cur = layoutOf(f.id); curFor = f.id; }
    $('dhead').style.background = cur.head.bg || ''; $('dhead').style.color = cur.head.ink || ''; $('dhead').classList.toggle('inked', !!cur.head.ink);
    $('detailView').classList.toggle('editing', editing);
    $('editbar').innerHTML = editing ? editbarHtml() : '';
    $('sections').innerHTML = cur.blocks.map(b => blockHtml(b, it)).join('');
    fillDevices();
  }
  // One built-in section's content (its saves, upload / link buttons, ROI tools).
  function sectionInner(s, it, b) {
      const rows = it[s.kind];
      return '<h3>' + (b.icon || b.emoji ? iconOf(b) + ' ' : '') + esc(b.title || s.label) + (rows.length ? ' <span class="n">' + rows.length + '</span>' : '') +
        (DOC_KINDS[s.kind] ? '<span class="docacts"><button class="btn small" type="button" data-act="upload" title="' + (MOCKUP_KINDS[s.kind] ? 'Upload an existing mockup (PDF or image)' : 'Upload an existing PDF or Word file') + '">⬆ Upload</button><button class="btn small" type="button" data-act="addlink" title="' + (MOCKUP_KINDS[s.kind] ? 'File a link to an existing mockup (e.g. Figma)' : 'File a link to an existing doc (e.g. Google Doc)') + '">🔗 Add link</button>' +
          (s.kind === 'onepager' ? '<button class="btn small primary" type="button" data-act="fathom" title="Paste a Fathom call, share or call-folder link: the One-Pager drafts a meeting recap from the call and saves it here">🎙 From Fathom call</button>' +
            '<button class="btn small primary" type="button" data-act="opnew" title="Build a one-pager for this merchant from its deal data">+ New one-pager</button>' : '') + '</span>' : '') + '</h3>' +
        (rows.length ? rows.map(r => rowHtml(s, r)).join('') : '<div class="none">Nothing saved yet — ' + (s.kind === 'onepager' ? 'start one with + New one-pager, draft one from a Fathom call (🎙), or upload / link an existing doc.' : MOCKUP_KINDS[s.kind] ? 'save from the ' + esc(s.tool) + ' tab, or upload / link an existing mockup.' : DOC_KINDS[s.kind] ? 'generate one in the ' + esc(s.tool) + ' tab, or upload / link an existing doc.' : (s.kind === 'roi' ? 'save from the ' + esc(s.tool) + ' tab, or paste a calc link below.' : 'save from the ' + esc(s.tool) + ' tab.')) + '</div>') +
        (s.kind === 'roi' && rows.length ? '<div class="optbar' + (picks.length ? ' on' : '') + '"><span class="hint">Tick scenarios in the order you want their tabs</span>' +
          '<button class="btn small primary" type="button" data-act="optcopy">📋 Copy ' + (picks.length > 1 ? 'options link (' + picks.length + ')' : 'link') + '</button>' +
          '<button class="btn small" type="button" data-act="optopen" title="Open in a new window">↗</button></div>' : '') +
        (s.kind === 'roi' ? '<div class="roiadd"><input class="roilink" type="url" placeholder="Paste an ROI calc link…" value="' + esc(roiDraft) + '" autocomplete="off">' +
          '<button class="btn small primary" type="button" data-act="roisave">Save link</button></div>' : '');
  }
  // Saves whose link opens on a phone or a desktop: the choice is saved in the save (data.device).
  const DEV_KINDS = { demo: 1, lightbox: 1, faq: 1 };
  const devOf = {};   // asset id → 'mobile' | 'desktop' (read from the save; their links open on mobile unless set)
  const devSeg = r => '<span class="devseg" title="Opens on a phone or a desktop (saved with it)">' +
    ['mobile', 'desktop'].map(v => '<button type="button" data-act="dev" data-v="' + v + '" title="' + (v === 'mobile' ? 'Opens on a phone' : 'Opens on a desktop') + '"' + (devOf[r.id] === v ? ' class="on"' : '') + '>' + (v === 'mobile' ? '📱' : '🖥') + '</button>').join('') + '</span>';
  function fillDevices() {
    document.querySelectorAll('#sections .row').forEach(row => {
      if (!DEV_KINDS[row.dataset.kind] || !row.querySelector('.devseg')) return;
      const id = row.dataset.id, paint = () => row.querySelectorAll('.devseg button').forEach(x => x.classList.toggle('on', x.dataset.v === devOf[id]));
      if (devOf[id]) return paint();
      SIsb.getAsset(id).then(a => { devOf[id] = ((a && a.data) || {}).device === 'desktop' ? 'desktop' : 'mobile'; paint(); }, () => {});
    });
  }
  async function setDevice(row, v) {
    const id = row.dataset.id, a = assets.find(x => x.id === id); if (!a) return;
    const was = devOf[id]; devOf[id] = v;
    row.querySelectorAll('.devseg button').forEach(x => x.classList.toggle('on', x.dataset.v === v));
    try {
      const full = await SIsb.getAsset(id), data = Object.assign({}, (full && full.data) || {}, { device: v });
      await SIsb.saveAsset({ id, merchant_ref: a.merchant_ref, kind: a.kind, title: a.title || '', data });
      toast('Saved: its link opens on ' + (v === 'mobile' ? 'a phone' : 'a desktop'));
    } catch (x) {
      devOf[id] = was; row.querySelectorAll('.devseg button').forEach(y => y.classList.toggle('on', y.dataset.v === was));
      toast('Couldn’t save that: ' + (x.message || x));
    }
  }
  function rowHtml(s, r) {
    if (s.kind === 'roi') {
      const pos = picks.indexOf(r.id);
      return '<div class="row" data-kind="roi" data-id="' + esc(r.id) + '"><input type="checkbox" class="pick" data-act="pick" title="Include in the merchant options link"' + (pos >= 0 ? ' checked' : '') + '>' +
        '<span class="ord' + (pos >= 0 ? ' on' : '') + '">' + (pos >= 0 ? pos + 1 : '') + '</span><div class="rt"><div class="rn">' + esc(r.title || r.merchant || 'Scenario') + '</div>' +
        '<div class="rm">' + (r.updated_by === 'merchant' ? 'Merchant edited · ' : '') + esc(ago(r.updated_at)) + '</div></div>' +
        '<button class="btn small ghost" type="button" data-act="rename" title="Rename — also the tab label on a multi-option link">✎</button>' +
        '<button class="btn small primary" type="button" data-act="load">Load</button><button class="btn small" type="button" data-act="view" title="Open the branded proposal">↗</button></div>';
    }
    // Uploaded / linked docs have no form state to load — they just open.
    if (r.source === 'upload' || r.source === 'link') {
      return '<div class="row" data-kind="' + s.kind + '" data-id="' + esc(r.id) + '"><div class="rt"><div class="rn">' + (r.source === 'upload' ? '📎 ' : '🔗 ') + esc(r.title || 'Untitled') + '</div>' +
        '<div class="rm">' + (r.source === 'upload' ? 'Uploaded' : 'Linked') + ' · ' + esc(who(r.updated_by_email || r.rep_email)) + ' · ' + esc(ago(r.updated_at)) + '</div></div>' +
        '<button class="btn small ghost" type="button" data-act="rename" title="Rename">✎</button>' +
        '<button class="btn small primary" type="button" data-act="opendoc">Open ↗</button>' +
        '<button class="btn small ghost" type="button" data-act="del" title="Delete">✕</button></div>';
    }
    return '<div class="row" data-kind="' + s.kind + '" data-id="' + esc(r.id) + '"><div class="rt"><div class="rn">' + esc(r.title || 'Untitled') + '</div>' +
      '<div class="rm">' + esc(who(r.updated_by_email || r.rep_email)) + ' · ' + esc(ago(r.updated_at)) + '</div></div>' +
      (DEV_KINDS[s.kind] ? devSeg(r) : '') +
      '<button class="btn small ghost" type="button" data-act="rename" title="Rename">✎</button>' +
      '<button class="btn small primary" type="button" data-act="load">Load</button>' +
      (r.doc_url ? '<a class="btn small" href="' + esc(r.doc_url) + '" target="_blank" rel="noopener" title="Open the Google Doc">Doc ↗</a>' : '') +
      '<button class="btn small ghost" type="button" data-act="del" title="Delete this save">✕</button></div>';
  }

  // ── 🎨 Customize: an Aligned-style layout per folder ──
  // layout = { v:1, head:{bg,ink}, blocks:[{ id, type:'section'|'links'|'text'|'embed', w:2|3|4|6, hidden,
  //   title, emoji, bg, ink, links:[{label,url}], text, url, h }] }
  // A folder's layout is saved on the folder (merchants.layout), so the whole team sees it. Folders
  // without one use the default: yours ("Use as default"), else the team's (published by a hub admin),
  // else the built-in grid. Block ids: a section's kind, or b-xxxxxx for custom blocks.
  const WIDTHS = [[2, '⅓'], [3, '½'], [4, '⅔'], [6, 'Full']];
  const TYPE_LABEL = { links: 'Links', text: 'Notes', embed: 'Embed' };
  const TYPE_EMOJI = { links: '🔗', text: '📝', embed: '🎬' };
  const BUILTIN = () => ({ v: 1, head: {}, blocks: SECTIONS.map(s => ({ id: s.kind, type: 'section', w: 2 })) });
  const MY_DEFAULT_KEY = 'si_folder_layout_default';
  const clone = o => JSON.parse(JSON.stringify(o));
  let teamDefault = null, isAdmin = false, layoutCol = true;
  const folderLayouts = {};               // folder id → its saved layout (null = none saved)
  let editing = false, styling = null, cur = null, curFor = null, saveT = 0, lstatus = ['', false];
  const myDefault = () => { try { return JSON.parse(localStorage.getItem(MY_DEFAULT_KEY) || 'null'); } catch (e) { return null; } };
  const localLayout = id => { try { return JSON.parse(localStorage.getItem('si_folder_layout_' + id) || 'null'); } catch (e) { return null; } };
  // Every built-in section appears exactly once (new ones join at the end); custom blocks keep their content.
  function normalize(L) {
    L = clone(L && Array.isArray(L.blocks) ? L : BUILTIN());
    L.v = 1; L.head = L.head || {};
    const kinds = new Set(SECTIONS.map(s => s.kind)), seen = new Set();
    L.blocks = L.blocks.filter(b => b && b.id && !seen.has(b.id) && seen.add(b.id) && (b.type === 'section' ? kinds.has(b.id) : TYPE_LABEL[b.type]));
    SECTIONS.forEach(s => { if (!seen.has(s.kind)) L.blocks.push({ id: s.kind, type: 'section', w: 2 }); });
    L.blocks.forEach(b => { if (![2, 3, 4, 6].includes(b.w)) b.w = b.type === 'section' ? 2 : 3; });
    return L;
  }
  const layoutOf = id => normalize(folderLayouts[id] || myDefault() || teamDefault);
  async function loadLayout(id) {
    if (id in folderLayouts) return;
    if (layoutCol) {
      try {
        const c = await SIsb.client();
        const { data, error } = await c.from('merchants').select('layout').eq('id', id).single();
        if (error) throw error;
        folderLayouts[id] = data.layout || null; return;
      } catch (x) { if (x.code === '42703' || /layout/i.test(x.message || '')) layoutCol = false; }
    }
    folderLayouts[id] = localLayout(id);
  }
  function setStatus(msg, warn) { lstatus = [msg, !!warn]; const el = document.querySelector('.editbar .lstatus'); if (el) { el.textContent = msg; el.classList.toggle('warn', !!warn); } }
  function queueSave() { clearTimeout(saveT); setStatus('Saving…'); saveT = setTimeout(saveLayout, 450); }
  async function saveLayout(value) {
    const id = curFor; if (!id) return;
    const L = value === undefined ? clone(cur) : value;
    folderLayouts[id] = L;
    if (layoutCol) {
      try {
        const c = await SIsb.client();
        const { error } = await c.from('merchants').update({ layout: L }).eq('id', id);
        if (error) throw error;
        setStatus(L ? 'Saved ✓ · everyone on the team sees this layout' : 'This folder uses the default layout again'); return;
      } catch (x) {
        if (x.code === '42703' || /layout/i.test(x.message || '')) layoutCol = false;
        else { setStatus('Couldn’t save: ' + (x.message || x), true); return; }
      }
    }
    try { L ? localStorage.setItem('si_folder_layout_' + id, JSON.stringify(L)) : localStorage.removeItem('si_folder_layout_' + id); } catch (e) {}
    setStatus('Saved in this browser only. Run folder-layouts.sql in Supabase to share folder layouts with the team.', true);
  }
  // Pull the team default + admin flag once signed in.
  async function loadLayoutSettings() {
    try {
      const c = await SIsb.client();
      const [td, adm] = await Promise.all([c.from('hub_settings').select('value').eq('key', 'folder_layout').maybeSingle(), c.rpc('hub_is_admin')]);
      teamDefault = (td.data && td.data.value) || null; isAdmin = adm.data === true;
      if (openId && !editing) renderDetail();
    } catch (e) {}
  }

  const safeUrl = u => { u = String(u || '').trim(); if (!u) return ''; if (!/^[a-z][\w+.-]*:/i.test(u)) u = 'https://' + u; return /^https?:\/\//i.test(u) ? u : ''; };
  // Share links → their embeddable form (Loom, YouTube, Figma, Google Docs / Slides / Sheets).
  function embedSrc(u) {
    u = safeUrl(u); if (!u) return '';
    try {
      const x = new URL(u), host = x.hostname.replace(/^www\./, '');
      if (host === 'loom.com') return u.replace('/share/', '/embed/');
      if (host === 'youtu.be') return 'https://www.youtube.com/embed/' + x.pathname.slice(1);
      if (host === 'youtube.com') return x.searchParams.get('v') ? 'https://www.youtube.com/embed/' + x.searchParams.get('v') : u;
      if (host === 'figma.com' && !/\/embed/.test(x.pathname)) return 'https://www.figma.com/embed?embed_host=share&url=' + encodeURIComponent(u);
      if (host === 'docs.google.com') return u.replace(/\/(edit|view)([?#].*)?$/, '/preview');
    } catch (e) {}
    return u;
  }
  const linkify = t => esc(t).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');

  function editbarHtml() {
    const h = cur.head || {};
    return '<div class="editbar"><span class="etitle">🎨 Customizing</span>' +

  // ▾ Every block collapses to its title bar, like the Brand kit. Remembered per block in this browser

  // A card with its own background gets text that reads on it, in either theme.

  // ▾ Collapse / expand: the chevron, or a click on the title bar itself (not its buttons or links).

    for (let i = 0; i < 4; i++) {
      const r = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: await claudeHeaders(), body: JSON.stringify(body) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      data = await r.json();
      if (data.stop_reason !== 'pause_turn') break;
      body.messages = body.messages.concat([{ role: 'assistant', content: data.content }]);
    }
    const raw = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
    const j = JSON.parse(raw.slice(raw.indexOf('{'), raw.lastIndexOf('}') + 1));
    const abs = u => { try { return new URL(String(u).replace(/^\/\//, 'https://'), origin + '/').toString(); } catch (e) { return ''; } };
    return { lifestyle: (j.lifestyle || []).map(abs).filter(Boolean).map(u => ({ u, l: 'Home page' })), product: (j.product || []).map(abs).filter(Boolean).map(u => ({ u, l: 'Home page' })) };
  }
  async function webPick(f, slot) {
    if (!f.domain) return toast('Add ' + f.name + '’s store URL first (✎ Edit folder)');
    const origin = 'https://' + String(f.domain).replace(/^https?:\/\//i, '').replace(/\/.*$/, '');
    const isProd = slot === 'product', label = isProd ? 'Product photo' : 'Lifestyle photo';
    const w = document.createElement('div'); w.className = 'wpk';
    w.innerHTML = '<div class="wpk-b"><div class="wpk-h"><b>🌐 ' + esc(label) + ' from ' + esc(f.domain) + '</b><span id="wpkNote">Looking at the store…</span><button class="btn small" type="button" data-x>Close</button></div><div class="wpk-g' + (isProd ? ' prod' : '') + '" id="wpkG"><div class="wpk-m">Finding images…</div></div></div>';
    document.body.appendChild(w);
    w.addEventListener('click', e => { if (e.target === w || e.target.closest('[data-x]')) w.remove(); });
    const seen = new Set(), list = [], key = u => String(u).replace(/[?#].*$/, '').replace(/_\d+x\d*(?=\.)/, '');
    const add = arr => (arr || []).forEach(x => { const k = key(x.u); if (x.u && !seen.has(k)) { seen.add(k); list.push(x); } });
    const paint = (note) => {
      $('wpkNote').textContent = note || '';
      $('wpkG').innerHTML = list.length ? list.slice(0, 48).map((x, i) => '<button type="button" data-i="' + i + '" title="Use this one"><img src="' + esc(sized(x.u, 400)) + '" alt="" loading="lazy" onerror="this.closest(\'button\').remove()">' + esc(String(x.l || '').slice(0, 48)) + '</button>').join('') : '<div class="wpk-m">No ' + label.toLowerCase() + 's found on ' + esc(f.domain) + '. Upload one instead.</div>';
    };
    let shop = { product: [], lifestyle: [], shopify: false };
    try { shop = await shopifyImages(origin); } catch (e) {}
    if (shop.shopify) $('wpkNote').textContent = 'Sorting ' + (isProd ? 'product shots' : 'scenes from product shots') + '…';
    add(await rankByLook((isProd ? shop.product : shop.lifestyle).slice(0, 160), isProd));
    const signed = await SIsb.currentUser().catch(() => null);
    paint(shop.shopify ? (list.length ? 'From the store’s products and collections' + (isProd ? ' (best sellers first)' : '') + '.' + (signed ? ' Reading the home page too…' : '') : '') : (signed ? 'Reading the home page…' : 'This doesn’t look like a Shopify store. Sign in so Claude can read its home page.'));
    if (signed) {
      try { const c = await claudeImages(origin); const before = list.length; isProd ? add(c.product) : list.unshift(...c.lifestyle.filter(x => !seen.has(key(x.u)) && seen.add(key(x.u)))); paint((shop.shopify ? 'From the store’s products, collections and home page.' : 'From the store’s home page.') + (list.length === before ? '' : '')); }
      catch (e) { paint(list.length ? 'From the store’s products and collections (couldn’t read the home page).' : 'Couldn’t read ' + f.domain + '. Upload one instead.'); }
    }
    $('wpkG').addEventListener('click', async e => {
      const b = e.target.closest('[data-i]'); if (!b) return;
      const x = list[+b.dataset.i]; if (!x) return;
      $('wpkNote').textContent = 'Saving it to the brand kit…';
      // Copied into the brand kit's own storage (sized for its slot); if the store won't hand the file over, its link is kept.
      let v = sized(x.u, BK_MAX[slot] || 1600);
      try { const r = await fetch(v); if (r.ok) { const blob = await r.blob(); v = await bkShrink(blob, BK_MAX[slot] || 1600); } } catch (er) {}
      w.remove();
      bkSet(f, slot, v);
    });
  }
  async function bkSet(f, slot, v) {
    try {
      kits[f.id] = await SIBrand.set(f.id, slot, v);
      if (slot === 'main') {
        f.logo_path = kits[f.id].main || null;
        const act = SIsb.getActiveFolder(); if (act && act.id === f.id) { SIsb.setActiveFolder({ id: f.id, name: f.name, logo_path: f.logo_path }); hub({ type: 'active' }); }
      }
      renderDetail(); toast(v ? 'Saved to the brand kit' : 'Removed from the brand kit');
    } catch (x) { toast(x.message || String(x)); }
  }
  $('bkit').addEventListener('toggle', e => { try { localStorage.setItem('si_bkit_open', e.target.open ? '1' : '0'); } catch (x) {} });
  $('bkit').addEventListener('click', async e => {
    const b = e.target.closest('[data-bka]'); if (!b) return;
    const t = b.closest('[data-bk]'), f = folders.find(x => x.id === openId), slot = t ? t.dataset.bk : '', k = kits[openId] || {};
    if (!f) return;
    if (b.dataset.bka === 'up') { const inp = $('bkFile'); inp.dataset.slot = slot; inp.click(); }
    if (b.dataset.bka === 'web') return webPick(f, slot);
    if (b.dataset.bka === 'del') { if (confirm('Remove the ' + SIBrand.SLOTS.find(s => s.k === slot).label.toLowerCase() + ' from ' + f.name + '’s brand kit?')) bkSet(f, slot, ''); }
    if (b.dataset.bka === 'copy') { try { await navigator.clipboard.writeText(k[slot]); toast('Image link copied'); } catch (x) { prompt('Image link:', k[slot]); } }
    if (b.dataset.bka === 'pal') {
      if (!SIBrand.palette) return;
      const p = await SIBrand.palette(k.main || k.lock || k.secondary || k.hero || '');
      if (!p.length) return toast('Couldn’t find colors in the logo (upload a logo first)');
      return bkColors(f, { primary: p[0], accent: p[1] || p[0] });
    }
    if (b.dataset.bka === 'clrc') return bkColors(f, {});
    if (b.dataset.bka === 'build') {
      if (!window.SILockBuilder) return toast('The Lock builder didn’t load');
      SILockBuilder.open({ logo: k.main || k.secondary || '', useLabel: '✓ Save to the brand kit', onUse: u => bkSet(f, 'lock', u) });
    }
  });
  $('bkit').addEventListener('change', async e => {
    if (e.target.dataset.bkc) {
      const f = folders.find(x => x.id === openId); if (!f) return;
      const cur = Object.assign({}, (kits[openId] || {}).colors || {}); cur[e.target.dataset.bkc] = e.target.value;
      return bkColors(f, cur);
    }
    if (e.target.id !== 'bkFile') return;
    const file = e.target.files[0], slot = e.target.dataset.slot, f = folders.find(x => x.id === openId); e.target.value = '';
    if (!file || !f) return;
    try { bkSet(f, slot, await bkShrink(file, BK_MAX[slot] || 1200)); } catch (x) { toast('Couldn’t read that image'); }
  });

  // ── 📋 Brief: the merchant's call-prep facts, saved on the folder (merchants.brand.brief) so the
  // whole team sees them. Skills (demo-booked-recon, prep-call) fill the fields; reps edit them here.
  // ⤴ HubSpot copies the brief as formatted text and opens the deal: the rep clicks Create note and
  // pastes. No HubSpot app or token needed. (Claude can also post it for you: hub-map § Brief.) ──
  const BRIEF_FIELDS = [
    ['tldr', 'TL;DR', 'The one thing to know going in'],
    ['products', 'Products', 'What they sell, price points, bestsellers'],
    ['operations', 'Operations', 'Warehouse / 3PL, shipping, returns, channels'],
    ['size', 'Size', 'Employees, revenue, order volume'],
    ['apps', 'Apps found', 'Protection, returns, helpdesk, reviews, cart…'],
    ['contact', 'Contact', 'Who we’re meeting: role, tenure, LinkedIn'],
    ['people', 'People we know', 'Connections, ShipInsure brand ties'],
    ['history', 'History', 'Prior touches, calls, deals, lead source']
  ];
  const HS_PORTAL = '22466049';
  // The deal field → a HubSpot link: a pasted deal URL as is, a bare deal id as its record, blank = a deal search for the merchant.
  function hsDealUrl(deal, name) {
    const d = String(deal || '').trim();
    if (/^https:\/\/app[\w-]*\.hubspot\.com\//i.test(d)) return d;
    if (/^\d{4,}$/.test(d)) return 'https://app.hubspot.com/contacts/' + HS_PORTAL + '/record/0-3/' + d;
    return 'https://app.hubspot.com/contacts/' + HS_PORTAL + '/objects/0-3/views/all/list?query=' + encodeURIComponent(name || '');
  }
  const briefs = {};   // folder id → brief ({} when empty)
  let briefT = 0, briefStatus = '', briefFor = null;   // briefFor: the folder whose edits are pending
  async function briefLoad(id) {
    const c = await SIsb.client();
    const r = await c.from('merchants').select('brand').eq('id', id).single();
    if (r.error) throw r.error;
    return ((r.data && r.data.brand) || {}).brief || {};
  }
  async function briefSave(id, patch) {
    const c = await SIsb.client();
    const r = await c.from('merchants').select('brand').eq('id', id).single();
    if (r.error) throw r.error;
    const brand = Object.assign({}, (r.data && r.data.brand) || {});
    let me = ''; try { const u = await SIsb.currentUser(); me = (u && u.email) || ''; } catch (e) {}
    brand.brief = Object.assign({}, brand.brief || {}, patch, { updatedAt: new Date().toISOString(), updatedBy: me });
    Object.keys(brand.brief).forEach(k => { if (k[0] === '_') delete brand.brief[k]; });
    const { error } = await c.from('merchants').update({ brand: brand }).eq('id', id);
    if (error) throw error;
    return Object.assign({}, brand.brief);
  }
  const briefFilled = b => BRIEF_FIELDS.filter(([k]) => String(b[k] || '').trim()).length;
  function renderBrief(f, force) {
    const el = $('brief'); if (!el) return;
    // Don't redraw under a rep who's typing in this folder's brief.
    if (!force && el.dataset.fid === f.id && el.contains(document.activeElement) && document.activeElement.matches('textarea, input')) return;
    if (el.dataset.fid !== f.id) briefStatus = '';
    el.dataset.fid = f.id;
    const b = briefs[f.id];
    if (!b) { el.innerHTML = '<summary>📋 Brief <span class="n">loading…</span></summary>'; briefLoad(f.id).then(v => { briefs[f.id] = v; if (openId === f.id) renderBrief(f); }, () => { briefs[f.id] = { failed: true }; if (openId === f.id) renderBrief(f); }); return; }
    let open = true; try { open = localStorage.getItem('si_brief_open') !== '0'; } catch (e) {}
    el.open = open;
    const n = briefFilled(b);
    el.innerHTML = '<summary>📋 Brief <span class="n">' + n + ' of ' + BRIEF_FIELDS.length + (b.updatedAt ? ' · updated ' + esc(ago(b.updatedAt)) + (b.updatedBy ? ' by ' + esc(who(b.updatedBy)) : '') : '') + '</span></summary>' +
      '<div class="bk-note">' + (b.failed ? 'Couldn’t load the brief (sign in?).' : 'Call-prep facts for this merchant. Recon fills these in; edit anything, it saves as you type.') + '</div>' +
      '<div class="br-grid">' + BRIEF_FIELDS.map(([k, label, ph]) =>
        '<label class="br-f' + (k === 'tldr' ? ' wide' : '') + '"><span>' + esc(label) + '</span><textarea data-brf="' + k + '" rows="' + (k === 'tldr' ? 3 : 2) + '" placeholder="' + esc(ph) + '">' + esc(b[k] || '') + '</textarea></label>').join('') + '</div>' +
      '<div class="br-hs"><input type="text" data-brf="deal" value="' + esc(b.deal || '') + '" placeholder="HubSpot deal link or ID (blank = search deals by the merchant name)" autocomplete="off">' +
        '<button class="btn small" type="button" data-bract="copy" title="Copy the brief as text">📋 Copy</button>' +
        '<button class="btn small primary" type="button" data-bract="push" title="Copies the brief and opens the deal in HubSpot: click Create note, then paste (⌘V)">⤴ Copy + open deal</button></div>' +
      '<div class="br-st"><span class="br-msg">' + esc(briefStatus) + '</span></div>';
    el.querySelectorAll('textarea').forEach(briefFit);
  }
  function briefFit(t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight + 2, 420) + 'px'; }
  function briefSetStatus(msg) { briefStatus = msg; const s = document.querySelector('#brief .br-msg'); if (s) s.textContent = msg; }
  function briefFlush() {
    clearTimeout(briefT);
    const id = briefFor, b = briefs[id]; if (!id || !b || !b._dirty) return Promise.resolve();
    const patch = {}; BRIEF_FIELDS.forEach(([k]) => { patch[k] = b[k] || ''; }); patch.deal = b.deal || '';
    b._dirty = false; briefSetStatus('Saving…');
    return briefSave(id, patch).then(v => { briefs[id] = Object.assign(v, { _dirty: b._dirty }); if (openId === id) { briefSetStatus('Saved ✓'); const n = document.querySelector('#brief summary .n'); if (n) n.textContent = briefFilled(v) + ' of ' + BRIEF_FIELDS.length + ' · updated just now' + (v.updatedBy ? ' by ' + who(v.updatedBy) : ''); } }, x => { b._dirty = true; briefSetStatus('Couldn’t save: ' + (x.message || x)); });
  }
  function briefText(f, b, html) {
    const rows = BRIEF_FIELDS.filter(([k]) => String(b[k] || '').trim());
    if (!html) return 'Brief · ' + f.name + '\n\n' + rows.map(([k, l]) => l + ': ' + String(b[k]).trim()).join('\n\n');
    const h = s => esc(String(s).trim()).replace(/\n/g, '<br>');
    return '<h3>📋 Brief · ' + esc(f.name) + '</h3>' + rows.map(([k, l]) => '<p><strong>' + esc(l) + ':</strong> ' + h(b[k]) + '</p>').join('') +
      (f.domain ? '<p><strong>Store:</strong> ' + esc(f.domain) + '</p>' : '') +
      '<p><strong>Brand Folder:</strong> <a href="https://drewshafe.github.io/si-rep-hub/folders.html?id=' + esc(f.id) + '">Rep Hub ↗</a></p>';
  }
  $('brief').addEventListener('toggle', e => { try { localStorage.setItem('si_brief_open', e.target.open ? '1' : '0'); } catch (x) {} });
  $('brief').addEventListener('input', e => {
    const k = e.target.dataset.brf, b = briefs[openId]; if (!k || !b) return;
    if (briefFor && briefFor !== openId) briefFlush();
    briefFor = openId; b[k] = e.target.value; b._dirty = true;
    if (e.target.tagName === 'TEXTAREA') briefFit(e.target);
    const sum = document.querySelector('#brief summary .n'); if (sum) sum.textContent = briefFilled(b) + ' of ' + BRIEF_FIELDS.length + ' · editing';
    briefSetStatus('Unsaved changes…'); clearTimeout(briefT); briefT = setTimeout(briefFlush, 800);
  });
  $('brief').addEventListener('focusout', () => { setTimeout(() => { if (!$('brief').contains(document.activeElement)) briefFlush(); }, 0); });
  $('brief').addEventListener('click', async e => {
    const btn = e.target.closest('[data-bract]'); if (!btn) return;
    const f = folders.find(x => x.id === openId), b = briefs[openId]; if (!f || !b) return;
    if (!briefFilled(b)) return toast('The brief is empty');
    if (btn.dataset.bract === 'copy') {
      const t = briefText(f, b, false);
      try { await navigator.clipboard.writeText(t); toast('Brief copied'); } catch (x) { prompt('Copy the brief:', t); }
      return;
    }
    // ⤴ HubSpot: copy the brief as rich text (bold labels survive the paste) and open the deal.
    // Both start right here in the click, so the popup and clipboard aren't blocked.
    const html = briefText(f, b, true), text = briefText(f, b, false);
    window.open(hsDealUrl(b.deal, f.name), '_blank', 'noopener');
    let copied;
    try { copied = navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([text], { type: 'text/plain' }) })]); }
    catch (x) { copied = navigator.clipboard.writeText(text); }
    try { await copied; briefSetStatus('Copied ✓ · in HubSpot: Notes → Create note → paste (⌘V) → Save'); toast('Brief copied: paste it into a note on the deal'); }
    catch (x) { prompt('Copy the brief, then paste it into a note on the deal:', text); }
  });
  window.addEventListener('beforeunload', () => { briefFlush(); });

  // ── create / edit folder ──
  function folderForm(f) {
    const dim = document.createElement('div');
    dim.className = 'back-dim';
    dim.innerHTML = '<form class="modal" novalidate><h3>' + (f ? 'Edit folder' : 'New merchant folder') + '</h3>' +
      '<p>' + (f ? 'Renaming keeps every save in this folder.' : 'One folder per merchant. Every tool saves into the active merchant’s folder.') + '</p>' +
      '<div class="field"><label>Merchant name</label><input id="fName" value="' + esc(f ? f.name : '') + '" placeholder="e.g. Original Grain" required></div>' +
      '<div class="field"><label>Store URL (optional)</label><input id="fDomain" value="' + esc(f ? f.domain || '' : '') + '" placeholder="originalgrain.com"></div>' +
      '<div class="field"><label>Logo (optional)</label><div class="logo-pick"><div id="fLogoPrev">' + (f ? logoHtml(f) : logoHtml({ name: '?' })) + '</div>' +
      '<button class="btn small" type="button" id="fLogoBtn">Upload logo</button>' + (f && f.logo_path ? '<button class="btn small ghost" type="button" id="fLogoClear">Remove</button>' : '') +
      '<input type="file" id="fLogo" accept="image/*" hidden></div></div>' +
      '<div class="err" id="fErr"></div>' +
      '<div class="mactions"><button class="btn" type="button" id="fCancel">Cancel</button><button class="btn primary" type="submit" id="fSave">' + (f ? 'Save' : 'Create folder') + '</button></div></form>';
    document.body.appendChild(dim);
    let logoData, logoCleared = false;   // undefined = unchanged
    const close = () => dim.remove();
    dim.addEventListener('mousedown', e => { if (e.target === dim) close(); });
    dim.querySelector('#fCancel').onclick = close;
    dim.querySelector('#fLogoBtn').onclick = () => dim.querySelector('#fLogo').click();
    const clr = dim.querySelector('#fLogoClear'); if (clr) clr.onclick = () => { logoCleared = true; logoData = undefined; dim.querySelector('#fLogoPrev').innerHTML = logoHtml({ name: dim.querySelector('#fName').value || '?' }); };
    dim.querySelector('#fLogo').onchange = e => {
      const file = e.target.files[0]; if (!file) return;
      const r = new FileReader();
      r.onload = () => { const im = new Image(); im.onload = () => {
        const k = Math.min(1, 256 / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement('canvas');
        c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        logoData = c.toDataURL('image/png'); logoCleared = false;
        dim.querySelector('#fLogoPrev').innerHTML = '<div class="logo"><img src="' + logoData + '" alt=""></div>';
      }; im.src = r.result; };
      r.readAsDataURL(file);
    };
    dim.querySelector('form').onsubmit = async e => {
      e.preventDefault();
      const name = dim.querySelector('#fName').value.trim(), domain = dim.querySelector('#fDomain').value.trim().replace(/^https?:\/\//i, '').replace(/\/$/, '');
      const err = dim.querySelector('#fErr');
      if (!name) { err.textContent = 'Enter the merchant’s name.'; return; }
      const save = dim.querySelector('#fSave'); save.disabled = true; err.textContent = '';
      try {
        let logoUrl;
        if (logoData) logoUrl = await SIsb.uploadLogo(logoData);
        else if (logoCleared) logoUrl = null;
        let saved;
        if (f) {
          if (name.toLowerCase() !== f.name.toLowerCase() && folders.some(x => x.id !== f.id && x.name.toLowerCase() === name.toLowerCase())) throw new Error('Another folder already uses that name.');
          saved = await SIsb.updateFolder(f.id, { name: name, domain: domain || null, logoUrl: logoUrl });
          Object.assign(f, saved);
          if (kits[f.id]) kits[f.id].main = f.logo_path || '';
          const act = SIsb.getActiveFolder(); if (act && act.id === f.id) { SIsb.setActiveFolder({ id: f.id, name: f.name, logo_path: f.logo_path }); hub({ type: 'active' }); }
          close(); renderDetail(); toast('Folder updated');
        } else {
          saved = await SIsb.createFolder({ name: name, domain: domain || null, logoUrl: logoUrl || null });
          const i = folders.findIndex(x => x.id === saved.id);
          if (i >= 0) folders[i] = Object.assign(folders[i], saved); else folders.push(saved);
          activate(saved);
          close(); showFolder(saved.id); toast(saved.existed ? 'That folder already existed — opened it' : 'Folder created and set as active');
        }
      } catch (x) { err.textContent = x.message || String(x); save.disabled = false; }
    };
    setTimeout(() => dim.querySelector('#fName').focus(), 30);
  }

  // ── auth ──
  async function signIn() {
    const email = prompt('Sign in to Merchant Folders.\nEnter your ShipInsure email — we’ll send a magic link:');
    if (!email) return;
    try {
      const { error } = await SIsb.signInMagic(email.trim());
      toast(error ? 'Error: ' + error.message : 'Magic link sent to ' + email.trim() + ' — open it in this browser, then come back');
    } catch (x) { toast('Error: ' + (x.message || x)); }
  }
  $('signinBtn').addEventListener('click', signIn);

  async function boot() {
    try { user = await SIsb.currentUser(); } catch (e) { user = null; }
    $('acct').innerHTML = user ? esc(user.email) + ' · <button class="btn small ghost" type="button" id="soBtn">Sign out</button>' : '';
    if (user) $('soBtn').onclick = async () => { await SIsb.signOut(); location.reload(); };
    $('newBtn').hidden = !user;
    if (!user) { $('signin').hidden = false; opReady(); return; }
    loadLayoutSettings();
    try { await loadAll(); }
    catch (x) { $('listView').hidden = false; $('grid').innerHTML = '<div class="empty" style="grid-column:1/-1"><b>Couldn’t load folders</b>' + esc(x.message || x) + '</div>'; opReady(); return; }
    const want = (location.hash.match(/f=([\w-]+)/) || [])[1];
    want && folders.some(f => f.id === want) ? showFolder(want) : showList();
    opReady();
  }

  // Active merchant changed elsewhere (another tab or the Hub chip) → repaint.
  SIsb.onActiveFolder(() => openId ? renderDetail() : renderList());
  // Rep Hub theme hand-off
  const setTheme = t => document.body.classList.toggle('pm', t === 'midnight');
  setTheme(new URLSearchParams(location.search).get('theme'));
  window.addEventListener('message', e => {
    const d = e.data || {};
    if (d.siHub === 'apply' && d.theme) setTheme(d.theme);
    if (d.siHub === 'refresh') loadAll().then(() => openId ? renderDetail() : renderList()).catch(() => {});
  });
  boot();
</script>
</body>
</html>

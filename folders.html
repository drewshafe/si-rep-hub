<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merchant Folders · ShipInsure Rep Hub</title>
<link rel="icon" type="image/png" href="Rephubfavi.png">
<script src="https://drewshafe.github.io/si-roi-calculator/sb.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  :root { --page:#f4f5fb; --card:#fff; --ink:#1d2240; --muted:#6b7090; --line:#e3e5f2; --accent:#4a5fc1; --accent-soft:#eef0ff; --ok:#1f7a45; --ok-soft:#e5f7ec; --danger:#c0392b; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--page); color:var(--ink); min-height:100vh; font-size:14px; }
  .wrap { max-width:1180px; margin:0 auto; padding:22px 24px 60px; }
  button, input, select { font:inherit; }
  .btn { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:8px 13px; font-weight:600; font-size:13px; cursor:pointer; white-space:nowrap; }
  .btn:hover { border-color:#c9cdf0; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover { filter:brightness(1.07); }
  .btn.ghost { background:transparent; }
  .btn.small { padding:5px 10px; font-size:12px; }
  .btn.danger { color:var(--danger); border-color:#f1c6c0; }
  .btn:disabled { opacity:.5; cursor:default; }

  /* top bar */
  .top { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  .top h1 { font-size:22px; font-weight:800; letter-spacing:-.01em; margin-right:auto; }
  .search { flex:0 1 300px; min-width:180px; border:1px solid var(--line); border-radius:8px; padding:8px 12px; background:var(--card); color:var(--ink); }
  .search:focus, .field input:focus { outline:none; border-color:var(--accent); }
  .acct { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:8px; }
  .chk { display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); cursor:pointer; }

  /* folder grid */
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:14px; }
  .fcard { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; cursor:pointer; display:flex; flex-direction:column; gap:10px; transition:border-color .15s, box-shadow .15s; position:relative; }
  .fcard:hover { border-color:#c9cdf0; box-shadow:0 6px 20px rgba(30,40,90,0.07); }
  .fcard.is-active { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); }
  .fcard.is-archived { opacity:.6; }
  .fhead { display:flex; align-items:center; gap:11px; min-width:0; }
  .logo { width:42px; height:42px; border-radius:10px; flex:0 0 auto; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; overflow:hidden; border:1px solid var(--line); }
  .logo img { width:100%; height:100%; object-fit:contain; background:#fff; }
  .fname { font-weight:700; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .fsub { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .counts { display:flex; flex-wrap:wrap; gap:5px; }
  .cnt { font-size:11px; font-weight:700; color:var(--accent); background:var(--accent-soft); border-radius:20px; padding:2px 8px; }
  .cnt.none { color:var(--muted); background:#f1f2f7; }
  .badge { position:absolute; top:12px; right:12px; font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--ok); background:var(--ok-soft); border-radius:20px; padding:2px 8px; }
  .empty { text-align:center; color:var(--muted); padding:50px 20px; background:var(--card); border:1px dashed var(--line); border-radius:14px; }
  .empty b { display:block; color:var(--ink); font-size:16px; margin-bottom:6px; }

  /* folder detail */
  .back { font-size:13px; font-weight:600; color:var(--accent); background:none; border:none; cursor:pointer; margin-bottom:14px; }
  .dhead { display:flex; align-items:center; gap:14px; flex-wrap:wrap; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; }
  .dhead .logo { width:56px; height:56px; font-size:20px; border-radius:12px; }
  .dhead .dtitle { margin-right:auto; min-width:0; }
  .dhead h2 { font-size:20px; font-weight:800; }
  .dhead a { color:var(--accent); text-decoration:none; font-size:13px; }
  .sections { display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:14px; }
  .sec { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
  .sec h3 { font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:10px; display:flex; align-items:center; gap:8px; }
  .sec h3 .n { color:var(--accent); background:var(--accent-soft); border-radius:20px; padding:1px 7px; font-size:11px; letter-spacing:0; }
  .row { display:flex; align-items:center; gap:8px; padding:9px 0; border-top:1px solid #f0f1f7; }
  .row:first-of-type { border-top:0; }
  .row .rt { flex:1; min-width:0; }
  .row .rn { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .rm { font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .none { font-size:12.5px; color:var(--muted); padding:4px 0 2px; }
  .sec h3 .docacts { margin-left:auto; display:flex; gap:6px; text-transform:none; letter-spacing:0; }
  .row .pick { flex:0 0 auto; width:16px; height:16px; cursor:pointer; accent-color:var(--accent); }
  .row .ord { flex:0 0 auto; width:18px; height:18px; border-radius:50%; background:var(--accent); color:#fff; font-size:11px; font-weight:800; display:none; align-items:center; justify-content:center; }
  .row .ord.on { display:inline-flex; }
  .row .rn-edit { width:100%; font-weight:600; border:1px solid var(--accent); border-radius:6px; padding:3px 7px; outline:none; }
  .optbar { display:none; gap:6px; margin-top:8px; padding-top:10px; border-top:1px dashed var(--line); align-items:center; }
  .optbar.on { display:flex; }
  .optbar .hint { font-size:11.5px; color:var(--muted); margin-right:auto; }
  .roiadd { display:flex; gap:6px; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); }
  .roiadd input { flex:1; min-width:0; border:1px solid var(--line); border-radius:8px; padding:6px 10px; background:var(--page); color:var(--ink); font-size:12.5px; }
  .roiadd input:focus { outline:none; border-color:var(--accent); }
  .unfiled { margin-top:22px; }
  .unfiled h3 { font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:8px; }
  .unfiled .sec { max-width:760px; }

  /* modal */
  .back-dim { position:fixed; inset:0; background:rgba(14,16,40,.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; }
  .modal { width:min(440px, 100%); background:var(--card); color:var(--ink); border-radius:16px; padding:22px; box-shadow:0 24px 70px rgba(0,0,0,.3); }
  .modal h3 { font-size:18px; margin-bottom:4px; }
  .modal p { font-size:12.5px; color:var(--muted); margin-bottom:14px; line-height:1.45; }
  .field { display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
  .field label { font-size:12px; font-weight:700; color:var(--muted); }
  .field input { border:1px solid var(--line); border-radius:8px; padding:9px 11px; background:var(--page); color:var(--ink); }
  .mactions { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
  .err { color:var(--danger); font-size:12.5px; min-height:16px; }
  .logo-pick { display:flex; align-items:center; gap:10px; }

  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(90px); background:#222; color:#fff; font-weight:600; font-size:13px; padding:10px 16px; border-radius:8px; transition:transform .25s; z-index:60; }
  .toast.show { transform:translateX(-50%) translateY(0); }

  /* Project Midnight */
  body.pm { --page:#07070a; --card:#111116; --ink:#ece6d6; --muted:#9a927f; --line:#26262f; --accent:#d4af37; --accent-soft:#1f1b10; --ok:#7fd39c; --ok-soft:#14261a; }
  body.pm .btn.primary { color:#0a0a0a; background:linear-gradient(135deg,#b8902d,#e3c56a); border-color:transparent; }
  body.pm .cnt.none { background:#191920; }
  body.pm .logo img { background:#1a1a20; }

  @media (max-width:640px) { .wrap { padding:16px 14px 50px; } .sections { grid-template-columns:1fr; } }

  /* ── 🎨 Customize: an Aligned-style layout per folder ──
     The sections are blocks on a 6-column grid: ⅓ = 2, ½ = 3, ⅔ = 4, Full = 6 columns. */
  .sections { grid-template-columns:repeat(6, minmax(0, 1fr)); }
  .blk { grid-column:span 2; position:relative; min-width:0; }
  .blk.w3 { grid-column:span 3; } .blk.w4 { grid-column:span 4; } .blk.w6 { grid-column:span 6; }
  .blk h3 { color:var(--blk-ink, var(--muted)); }
  .dhead.inked a, .dhead.inked .fsub { color:inherit; opacity:.85; }
  @media (max-width:980px) { .blk, .blk.w3, .blk.w4 { grid-column:span 3; } }
  @media (max-width:640px) { .sections { grid-template-columns:repeat(6, minmax(0, 1fr)); } .blk, .blk.w3, .blk.w4, .blk.w6 { grid-column:span 6; } }
  .editing .blk { outline:1.5px dashed #c3c8ef; outline-offset:3px; }
  .editing .blk.is-hidden { opacity:.45; }
  .blk.dragging { opacity:.45; outline-style:solid; outline-color:var(--accent); }
  .btools { display:none; position:absolute; top:-14px; right:12px; z-index:3; align-items:center; gap:2px; padding:2px 5px; background:var(--card); border:1px solid var(--line); border-radius:999px; box-shadow:0 4px 14px rgba(30,40,90,.13); }
  .editing .btools { display:flex; }
  .btools button { border:0; background:none; color:var(--ink); min-width:24px; height:24px; padding:0 5px; border-radius:999px; font-size:12px; font-weight:700; cursor:pointer; }
  .btools button:hover { background:var(--accent-soft); }
  .btools button.on { background:var(--accent); color:#fff; }
  .btools .bdrag { cursor:grab; font-size:14px; touch-action:none; }
  .btools .sep { width:1px; height:14px; background:var(--line); margin:0 3px; }
  .bresize { display:none; position:absolute; top:14px; bottom:14px; right:-8px; width:12px; cursor:ew-resize; touch-action:none; z-index:2; }
  .editing .bresize { display:block; }
  .bresize::after { content:''; position:absolute; left:4px; top:50%; height:36px; margin-top:-18px; width:4px; border-radius:2px; background:#b9bfe8; }
  .bresize:hover::after { background:var(--accent); }
  .editbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:var(--card); border:1px solid var(--accent); border-radius:14px; padding:10px 12px; margin:-4px 0 22px; position:sticky; top:8px; z-index:5; box-shadow:0 8px 24px rgba(30,40,90,.10); }
  .editbar .etitle { font-weight:800; }
  .editbar .ehint { font-size:11.5px; color:var(--muted); flex:1 1 220px; }
  .editbar .ehead { display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--muted); font-weight:600; }
  .editbar input[type=color], .bstyle input[type=color] { width:30px; height:26px; padding:1px; border:1px solid var(--line); border-radius:6px; background:var(--card); cursor:pointer; }
  .editbar .lstatus { font-size:11.5px; color:var(--ok); font-weight:600; flex-basis:100%; }
  .editbar .lstatus.warn { color:var(--danger); }
  .bstyle { display:grid; grid-template-columns:auto 1fr; gap:7px 10px; align-items:center; margin-top:12px; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--page); font-size:12px; }
  .bstyle label { font-weight:700; color:var(--muted); }
  .bstyle .brow { display:flex; align-items:center; gap:6px; }
  .sec h3 .bico { width:18px; height:18px; object-fit:contain; border-radius:4px; flex:0 0 auto; }
  .bstyle .icobox { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .bstyle .icobox input[data-bf=emoji] { width:90px; flex:0 0 auto; }
  .bstyle .icobox .or { color:var(--muted); font-weight:600; }
  .bstyle .icobox .ico-prev { width:26px; height:26px; object-fit:contain; border:1px solid var(--line); border-radius:6px; background:#fff; padding:1px; }
  .bstyle input[type=text], .bstyle select { border:1px solid var(--line); border-radius:7px; padding:5px 8px; background:var(--card); color:var(--ink); min-width:0; width:100%; }
  .lnks { display:flex; flex-wrap:wrap; gap:8px; }
  .lnk { display:inline-flex; align-items:center; gap:6px; padding:8px 12px; border-radius:10px; border:1px solid var(--line); background:var(--page); color:var(--ink); font-weight:600; font-size:13px; text-decoration:none; max-width:100%; }
  .lnk span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lnk:hover { border-color:var(--accent); color:var(--accent); }
  .lnk-ed { display:grid; grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr) auto; gap:6px; margin-bottom:6px; }
  .lnk-ed input, .bfield { border:1px solid var(--line); border-radius:7px; padding:6px 9px; background:var(--page); color:var(--ink); font-size:12.5px; min-width:0; width:100%; }
  .btext { white-space:pre-wrap; line-height:1.55; font-size:13.5px; }
  .btext a { color:var(--accent); }
  textarea.bfield { min-height:110px; resize:vertical; font:inherit; font-size:13px; line-height:1.5; }
  .bembed { width:100%; border:0; border-radius:10px; background:var(--page); display:block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>📁 Merchant Folders</h1>
    <input class="search" id="search" placeholder="🔎 Search merchants…" autocomplete="off">
    <label class="chk"><input type="checkbox" id="showArchived"> Show archived</label>
    <button class="btn primary" id="newBtn" type="button">＋ New folder</button>
    <div class="acct" id="acct"></div>
  </div>

  <div id="signin" class="empty" hidden>
    <b>Sign in to see your team’s merchant folders</b>
    Same login as the calculators’ ☁ Cloud Save and Merchant Vault.<br><br>
    <button class="btn primary" id="signinBtn" type="button">Sign in with a magic link</button>
  </div>

  <div id="listView" hidden>
    <div class="grid" id="grid"></div>
  </div>

  <div id="unfiled" class="unfiled" hidden></div>

  <div id="detailView" hidden>
    <button class="back" id="backBtn" type="button">← All folders</button>
    <div class="dhead" id="dhead"></div>
    <div id="editbar"></div>
    <div class="sections" id="sections"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  // Merchant Folders — the Rep Hub's home base. One folder per merchant holding every tool's
  // saves (ROI scenarios + merchant_assets). Loading a save asks the Hub to open the right tab.
  const SECTIONS = [
    { kind: 'roi',      label: 'ROI Scenarios',        tool: 'ROI Builder' },
    { kind: 'proposal', label: 'Proposals',            tool: 'Proposal & MSA Generator' },
    { kind: 'msa',      label: 'MSA + SOW',            tool: 'Proposal & MSA Generator' },
    { kind: 'mnda',     label: 'MNDA',                 tool: 'Proposal & MSA Generator' },
    { kind: 'checkout', label: 'Checkout Experience',  tool: 'Checkout Experience' },
    { kind: 'email',    label: 'Email Automation',     tool: 'Email Automation' },
    { kind: 'claim',    label: 'Claim Wizard',         tool: 'Claim Wizard' },
    { kind: 'onepager', label: 'One-Pagers',           tool: 'One-Pager' },
  ];
  // Sections where a rep can also file an existing document (upload or link) instead of generating one.
  const DOC_KINDS = { proposal: 1, msa: 1, mnda: 1, checkout: 1, email: 1, claim: 1, onepager: 1 };
  // Of those, the tool sections file existing mockups (Figma exports, screenshots) — images allowed too.
  const MOCKUP_KINDS = { checkout: 1, email: 1, claim: 1 };
  const SHORT = { roi: 'ROI', proposal: 'Proposal', msa: 'MSA', mnda: 'MNDA', checkout: 'Checkout', email: 'Email', claim: 'Claims', onepager: 'One-Pager' };
  const CALC = 'https://drewshafe.github.io/si-roi-calculator/';
  // One-Pagers are filed as kind 'onepager'; until the hosted sb.js lists it, add it (same array saveAsset checks).
  if (window.SIsb && Array.isArray(SIsb.ASSET_KINDS) && SIsb.ASSET_KINDS.indexOf('onepager') < 0) SIsb.ASSET_KINDS.push('onepager');

  const $ = id => document.getElementById(id);
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const initials = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
  const logoHtml = f => f.logo_path ? '<div class="logo"><img src="' + esc(f.logo_path) + '" alt=""></div>' : '<div class="logo">' + esc(initials(f.name)) + '</div>';
  function ago(t) {
    if (!t) return '';
    const s = (Date.now() - Date.parse(t)) / 1000;
    if (s < 60) return 'just now';
    if (s < 3600) return Math.round(s / 60) + 'm ago';
    if (s < 86400) return Math.round(s / 3600) + 'h ago';
    if (s < 86400 * 30) return Math.round(s / 86400) + 'd ago';
    return new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }
  const who = e => (e || '').split('@')[0];
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200); }
  const hub = msg => { try { parent.postMessage(Object.assign({ siHub: 'folders' }, msg), '*'); } catch (e) {} };

  let user = null, folders = [], assets = [], scenarios = [], unfiled = [], openId = null;
  let picks = [];   // ROI scenario ids ticked for the options link, in pick order (= tab order)
  let roiDraft = ''; // pasted ROI calc link not yet saved (survives re-renders)

  // ── data ──
  async function loadAll() {
    const [f, a, c] = await Promise.all([
      SIsb.listFolders({ includeArchived: true }),
      SIsb.listAssets(),
      SIsb.listConfigs()
    ]);
    folders = f; assets = a; scenarios = c.filter(x => x.merchant_ref); unfiled = c.filter(x => !x.merchant_ref);
  }
  const itemsFor = id => ({
    roi: scenarios.filter(x => x.merchant_ref === id),
    ...Object.fromEntries(SECTIONS.filter(s => s.kind !== 'roi').map(s => [s.kind, assets.filter(a => a.merchant_ref === id && a.kind === s.kind)]))
  });
  // Most recently worked-on first: latest of the folder, its saves and its scenarios.
  function lastTouched(f) {
    let t = Date.parse(f.updated_at) || 0;
    assets.forEach(a => { if (a.merchant_ref === f.id) t = Math.max(t, Date.parse(a.updated_at) || 0); });
    scenarios.forEach(c => { if (c.merchant_ref === f.id) t = Math.max(t, Date.parse(c.updated_at) || 0); });
    return t;
  }

  // ── list view ──
  function renderList() {
    const q = $('search').value.trim().toLowerCase(), showArch = $('showArchived').checked;
    const active = SIsb.getActiveFolder();
    const list = folders.filter(f => (showArch || !f.archived) && (!q || f.name.toLowerCase().includes(q) || (f.domain || '').toLowerCase().includes(q)))
      .sort((a, b) => lastTouched(b) - lastTouched(a));
    $('grid').innerHTML = list.length ? list.map(f => {
      const it = itemsFor(f.id);
      const chips = SECTIONS.map(s => it[s.kind].length ? '<span class="cnt">' + it[s.kind].length + ' ' + SHORT[s.kind] + '</span>' : '').join('');
      return '<div class="fcard' + (active && active.id === f.id ? ' is-active' : '') + (f.archived ? ' is-archived' : '') + '" data-id="' + esc(f.id) + '">' +
        (active && active.id === f.id ? '<span class="badge">Active</span>' : f.archived ? '<span class="badge" style="color:var(--muted);background:#f1f2f7">Archived</span>' : '') +
        '<div class="fhead">' + logoHtml(f) + '<div style="min-width:0"><div class="fname">' + esc(f.name) + '</div><div class="fsub">' + esc(f.domain || 'Updated ' + ago(new Date(lastTouched(f)).toISOString())) + '</div></div></div>' +
        '<div class="counts">' + (chips || '<span class="cnt none">No saves yet</span>') + '</div></div>';
    }).join('') : '<div class="empty" style="grid-column:1/-1"><b>' + (q ? 'No folders match “' + esc(q) + '”' : 'No merchant folders yet') + '</b>' + (q ? '' : 'Click ＋ New folder to create the first one.') + '</div>';
    // ROI scenarios saved before folders existed (no merchant_ref) — file them in one click.
    const uf = unfiled.filter(c => !q || (c.merchant || '').toLowerCase().includes(q) || (c.title || '').toLowerCase().includes(q));
    $('unfiled').hidden = !uf.length;
    $('unfiled').innerHTML = uf.length ? '<h3>Unfiled ROI scenarios (' + uf.length + ')</h3><div class="sec">' + uf.map(c =>
      '<div class="row" data-kind="roi" data-id="' + esc(c.id) + '"><div class="rt"><div class="rn">' + esc(c.merchant || 'No merchant name') + ' — ' + esc(c.title || 'Scenario') + '</div><div class="rm">' + esc(ago(c.updated_at)) + '</div></div>' +
      '<button class="btn small primary" type="button" data-act="file">Create folder &amp; file</button><button class="btn small" type="button" data-act="view" title="Open the branded proposal">↗</button></div>').join('') + '</div>' : '';

  const layoutOf = id => normalize(folderLayouts[id] || myDefault() || teamDefault);

  const safeUrl = u => { u = String(u || '').trim(); if (!u) return ''; if (!/^[a-z][\w+.-]*:/i.test(u)) u = 'https://' + u; return /^https?:\/\//i.test(u) ? u : ''; };

    return '<div class="bstyle">' +

  function customInner(b) {

  // Drag ⠿ to move, drag the right edge to resize (pointer events: works inside the Hub's frame).

    const el = h.closest('[data-bid]'), b = blockOf(el); if (!b) return;
    e.preventDefault();
    let move;
    if (h.dataset.bact === 'drag') {
      el.classList.add('dragging');
      move = ev => {
        const t = document.elementFromPoint(ev.clientX, ev.clientY), over = t && t.closest('#sections > .blk');
        if (!over || over === el) return;
        const r = over.getBoundingClientRect();
        const after = ev.clientY > r.bottom - r.height / 3 || (ev.clientY > r.top + r.height / 3 && ev.clientX > r.left + r.width / 2);
        if (after ? over.nextElementSibling !== el : over.previousElementSibling !== el) over.parentNode.insertBefore(el, after ? over.nextSibling : over);
      };
    } else {
      const grid = $('sections'), gap = parseFloat(getComputedStyle(grid).columnGap) || 14, col = (grid.clientWidth - gap * 5) / 6, left = el.getBoundingClientRect().left;

        const span = (ev.clientX - left + gap) / (col + gap);

  // ── Paste an ROI calc link into the folder ──
  // Short cloud links (?id= / ?ids=) file the existing scenario(s); long param links become a new scenario.
  $('sections').addEventListener('input', e => { if (e.target.classList.contains('roilink')) roiDraft = e.target.value; });
  $('sections').addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.classList.contains('roilink')) { e.preventDefault(); saveRoiLink(e.target.parentNode.querySelector('[data-act="roisave"]')); }
  });
  const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  // Same naming as the calc's ☁ Cloud Save, so pasted scenarios read the same as tabs.
  function roiLabel(p) {
    if (p.get('rom') === '1') return 'No Protection (Returns)';
    let s = 'Protection';
    if (p.get('re') === '1') s += ' + Returns';
    if (p.get('cbe') === '1') s += ' + Cashback';
    return s;
  }
  async function fileScenario(id, f) {
    if ([...scenarios, ...unfiled].some(x => x.id === id && x.merchant_ref === f.id)) return 'already';
    const known = [...scenarios, ...unfiled].find(x => x.id === id);
    // Unfiled (or unknown) → move it here. Already in another folder → copy, so that folder keeps it.
    if (!known || !known.merchant_ref) {
      try { await SIsb.linkScenario(id, f.id); return 'filed'; } catch (x) { /* not the owner → copy below */ }
    }
    const row = await SIsb.loadConfig(id);
    await SIsb.saveConfig({ merchant: f.name, merchant_ref: f.id, kind: 'roi', title: row.title || roiLabel(new URLSearchParams((row.data || {}).q || '')), data: row.data || {} });
    return 'copied';
  }
  async function saveRoiLink(btn) {
    const f = folders.find(x => x.id === openId); if (!f || !btn) return;
    const raw = (btn.parentNode.querySelector('.roilink').value || '').trim();
    if (!raw) { toast('Paste an ROI calc link first'); return; }
    let u;
    try { u = new URL(/^https?:\/\//i.test(raw) ? raw : 'https://' + raw); } catch (x) { toast('That doesn’t look like a link'); return; }
    const p = u.searchParams;
    const ids = (p.get('ids') || p.get('id') || '').split(',').map(x => x.trim()).filter(x => UUID.test(x));
    const params = ['orders', 'aov', 'mname', 'claims', 'premium', 'template'].some(k => p.has(k));
    if (!ids.length && !params) { toast('That isn’t an ROI calc link'); return; }
    btn.disabled = true;
    try {
      let msg;
      if (ids.length) {
        const res = [];
        for (const id of ids) res.push(await fileScenario(id, f));
        const n = k => res.filter(r => r === k).length;
        msg = res.every(r => r === 'already') ? 'Already in ' + f.name
          : (ids.length > 1 ? (ids.length - n('already')) + ' scenarios saved to ' : 'Saved to ') + f.name + (n('copied') ? ' (copied)' : '');
      } else {
        // Long link → new scenario. Drop routing params; keep the calc params + hash (logo etc.).
        ['id', 'ids', 't', 'opt'].forEach(k => p.delete(k));
        await SIsb.saveConfig({ merchant: f.name, merchant_ref: f.id, kind: 'roi', title: roiLabel(p), data: { q: p.toString(), hash: u.hash || '' } });
        msg = 'Saved to ' + f.name;
      }
      roiDraft = '';
      await loadAll(); renderDetail(); toast(msg);
    } catch (x) { btn.disabled = false; toast('Couldn’t save it: ' + (x.message || x)); }
  }

  // File an existing Proposal / MSA / MNDA (PDF/Word) or Checkout / Email / Claim mockup (PDF/image) — upload or paste a link.
  const MAX_DOC = 25 * 1024 * 1024;
  function addDoc(kind, how) {
    const f = folders.find(x => x.id === openId); if (!f) return;
    const label = (SECTIONS.find(s => s.kind === kind) || {}).label || kind;
    if (how === 'addlink') {
      let url = (prompt('Paste the link to the existing ' + label + (MOCKUP_KINDS[kind] ? ' mockup (e.g. a Figma file):' : ' (e.g. a Google Doc):')) || '').trim();
      if (!url) return;
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      try { new URL(url); } catch (x) { toast('That doesn’t look like a link'); return; }
      const title = (prompt('Name it:', f.name + ' ' + label) || '').trim() || (f.name + ' ' + label);
      return saveDoc({ merchant_ref: f.id, kind: kind, title: title, doc_url: url, data: { source: 'link' } }, 'Linked');
    }
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = MOCKUP_KINDS[kind]
      ? '.pdf,.png,.jpg,.jpeg,.gif,.webp,application/pdf,image/png,image/jpeg,image/gif,image/webp'
      : '.pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document';
    inp.onchange = async () => {
      const file = inp.files[0]; if (!file) return;
      if (file.size > MAX_DOC) { toast('That file is over 25 MB'); return; }
      toast('Uploading ' + file.name + '…');
      try {
        const meta = await SIsb.uploadDoc(file, f.id, kind);
        await saveDoc({ merchant_ref: f.id, kind: kind, title: file.name.replace(/\.[^.]+$/, ''), doc_url: null, data: { source: 'upload', file: meta } }, 'Uploaded');
      } catch (x) { toast('Couldn’t upload: ' + (x.message || x)); }
    };
    inp.click();
  }
  async function saveDoc(row, verb) {
    try {
      await SIsb.saveAsset(row);
      assets = await SIsb.listAssets();
      renderDetail(); toast(verb + ' to ' + ((folders.find(x => x.id === openId) || {}).name || 'the folder'));
    } catch (x) { toast('Couldn’t save it: ' + (x.message || x)); }
  }

  // Inline rename: the title turns into a text box — Enter/click away saves, Esc cancels.
  function renameRow(row, kind, id) {
    const list = kind === 'roi' ? scenarios : assets;
    const item = list.find(x => x.id === id); if (!item) return;
    const rn = row.querySelector('.rn'); if (!rn || row.querySelector('.rn-edit')) return;
    const old = item.title || '';
    const inp = document.createElement('input');
    inp.className = 'rn-edit'; inp.value = old; inp.maxLength = 120;
    inp.placeholder = kind === 'roi' ? 'e.g. Protection + Returns' : 'Name this save';
    rn.replaceWith(inp); inp.focus(); inp.select();
    let done = false;
    const finish = async save => {
      if (done) return; done = true;
      const title = inp.value.trim();
      if (!save || !title || title === old) { renderDetail(); return; }
      inp.disabled = true;
      try {
        await SIsb.renameSave(kind, id, title);
        item.title = title; renderDetail(); toast('Renamed to “' + title + '”');
      } catch (x) { renderDetail(); toast('Couldn’t rename: ' + (x.message || x)); }
    };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); });
    inp.addEventListener('blur', () => finish(true));
  }

  // ── create / edit folder ──
  function folderForm(f) {
    const dim = document.createElement('div');
    dim.className = 'back-dim';
    dim.innerHTML = '<form class="modal" novalidate><h3>' + (f ? 'Edit folder' : 'New merchant folder') + '</h3>' +
      '<p>' + (f ? 'Renaming keeps every save in this folder.' : 'One folder per merchant. Every tool saves into the active merchant’s folder.') + '</p>' +
      '<div class="field"><label>Merchant name</label><input id="fName" value="' + esc(f ? f.name : '') + '" placeholder="e.g. Original Grain" required></div>' +
      '<div class="field"><label>Store URL (optional)</label><input id="fDomain" value="' + esc(f ? f.domain || '' : '') + '" placeholder="originalgrain.com"></div>' +
      '<div class="field"><label>Logo (optional)</label><div class="logo-pick"><div id="fLogoPrev">' + (f ? logoHtml(f) : logoHtml({ name: '?' })) + '</div>' +
      '<button class="btn small" type="button" id="fLogoBtn">Upload logo</button>' + (f && f.logo_path ? '<button class="btn small ghost" type="button" id="fLogoClear">Remove</button>' : '') +
      '<input type="file" id="fLogo" accept="image/*" hidden></div></div>' +
      '<div class="err" id="fErr"></div>' +
      '<div class="mactions"><button class="btn" type="button" id="fCancel">Cancel</button><button class="btn primary" type="submit" id="fSave">' + (f ? 'Save' : 'Create folder') + '</button></div></form>';
    document.body.appendChild(dim);
    let logoData, logoCleared = false;   // undefined = unchanged
    const close = () => dim.remove();
    dim.addEventListener('mousedown', e => { if (e.target === dim) close(); });
    dim.querySelector('#fCancel').onclick = close;
    dim.querySelector('#fLogoBtn').onclick = () => dim.querySelector('#fLogo').click();
    const clr = dim.querySelector('#fLogoClear'); if (clr) clr.onclick = () => { logoCleared = true; logoData = undefined; dim.querySelector('#fLogoPrev').innerHTML = logoHtml({ name: dim.querySelector('#fName').value || '?' }); };
    dim.querySelector('#fLogo').onchange = e => {
      const file = e.target.files[0]; if (!file) return;
      const r = new FileReader();
      r.onload = () => { const im = new Image(); im.onload = () => {
        const k = Math.min(1, 256 / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement('canvas');
        c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        logoData = c.toDataURL('image/png'); logoCleared = false;
        dim.querySelector('#fLogoPrev').innerHTML = '<div class="logo"><img src="' + logoData + '" alt=""></div>';
      }; im.src = r.result; };
      r.readAsDataURL(file);
    };
    dim.querySelector('form').onsubmit = async e => {
      e.preventDefault();
      const name = dim.querySelector('#fName').value.trim(), domain = dim.querySelector('#fDomain').value.trim().replace(/^https?:\/\//i, '').replace(/\/$/, '');
      const err = dim.querySelector('#fErr');
      if (!name) { err.textContent = 'Enter the merchant’s name.'; return; }
      const save = dim.querySelector('#fSave'); save.disabled = true; err.textContent = '';
      try {
        let logoUrl;
        if (logoData) logoUrl = await SIsb.uploadLogo(logoData);
        else if (logoCleared) logoUrl = null;
        let saved;
        if (f) {
          if (name.toLowerCase() !== f.name.toLowerCase() && folders.some(x => x.id !== f.id && x.name.toLowerCase() === name.toLowerCase())) throw new Error('Another folder already uses that name.');
          saved = await SIsb.updateFolder(f.id, { name: name, domain: domain || null, logoUrl: logoUrl });
          Object.assign(f, saved);
          const act = SIsb.getActiveFolder(); if (act && act.id === f.id) { SIsb.setActiveFolder({ id: f.id, name: f.name, logo_path: f.logo_path }); hub({ type: 'active' }); }
          close(); renderDetail(); toast('Folder updated');
        } else {
          saved = await SIsb.createFolder({ name: name, domain: domain || null, logoUrl: logoUrl || null });
          const i = folders.findIndex(x => x.id === saved.id);
          if (i >= 0) folders[i] = Object.assign(folders[i], saved); else folders.push(saved);
          activate(saved);
          close(); showFolder(saved.id); toast(saved.existed ? 'That folder already existed — opened it' : 'Folder created and set as active');
        }
      } catch (x) { err.textContent = x.message || String(x); save.disabled = false; }
    };
    setTimeout(() => dim.querySelector('#fName').focus(), 30);
  }

    } catch (x) { toast('Error: ' + (x.message || x)); }
  }
  $('signinBtn').addEventListener('click', signIn);

  async function boot() {
    try { user = await SIsb.currentUser(); } catch (e) { user = null; }
    $('acct').innerHTML = user ? esc(user.email) + ' · <button class="btn small ghost" type="button" id="soBtn">Sign out</button>' : '';
    if (user) $('soBtn').onclick = async () => { await SIsb.signOut(); location.reload(); };
    $('newBtn').hidden = !user;
    if (!user) { $('signin').hidden = false; return; }
    loadLayoutSettings();
    try { await loadAll(); }
    catch (x) { $('listView').hidden = false; $('grid').innerHTML = '<div class="empty" style="grid-column:1/-1"><b>Couldn’t load folders</b>' + esc(x.message || x) + '</div>'; return; }
    const want = (location.hash.match(/f=([\w-]+)/) || [])[1];
    want && folders.some(f => f.id === want) ? showFolder(want) : showList();
  }

  // Active merchant changed elsewhere (another tab or the Hub chip) → repaint.
  SIsb.onActiveFolder(() => openId ? renderDetail() : renderList());
  // Rep Hub theme hand-off
  const setTheme = t => document.body.classList.toggle('pm', t === 'midnight');
  setTheme(new URLSearchParams(location.search).get('theme'));
  window.addEventListener('message', e => {
    const d = e.data || {};
    if (d.siHub === 'apply' && d.theme) setTheme(d.theme);
    if (d.siHub === 'refresh') loadAll().then(() => openId ? renderDetail() : renderList()).catch(() => {});
  });
  boot();
</script>
</body>
</html>
